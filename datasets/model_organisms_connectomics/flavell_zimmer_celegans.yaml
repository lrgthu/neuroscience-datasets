modeling:
  recommended_tasks:
    - exact_cell_identified_cross_animal_foundation_models
    - em_connectome_plus_gap_junction_vs_functional_dynamics
    - multi_timescale_behavior_and_internal_state_encoding
    - low_dimensional_attractor_and_manifold_discovery
  standard_splits: "Leave-K-Worms-Out (`e.g., 32 train / 8 test` across the `40` baseline freely moving worms in `Atanas et al. 2023`, matching exact named neurons such as `AVA`, `RIB`, `RIM`, `AIY`, `SMDV`, `NSM` across individuals!), plus within-worm chronological splits across heat-stimulus/roaming-dwelling state switches."
  noise_ceiling_or_repeat_structure: "Deterministic invariant *C. elegans* lineage (`302` hermaphrodite neurons with exact `NeuroPAL` `4`-fluorophore barcode IDs from `Yemini et al., Cell, 2021`) enables **exact neuron-to-neuron (`1:1`) cross-animal noise ceilings** across `40+` freely moving individuals!"
  key_pitfalls:
    - "IMMOBILIZED (`KATO 2015`) VS. FREELY MOVING (`ATANAS 2023`) DYNAMICAL DIVERGENCE: In microfluidic immobilization (`Kato et al. 2015`), brain dynamics collapse onto a highly stereotyped `2D/3D` forward–reversal limit cycle (`AVA`/`RIB`), whereas in freely moving worms (`Atanas et al. 2023`), ~30% of neurons dynamically remap their behavioral tuning across locomotion, head curvature, feeding (`pumping`), and internal arousal states—never assume immobilized manifolds capture natural sensorimotor coding!"
    - "CHEMICAL SYNAPSES + GAP JUNCTIONS != FUNCTIONAL CORRELATION ALONE: Even with complete EM chemical + electrical connectomes (`White et al., 1986`; `Witvliet et al., Nature, 2021`) and exact `NeuroPAL` IDs, `>50%` of rapid functional interactions in *C. elegans* are mediated or gated by extrasynaptic **monoamines (`5-HT`, `tyramine`, `octopamine`) and wireless neuropeptide GPCR networks** (`Ripoll-Sánchez et al., Neuron, 2023`)!"
    - "PARTIAL `NEUROPAL` CONFIDENCE & MOTION ARTIFACT CONTROLS (`GFP` CHANNEL!): Not all `~150` tracked nuclei in a given worm receive high-confidence `NeuroPAL` labels (`check ID confidence scores!`), and severe worm body bending induces optical z-shear—always validate against the Flavell Lab calcium-insensitive **`GFP` motion-control worms** and dual-channel ratiometric (`GCaMP7f / mNeptune2.5`) traces!"
