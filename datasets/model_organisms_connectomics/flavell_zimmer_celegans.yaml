summary_en: "Cell-identified whole-brain calcium imaging & behavioral kinematics in Caenorhabditis elegans—combining the Flavell Lab freely moving NeuroPAL atlas (Atanas et al. Cell 2023; DANDI:000776 / wormwideweb.org, N=40+ worms, ~120–180 named head neurons mapped to the 302-neuron White/Witvliet EM connectome) and the Zimmer Lab global motor-manifold benchmark (Kato et al. Cell 2015)."
summary_zh: "秀丽隐杆线虫（C. elegans）精确命名单细胞全脑钙成像与行为运动学核心资源：融合 MIT Flavell 实验室自由运动 NeuroPAL 全脑图谱（Atanas et al., Cell, 2023；DANDI:000776，>40 条线虫，每条 ~120–180 个精确对应至 302 神经元电镜连接组的命名神经元）与 Zimmer 实验室全局低维运动流形经典基准（Kato et al., Cell, 2015）。"
