modeling:
  recommended_tasks:
    - connectome_constrained_whole_brain_spiking_simulation
    - graph_neural_network_cell_type_and_motif_discovery
    - bilateral_hemispheric_symmetry_and_stereotypy_analysis
    - cross_connectome_alignment_flywire_vs_hemibrain
  standard_splits: "Evaluate graph/cell-type models across left vs. right hemisphere homologous subgraphs (`8,453` cell types matched bilaterally across `FAFB` left, `FAFB` right, and `Hemibrain` in `Schlegel et al. 2024`), or validate connectome-constrained LIF simulations (`Shiu et al. 2024`) on held-out sensorimotor optogenetic/behavioral perturbations."
  noise_ceiling_or_repeat_structure: "Internal bilateral symmetry (`Left` vs. `Right` hemisphere within FAFB) plus cross-individual stereotypy against Janelia `Hemibrain` (`Scheffer et al. 2020`) quantify biological wiring variability vs. reconstruction noise (`strong ≥5-synapse connections show >90% cross-hemisphere/cross-brain stereotypy`)."
  key_pitfalls:
    - "WEAK SINGLE-SYNAPSE FALSE POSITIVES (`APPLY ≥5 SYNAPSE THRESHOLD!`): Automated cleft/synapse detection (`Buhmann et al.`) yields ~54.5M raw synaptic links, including ultra-weak `1–4` synapse contacts prone to cleft assignment noise and developmental stochasticity—FlyWire flagship analyses (`Dorkenwald et al. 2024`; `Shiu et al. 2024`) apply a canonical **`syn_count ≥ 5`** threshold (`~15M` high-confidence synapses across `~2.6M` directed neuron pairs) unless modeling sub-threshold statistics explicitly!"
    - "MISSING ELECTRICAL GAP JUNCTIONS, NEUROPEPTIDES & RECEPTOR POLARITY: `4 × 4 × 40 nm` ssTEM resolves chemical synapses and EM-predicted presynaptic neurotransmitters (`ACh`, `GABA`, `Glutamate`, `Dopamine`, `Serotonin`, `Octopamine` via `Eckstein et al., Cell, 2024`), but **cannot** resolve `Innexin` electrical gap junctions, volume-transmitted neuropeptides/monoamines, or excitatory vs. inhibitory postsynaptic glutamate-gated chloride (`GluClα` inhibitory!) receptor signs!"
    - "IMMUTABLE `v783` SNAPSHOT VS. LIVE CAVE ROOT IDS: Neuron `root_id`s (`7205759406...` 64-bit supervoxel roots) change whenever edits occur in live CAVE—always pin analyses and model weights to **materialization version `783`** (`Zenodo:10676866`) for exact reproducibility!"
    - "TRUNCATED NECK CONNECTIVE (`DESCENDING / ASCENDING` AXONS): `FAFB` ends at the cervical connective; motor neurons and ventral nerve cord (`VNC`) circuits require bridging `FlyWire` descending/ascending types to the male `MANC` (`Takemura et al. 2024`) or female `FANC` VNC connectomes."
