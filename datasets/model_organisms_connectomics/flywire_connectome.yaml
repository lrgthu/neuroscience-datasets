summary_en: "First complete neuron-and-synapse wiring diagram of an adult central brain (female Drosophila melanogaster FAFB v783), mapping all 139,255 proofread neurons, ~54.5 million chemical synapses, 8,453 hierarchical cell types, and predicted neurotransmitters across both hemispheres and optic lobes."
summary_zh: "首个成年动物完整全脑突触级连接组图谱（雌性果蝇 FAFB v783），经 AI 分割与全球社区校对完整重建全部 139,255 个全脑神经元、约 5,450 万个化学突触、8,453 种层级细胞类型及预测神经递质，直接驱动全脑脉冲计算仿真模型。"
