    method_paper: "https://doi.org/10.1038/nmeth.2434"
  download_cli: "# Browse and download per-fish HDF5/.mat files (`CellResp`, `BrainRegion`, `Behavior`) via Figshare REST API:\ncurl -s https://api.figshare.com/v2/articles/7272617 | python3 -m json.tool | head -n 40"
modeling:
  recommended_tasks:
    - cross_animal_whole_brain_latent_dynamics_alignment
    - convergent_sensorimotor_transformation_modeling
    - multi_region_switching_linear_dynamical_systems_rslds
    - spontaneous_vs_evoked_brain_wide_functional_clustering
  standard_splits: "Leave-One-Fish-Out (`LOFO` across `N = 18` Z-Brain-registered fish) for cross-individual functional atlas and latent-manifold alignment (`LFADS`, `rSLDS`, `CEBRA`, `POYO`), OR chronological `80/20` trial-block splits within each fish across the cycling multi-stimulus battery."
  noise_ceiling_or_repeat_structure: "Cycling periodic trials of phototaxis (`left/right` half-field illumination), forward/backward drifting optomotor gratings (`OMR`), whole-field dark flashes, and looming escape stimuli within each fish (`~10–20` repeats per condition) plus `N = 18` biological replicates co-registered into `Z-Brain` (`Randlett et al.`) quantify both trial-wise `FEV` and cross-fish anatomical stereotypy."
  key_pitfalls:
    - "NON-ISOMORPHIC NEURON IDENTITY ACROSS VERTEBRATE INDIVIDUALS (`~80k` CELLS ARE NOT `1:1` NAMED!): Unlike *C. elegans* (`302` invariant named cells) or adult *Drosophila* cell types, two larval zebrafish do NOT have `1:1` deterministic soma coordinates—never align neuron index `i` in Fish A directly to index `i` in Fish B; align via the `294` `Z-Brain` anatomical region masks, optimal transport, or shared behavioral/stimulus subspaces!"
    - "PARALYZED CLOSED-LOOP FICTIVE SWIM PARADIGM: Larvae are neuromuscularly immobilized (`alpha-bungarotoxin`) for sub-micron optical stability while left/right tail motor nerve bursts (`6 kHz` suction electrodes) drive closed-loop visual feedback—proprioceptive/vestibular lateral-line feedback is absent!"
    - "SLOWER NUCLEAR `H2B-GCaMP6f` KINETICS (`~2.1 Hz`): Nuclear localization cleanly separates densely packed somata (`avoiding neuropil crosstalk`) at the cost of slower rise/decay time constants (`tau_decay ~ 1.5–2.5 s`) relative to cytosolic indicators—account for calcium convolution when inferring millisecond premotor latencies."
