year: 2018
summary_en: "Multi-animal whole-brain cellular-resolution light-sheet calcium imaging & fictive motor nerve dataset from HHMI Janelia (Chen, Mu et al. Neuron 2018; N=18 larval zebrafish, ~80,000–100,000 GCaMP6f neurons/fish registered to Z-Brain) spanning phototaxis, optomotor gratings, dark flashes, looming escape, and spontaneous behavioral state transitions."
summary_zh: "HHMI Janelia 阿伦斯实验室多体斑马鱼幼鱼全脑单细胞光片钙成像与虚拟运动神经电生理图谱（Chen, Mu et al., Neuron, 2018；共 18 条幼鱼，每条约 8 万–10 万个 GCaMP6f 神经元并统一配准至 Z-Brain 标准脑图谱），覆盖趋光、视动反应、暗闪、逼近逃逸及自发脑状态切换。"
scale:
  n_subjects: 18
  hours_per_subject: 0.9
  total_hours: 16.0
  n_stimuli: 6
  n_channels_or_voxels: "~80,000–100,000 segmented nuclear GCaMP6f neurons per larval zebrafish (`~1.5M+` total recorded neurons across N=18 fish registered to 294 Z-Brain anatomical masks)"
  sampling_rate_or_tr: "2.1 Hz whole-brain volumetric dual-beam light-sheet imaging + 6,000 Hz bilateral ventral motor nerve root fictive swim electrophysiology"
brain_regions:
  - Whole-Brain_294_ZBrain_Regions
  - Optic_Tectum_Pretectum_and_Habenula
  - Anterior_Hindbrain_Rhombomeres_and_Raphe
  - Telencephalon_and_Cerebellum
data_formats:
