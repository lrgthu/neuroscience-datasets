summary_en: "Isotropic 8 × 8 × 8 nm FIB-SEM synaptic connectomes from HHMI Janelia FlyEM queried via neuPrint—spanning the adult female central brain (Hemibrain v1.2.1: ~25,000 traced neurons, ~20M synapses) and adult male Ventral Nerve Cord (MANC v1.2.1: ~23,000 neurons, ~10M T-bars / 74M PSDs)—powering connectome-constrained mechanistic vision and navigation models."
summary_zh: "霍华德·休斯医学研究所 Janelia FlyEM 基于各向同性 8×8×8 nm 聚焦离子束扫描电镜（FIB-SEM）与 neuPrint 图数据库构建的果蝇突触连接组系列：涵盖雌蝇中央脑（Hemibrain v1.2.1：约 2.5 万神经元、2,000 万突触）与雄蝇腹神经索（MANC v1.2.1：约 2.3 万神经元），直接支撑连接组约束视觉深度网络（Lappalainen et al. 2024）。"
