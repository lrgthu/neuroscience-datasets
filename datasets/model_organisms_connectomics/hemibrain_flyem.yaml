modeling:
  recommended_tasks:
    - connectome_constrained_task_optimized_dmns_flyvis
    - ring_attractor_navigation_and_mushroom_body_associative_learning
    - descending_to_motor_vnc_locomotion_circuit_modeling
    - ultra_isotropic_8nm_3d_em_segmentation_and_synapse_detection
  standard_splits: "For connectome-constrained deep mechanistic networks (`Lappalainen et al., Nature, 2024`, `flyvis`), freeze exact FlyEM synaptic stoichiometry + cell-type parameter tying (`64` optic-lobe cell types across `45,669` model cells), train solely on naturalistic optic-flow estimation (*Sintel*), and evaluate zero-shot neural tuning predictions across `20+` independent two-photon/electrophysiology studies!"
  noise_ceiling_or_repeat_structure: "`50` ensemble restarts in task-optimized connectome-constrained networks quantify degeneracy vs. topological determinacy, while repeated hexagonal retinotopic columns (`~750` ommatidial columns) and bilateral `MANC` leg/wing neuromeres (`T1/T2/T3` Left vs. Right) provide dense internal structural replication."
  key_pitfalls:
    - "VOLUME CROPPING IN `HEMIBRAIN` (`NOT` A WHOLE BRAIN!): Despite its name, `Hemibrain` (`~250 × 250 × 250 µm³` hot-knife stitched block) contains ONE central hemisphere, partial medial structures (`Central Complex`), only part of the right optic lobe, and crops out the subesophageal zone (`SEZ`) and contralateral hemisphere—always check `status == 'Traced'` and `cropped == False` in `neuPrint` so truncated arbors do not masquerade as low-degree neurons!"
    - "POLYSYNAPTIC `1-TO-MANY` INSECT T-BAR STOICHIOMETRY: A single presynaptic *Drosophila* `T-bar` contacts multiple postsynaptic densities (`PSDs`, averaging `~5–7` partners per T-bar in `MANC`/`Hemibrain`)—distinguish `pre` (`T-bar` count) from `weight` (`PSD` synapse count) when computing fan-out vs. fan-in!"
    - "SEXUAL DIMORPHISM WHEN BRIDGING `HEMIBRAIN`/`FLYWIRE` (FEMALE) TO `MANC` (MALE VNC): `Hemibrain` and `FlyWire` reconstruct **adult female** brains, whereas `MANC` reconstructs an **adult male** ventral nerve cord (`fruitless`/`doublesex` courtship song & abdominal motor circuits are male-specific!)."
