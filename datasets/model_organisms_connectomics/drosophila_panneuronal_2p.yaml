summary_en: "Pan-neuronal whole-brain functional calcium imaging in behaving adult Drosophila—pairing high-resolution volumetric two-photon locomotion dynamics registered to the FDA/FlyWire template (Brezovec et al. Current Biology 2024; DANDI:000727) with high-speed whole-brain walk/groom/sensory recordings (Aimon et al. PLOS Biology 2019; CRCNS:fly-1)—bridging static FlyWire/Hemibrain EM wiring to live adult brain dynamics."
summary_zh: "行为态成年果蝇全脑泛神经元功能钙成像代表性资源：结合配准至标准脑模板的高分辨率双光子全脑步行运动动力学图谱（Brezovec et al., Current Biology, 2024；DANDI:000727）与高速全脑刺激/行走/理毛状态记录（Aimon et al., PLOS Biology, 2019；CRCNS:fly-1），架起果蝇电镜连接组与活体全脑神经动力学之间的桥梁。"
scale:
  n_subjects: 75
  hours_per_subject: 0.45
  total_hours: 34.0
  n_stimuli: 4
  n_channels_or_voxels: "Whole-central-brain supervoxels / neuropil parcels registered to FDA (`Functional Drosophila Atlas`, ~3.3 × 3.3 × 5 µm³) & JRC2018 / Ito neuropils (~25–80+ flies across cohorts)"
  sampling_rate_or_tr: "Volumetric Two-Photon ~1.8–2.8 Hz across central brain z-stacks + 50–100 Hz FicTrac spherical-treadmill forward/rotational/lateral velocity (plus 20–200 Hz fast light-field comparison runs in CRCNS:fly-1)"
