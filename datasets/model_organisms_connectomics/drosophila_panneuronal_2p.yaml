    - brain_wide_locomotor_velocity_and_turn_anticipation_decoding
    - cross_fly_functional_atlas_registration_bifrost_fda
    - state_dependent_resting_vs_walking_functional_connectivity
  standard_splits: "Leave-K-Flies-Out (`e.g., 5-fold CV` grouped strictly by individual fly ID across `FDA`-registered supervoxel volumes in `DANDI:000727`), or chronological within-fly session splits (`80%` train / `20%` held-out contiguous walking epochs with `≥15 s` calcium-decay buffer)."
  noise_ceiling_or_repeat_structure: "Cross-fly anatomical registration via `BIFROST` into the `Functional Drosophila Atlas` (`FDA`, `0.6 µm` precision, `<2–3 µm` inter-fly landmark error) enables voxelwise cross-animal forward/angular velocity tuning consistency maps across dozens of tethered walking flies."
  key_pitfalls:
    - "MASSIVE `~40%` BRAIN-WIDE LOCOMOTOR COROLLARY MODULATION (`STRINGER-IN-THE-FLY` EFFECT!): Walking vs. quiescence drives global activity increases across `~40%+` of the adult *Drosophila* brain (`Aimon et al. 2019`; `Brezovec et al. 2024`), with spatially segregated maps for forward velocity vs. left/right angular turning velocity—sensory or cognitive analyses MUST explicitly regress spherical-treadmill `FicTrac` `(v_forward, v_rotation, v_side)` kinematics!"
    - "SUPERVOXEL / NEUROPIL RESOLUTION (`NOT` SINGLE-CELL SOMA SEPARATION!): Pan-neuronal `nSyb-GCaMP6s/6f` in adult *Drosophila* densely labels intertwined synaptic neuropil processes (since insect cell bodies sit in a passive outer cortex rind away from neurite arbors!)—voxels/supervoxels integrate mixed local neurites rather than isolated cell bodies unless sparse `GAL4/Split-GAL4` lines are imaged."
    - "HEAD-FIXED CUTICLE DISSECTION HEMOLYMPH & BRAIN MOTION: Adult *Drosophila* breathing/proboscis pumping causes non-rigid brain deformation along the z-axis (`3–8 µm`), requiring dual-channel `tdTomato` structural motion registration (`ANTs` / `BIFROST`) before interpreting rapid intensity transients."
