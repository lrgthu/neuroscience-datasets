modeling:
  recommended_tasks:
    - recurrent_pattern_completion_illusory_contour_inference
    - hierarchical_global_vs_local_oddball_prediction_error
    - apical_dendrite_vs_soma_credit_assignment_plasticity
    - biologically_plausible_predictive_and_feedback_models
  standard_splits: "Condition-stratified splits contrasting generative perceptual illusions (`Kanizsa` illusory bars) against matched rotated-inducer (`amodal`/`fragment`) and real-edge controls (`DANDI:000248`); `xxxx` local vs. `xxxY` global sequence oddballs (`DANDI:000253`); and multi-day Session 1 -> 2 -> 3 unexpected Gabor-orientation / visual-flow violations (`DANDI:000037`)."
  noise_ceiling_or_repeat_structure: "High-repeat diagnostic stimulus batteries (30–400 trials per stimulus/violation condition) plus classical receptive-field mapping (`Gabor` patches) on every unit to verify spatial separation between classical RFs and illusory gap centers."
  key_pitfalls:
    - "EXACT DANDISET ID DISAMBIGUATION: On DANDI, **`DANDI:000248`** is the *OpenScope Illusion / Kanizsa Contour* dataset (`Shin et al., Nature Neuroscience, 2025`), whereas **`DANDI:000253`** is the *OpenScope Global/Local Oddball (`GLO`)* predictive-processing dataset, and **`DANDI:000037`** is the *OpenScope Credit Assignment / Somata & Distal Apical Dendrites* dataset (`Gillon et al., J. Neurosci. & Sci. Data, 2023`)—verify Dandiset IDs before scripting!"
    - "RECEPTIVE FIELD EXCLUSION IN ILLUSORY CONTOURS (`DANDI:000248`): True `IC-encoder` inference in V1 requires restricting neurons strictly to units whose classical Gabor receptive fields fall inside the **blank central gap** and do NOT overlap the Pac-Man luminance inducers—always check eye position (`pupil_x, pupil_y`) and RF overlap!"
    - "APICAL DENDRITE VS. SOMA PAIRING (`DANDI:000037`): `DANDI:000037` images `L2/3` (`Cux2`) and `L5` (`Rbp4`) somata and `L1` distal apical trunk/tuft segments in separate imaging sessions/planes across `3` days (not intracellularly paired to the exact same parent soma)—compare compartment-level population distributions and longitudinally tracked ROI trajectories (`tracked_rois`)."
