summary_en: "Shared-observatory Allen MindScope suite executing community-proposed theory-testing experiments on standardized 6-probe Neuropixels and multi-plane soma/dendrite 2-photon pipelines, anchored by Kanizsa Illusory Contours (DANDI:000248), Global/Local Oddball (DANDI:000253), and Apical-Somatic Credit Assignment (DANDI:000037)."
summary_zh: "艾伦脑科学研究所 OpenScope 开放神经科学“共享天文台”套件：利用标准化 6 探针 Neuropixels 与胞体/顶树突双光子平台执行外部理论验证实验，涵盖 Kanizsa 错觉轮廓推理（DANDI:000248）、全局/局部奇异预测编码（DANDI:000253）及跨天树突信用分配（DANDI:000037）。"
scale:
  n_subjects: 60
  hours_per_subject: 3.5
  total_hours: 250.0
  n_stimuli: 120
  n_channels_or_voxels: "Standardized 6-probe Neuropixels (~1,500–2,500 units/session across V1/HVAs/thalamus) + multi-plane 2P paired L2/3 & L5 somata and distal L1 apical dendrites (DANDI:000037, 000248, 000253)"
  sampling_rate_or_tr: "Neuropixels 30 kHz spikes / 2.5 kHz LFP; Dual-plane/Mesoscope 2P 9.5–30 Hz ΔF/F + 30 Hz running speed & infrared eye tracking"
