summary_en: "Landmark medial entorhinal cortex (MEC) Neuropixels dataset in freely moving and sleeping rats (Gardner et al., Nature 2022; >2,500 MEC neurons including single-module ensembles of 140–180+ simultaneous grid cells), proving invariant 2D toroidal continuous-attractor topology (Betti numbers 1, 2, 1)."
summary_zh: "Moser 实验室自由活动与睡眠大鼠内侧内嗅皮层（MEC）Neuropixels 网格细胞经典数据集（Gardner 等 Nature 2022，同模块同步记录逾百个网格细胞），利用持续同调拓扑数据分析首次在群体水平直接证实二维环面（Torus，Betti 数为 1, 2, 1）连续吸引子动力学。"
scale:
  n_subjects: 3
  hours_per_subject: 4.0
  total_hours: 12.0
  n_stimuli: 4
  n_channels_or_voxels: "4-shank Neuropixels 2.0 & 1.0 probes in rat MEC (~2,600+ sorted MEC units across 3 rats; 6 distinct grid modules with ~65–189 co-recorded pure grid cells per module)"
  sampling_rate_or_tr: "30 kHz Neuropixels spikes (Kilosort) + 100 Hz 3D OptiTrack 6-DOF head position/orientation tracking across Open Field, Wagon-Wheel Track, REM, and SWS"
