modeling:
  recommended_tasks:
    - persistent_cohomology_betti_number_manifold_inference
    - circular_cohomology_2d_toroidal_angle_decoding
    - cross_state_wake_rem_sws_attractor_invariance
    - multi_module_grid_cell_continuous_attractor_rnns
  standard_splits: "Cross-environment and cross-brain-state generalization on the exact same sorted grid module: fit 2D toroidal coordinates (`theta_1, theta_2`) during `Open Field (OF)` foraging and evaluate manifold preservation and pairwise phase relationships Zero-Shot on the `Wagon-Wheel` track, `REM` sleep, and `Slow-Wave Sleep (SWS)`."
  noise_ceiling_or_repeat_structure: "Four brain/behavioral states (`Open Field 1.5 × 1.5 m`, `Elevated Wagon-Wheel Track`, `REM`, `SWS`) recorded continuously on identical single units provide internal topological invariance checks (`H_0=1, H_1=2, H_2=1`) against spike-time-shuffled surrogates (`1,000` cyclic/random permutations)."
  key_pitfalls:
    - "STRICT SINGLE-MODULE CLUSTERING IS MANDATORY BEFORE TDA: Pooling grid cells from two different spatial-scale modules (`e.g., R1, R2, R3` within the same rat) yields a 4D product manifold (`T^2 × T^2`) whose dimensionality and noise destroy 3D `H_2` toroidal cavity detection—ALWAYS cluster grid cells by spacing/orientation module (`DBSCAN`/`UMAP` on spatial autocorrelograms) first!"
    - "FIRING-RATE NORMALIZATION & POINT-CLOUD DENOISING: Persistent homology (`Ripser`) on raw spike counts is easily short-circuited by global speed/theta firing-rate modulation and sparse outlier states; follow `Gardner et al. 2022` preprocessing (`Gaussian smoothing`, `L1/cosine` population vector normalization, `PCA` to `6D`, and `k-nearest-neighbor` density subsampling to `~1,200` landmark points) before Vietoris-Rips filtration."
    - "Species note: subjects (`rat_q`, `rat_r`, `rat_s`) are **Long-Evans rats** (NOT mice!), implanted with 4-shank Neuropixels 2.0 / single-shank Neuropixels 1.0 probes along the dorsoventral MEC axis."
