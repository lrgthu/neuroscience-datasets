modeling:
  recommended_tasks:
    - shared_core_readout_digital_twin_encoding
    - gaze_shifter_and_behavioral_gain_modulation
    - out_of_distribution_video_generalization
    - in_silico_maximally_exciting_inputs_mei
  standard_splits: "Official competition splits: single-repeat natural images (`~5,000`/mouse in 2022) or `~60 min` single-repeat cinematic/natural video clips (`2023`) for training/validation, evaluated on held-out multi-repeat `Live Test` and `Final Test` Oracle clips plus 5 OOD stimulus domains (`Gaussian dots`, `drifting gratings`, `pink noise`, `Monet`, `Trippy`) in Dynamic SENSORIUM 2023."
  noise_ceiling_or_repeat_structure: "Dedicated `Oracle` test images/video clips presented `10` times per session define per-neuron `Leave-One-Trial-Out Oracle Correlation` and `Fraction of Explainable Variance Explained (FEVE)` ceilings."
  key_pitfalls:
    - "SENSORIUM vs. SENSORIUM+ TRACKS (`2D Gaze Shifter` Is Crucial): In both 2022 and 2023, free eye movements shift V1 receptive fields across the screen by `5–15°`; omitting the `2D pupil center (x, y)` shifter MLP or behavioral state channels (`pupil_size`, `dilation_derivative`, `locomotion_speed`) causes dramatic drops in single-trial correlation!"
    - "NON-NEGATIVITY & POISSON-LIKE NOISE OF DECONVOLVED CALCIUM: Responses are non-negative deconvolved `GCaMP6s` traces with variance scaling roughly with mean rate—train with **Poisson negative log-likelihood** (`ELU + 1` or `Softplus` output) rather than unweighted MSE, which overfits high-firing bursts!"
    - "Filter out low-reliability neurons (`FEV < 0.15`) strictly when computing normalized `FEVE` (`dividing by near-zero explainable variance explodes`), while keeping raw `Single-Trial Correlation` and `Correlation-to-Average` across all neurons per the official Sinz/Ecker competition metrics."
