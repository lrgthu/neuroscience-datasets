summary_en: "Standardized NeurIPS mouse V1 neural system identification benchmarks combining SENSORIUM 2022 (7 mice, 28,068 L2/3 neurons, static natural images + gaze/pupil/locomotion) and Dynamic SENSORIUM 2023 (10 mice, 78,853 neurons, natural & OOD dynamic videos)."
summary_zh: "NeurIPS 小鼠初级视觉皮层（V1）“数字孪生”系统辨识双旗舰基准：整合 SENSORIUM 2022（7 只小鼠、28,068 个神经元对自然静态图像的响应）与 Dynamic SENSORIUM 2023（10 只小鼠、78,853 个神经元对自然视频及分布外刺激的动态响应，含瞳孔、注视点与跑动速度）。"
scale:
  n_subjects: 17
  hours_per_subject: 2.0
  total_hours: 34.0
  n_stimuli: 35000
  n_channels_or_voxels: "SENSORIUM 2022: 28,068 V1 L2/3 neurons across 7 mice (~4,000/mouse); Dynamic SENSORIUM 2023: 78,853 V1 L2–L5 neurons across 10 mice (~7,885/mouse)"
  sampling_rate_or_tr: "Multi-plane 2-Photon ~8 Hz volume scan (deconvolved activity resampled/aligned with 30 Hz video, treadmill velocity, pupil dilation, and 2D gaze coordinates)"
