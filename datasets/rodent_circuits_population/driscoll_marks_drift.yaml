modeling:
  recommended_tasks:
    - cross_day_decoder_degradation_and_manifold_alignment
    - gratings_vs_natural_movies_stimulus_dependent_drift
    - adaptive_homeostatic_readout_and_bci_recalibration
    - single_cell_turnover_vs_population_geometry_invariance
  standard_splits: "Train linear/nonlinear decoders or latent subspaces on `Day t_0` (within-day `5`-fold trial CV baseline) and evaluate zero-shot transfer across increasing lag `Δt ∈ {1, 2, ..., 30–49}` days (`Decoder(t_0 -> t_0 + Δt)` vs. within-day `Decoder(t_0 + Δt -> t_0 + Δt)` ceiling)."
  noise_ceiling_or_repeat_structure: "Within-session split-half tuning reliability (`even` vs. `odd` trials of virtual T-maze left/right runs or `20–30` repeats of `30 s` natural movies & `12`-direction gratings) normalizes raw cross-week correlation decay against single-day measurement noise!"
  key_pitfalls:
    - "ARCHIVE ID VERIFICATION (`Dryad:10.25349/D9M606`, NOT `DANDI:000049`): Marks & Goard (2021) is archived on **Dryad (`10.25349/D9M606`)**, and Driscoll et al. (2017) is archived on **Dryad (`10.5061/dryad.gqnk98sjq`)**; `DANDI:000049` is an unrelated single-session Allen Institute `TF × SF` grating dataset—do not confuse them!"
    - "Z-PLANE REGISTRATION DRIFT & NUCLEAR-FILLED EXCLUSION ARTIFACTS: Apparent multi-week 'representational drift' can be severely inflated by subtle (`2–5 µm`) axial focal-plane tilt, GCaMP6s cytomorbid nuclear filling, or ROI segmentation mismatch—always verify stable structural morphology/correlation metrics and compare **within-neuron grating stability vs. natural-movie drift recorded in the EXACT same session** (`Marks & Goard 2021` internal control!)."
    - "BEHAVIORAL TRAJECTORY DRIFT IN VR (`Driscoll 2017`): Even when task accuracy plateaus (`>85–90%`), subtle week-to-week shifts in running velocity or view angle (`θ_VR`) along the T-maze stem can mimic neural tuning drift—condition on matched kinematic bins `(y_pos, velocity, view_angle)` before attributing turnover to intrinsic synaptic plasticity."
