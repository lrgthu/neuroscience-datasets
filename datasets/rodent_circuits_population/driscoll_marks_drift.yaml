summary_en: "Canonical multi-week chronic 2-photon representational drift benchmarks pairing association-cortex virtual T-maze navigation (Driscoll et al., Cell 2017; Dryad:10.5061/dryad.gqnk98sjq) with sensory-cortex natural movie vs. grating stability over 5–7 weeks (Marks & Goard, Nat. Commun. 2021; Dryad:10.25349/D9M606)."
summary_zh: "跨数周慢性双光子“表征漂移（Representational Drift）”双经典基准：联合后顶叶联合皮层（PPC）虚拟 T 迷宫导航跨月追踪数据（Driscoll 等 Cell 2017）与初级视觉皮层（V1）自然视频对比人工光栅的 5–7 周刺激依赖型漂移数据（Marks & Goard 2021）。"
scale:
  n_subjects: 18
  hours_per_subject: 8.0
  total_hours: 140.0
  n_stimuli: 14
  n_channels_or_voxels: "Driscoll 2017: ~300–600 chronically tracked PPC L2/3 GCaMP6s neurons/mouse across up to 4–8 weeks; Marks & Goard 2021: ~2,900+ chronically tracked V1 L2/3 GCaMP6s neurons across 12 mice over 5–7 weekly sessions"
  sampling_rate_or_tr: "Driscoll PPC: ~5.3–15 Hz 2P ΔF/F & deconvolved events + spherical treadmill VR kinematics; Marks & Goard V1: 10 Hz 2P GCaMP6s + pupil & running wheel"
