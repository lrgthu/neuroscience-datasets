  license: CC-BY-4.0
  primary_portal: "DANDI / Janelia Figshare / CRCNS"
  accession_ids:
    - "DANDI:000363"
    - "DANDI:000221"
    - "DANDI:000009"
    - "Figshare:10.25378/janelia.7489253"
    - "CRCNS:alm-5"
  urls:
    homepage: "https://dandiarchive.org/dandiset/000363"
    dandi_go_cue: "https://dandiarchive.org/dandiset/000221"
    inagaki_figshare: "https://doi.org/10.25378/janelia.7489253"
    paper_cell2024: "https://doi.org/10.1016/j.cell.2023.12.035"
