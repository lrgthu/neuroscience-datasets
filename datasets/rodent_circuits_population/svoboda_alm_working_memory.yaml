year: 2024
summary_en: "Canonical short-term memory and motor-planning electrophysiology resource pairing ALM discrete-attractor perturbation recordings (Inagaki et al., Nature 2019; CRCNS:alm-5) with the petascale multi-Neuropixels brain-wide Mesoscale Activity Map (Chen et al., Cell 2024; DANDI:000363)."
summary_zh: "经典的短期工作记忆与运动规划电生理基准：结合小鼠前外侧运动皮层（ALM）光遗传微扰离散吸引子数据集（Inagaki 等 Nature 2019，CRCNS:alm-5）与全脑多探针 Neuropixels 记忆引导运动图谱（Chen 等 Cell 2024，DANDI:000363）。"
scale:
  n_subjects: 90
  hours_per_subject: 3.0
  total_hours: 300.0
  n_stimuli: 8
  n_channels_or_voxels: "DANDI:000363 (>65,000 sorted Neuropixels units across >700 probe insertions spanning ALM, thalamus, basal ganglia, midbrain, cerebellum & medulla) + CRCNS:alm-5 intracellular/64-ch silicon-probe perturbation units"
  sampling_rate_or_tr: "30 kHz Neuropixels 1.0/2.0 & 64-ch silicon-probe spikes + 300–400 Hz multi-view high-speed orofacial/tongue kinematics (DeepLabCut) and dual-lickport sensors"
brain_regions:
  - Mouse_ALM_Frontal_Motor_Cortex
  - Mouse_VM_VAL_MD_Motor_Thalamus
  - Mouse_SCm_MRN_SNr_Midbrain_Basal_Ganglia
  - Mouse_Cerebellum_Pons_Medulla_Hindbrain
data_formats:
