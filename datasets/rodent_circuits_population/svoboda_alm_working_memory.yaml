  download_cli: "uvx dandi download DANDI:000363 --download dandiset.yaml && uvx dandi ls DANDI:000363 | head -n 10"
modeling:
  recommended_tasks:
    - discrete_vs_continuous_attractor_system_identification
    - causal_optogenetic_perturbation_recovery_modeling
    - coding_direction_delay_to_execution_subspace_collapse
    - multi_region_thalamocortical_midbrain_loop_rnn
  standard_splits: "Stratified trial splits separating unperturbed control trials (`Lick Left` vs. `Lick Right`, auditory/tactile sample -> `1.2–2.0 s` delay -> auditory `Go` cue) from held-out causal bilateral/unilateral ALM photoinhibition trials (`Inagaki et al. 2019`; `Chen et al. 2024`) and cross-session holdouts."
  noise_ceiling_or_repeat_structure: "Hundreds of stereotypic `Sample -> Delay -> Response` trials per session plus randomized-duration delay cohorts (`Inagaki 2019`) that dissociate time-invariant discrete-attractor endpoints from deterministic temporal ramping."
  key_pitfalls:
    - "RAMPING IN FIXED-DELAY VS. DISCRETE ATTRACTORS IN RANDOM-DELAY: On fixed-delay tasks (`1.2 s`), ALM population projections along the **Coding Direction (`CD`)** ramp monotonically; ONLY on exponentially distributed **random-delay** trials (`alm-5` / `7489253`) and causal `VGAT-ChR2` photoinhibition trials can models distinguish slow integrators from discrete two-well attractors!"
    - "PREMATURE LICKING & UNINSTRUCTED OROFACIAL MOTION DURING DELAY: Early-lick trials (`lick before Go cue`) abort/contaminate persistent delay activity, and subtle jaw/whisker posture differs between `Left` and `Right` plans—exclude early-lick trials and regress out `300–400 Hz` high-speed camera jaw/tongue keypoints (`DANDI:000363`) when isolating cognitive memory maintenance."
    - "`DANDI:000363` totals `~65.7 TB` across `174` NWB files because raw high-speed behavioral video / raw ephys streams are included alongside sorted `units`—always stream spike tables lazily via `remfile` / `dandi` rather than bulk-downloading entire terabyte assets!"
