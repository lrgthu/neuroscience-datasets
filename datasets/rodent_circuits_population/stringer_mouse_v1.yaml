modeling:
  recommended_tasks:
    - cross_validated_pca_eigenspectrum_estimation
    - high_dimensional_population_geometry
    - spontaneous_arousal_subspace_subtraction
    - kernel_alignment_spectral_bias_analysis
  standard_splits: "2,800 natural images presented TWICE (`rep 1` vs `rep 2`) for cross-validated PCA (`cvPCA`), plus low-dimensional grating/sparse-noise/whitened control stimulus sessions."
  noise_ceiling_or_repeat_structure: "Exact 2-repeat stimulus pairing (`X_1, X_2` of shape `2800 × ~10,000`) enables unbiased cross-covariance eigenspectrum estimation (`cvPCA`) free from single-trial shot-noise eigenvalue floors."
  key_pitfalls:
    - "NEVER estimate population eigenspectra with standard un-cross-validated PCA on single trials or trial averages: finite-sample Marchenko-Pastur trial noise flattens the tail! Always use **cvPCA** (`projecting Repeat 2 onto singular vectors learned on Repeat 1`) after subtracting the spontaneous behavioral subspace!"
    - "Ongoing spontaneous/face-motion fluctuations (~32-128 dimensions correlated with whisking, sniffing, and pupil) are orthogonal or weakly aligned to sensory dimensions—project out spontaneous/face-SVD dimensions measured during gray-screen intervals before estimating sensory power laws."
    - "Compute eigenspectra in `float64` (never `float32`/`float16`), as tail modes `n = 500..2800` span 3-4 orders of magnitude below the leading eigenvalue."
citations:
