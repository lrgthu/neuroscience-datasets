year: 2019
summary_en: "Simultaneous 11-plane 2-photon calcium imaging of ~10,000 mouse V1 neurons viewing 2,800 natural images (2 repeats each), establishing the high-dimensional 1/n^alpha power-law eigenspectrum benchmark."
summary_zh: "同时记录约 10,000 个小鼠初级视觉皮层（V1）神经元的 11 平面双光子钙成像经典数据集（7 只小鼠观看 2,800 张自然图像 × 2 次重复），奠定了群体编码谱幂律（~1/n^α, α≈1）与高维平滑流形几何基准。"
scale:
  n_subjects: 7
  hours_per_subject: 2.5
  total_hours: 20.0
  n_stimuli: 2800
  n_channels_or_voxels: "~10,000 simultaneously imaged V1 L2/3 excitatory neurons per recording (Suite2p deconvolved) + 500-D face motion SVDs"
  sampling_rate_or_tr: "2.5 Hz multi-plane volume rate (11 planes; 500 ms image ON + 300-500 ms ISI)"
brain_regions:
  - Mouse_VISp_V1_Layer2_3
