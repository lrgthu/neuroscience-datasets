summary_en: "Landmark dual-modality spontaneous behavior dataset (Stringer et al., Science 2019) pairing simultaneous 8-probe Neuropixels forebrain recordings (~2,500–3,000 units/mouse) and ~10,000-neuron 11-plane V1 2-photon calcium imaging with 500-D infrared orofacial motion SVD tracking."
summary_zh: "自发行为驱动全脑多维神经动力学经典数据集（Stringer 等 Science 2019）：包含 8 根 Neuropixels 探针全脑前脑同步电生理与约 10,000 神经元 11 平面 V1 双光子钙成像，并与 500 维面部微动作 SVD 特征及正交视觉刺激对比。"
scale:
  n_subjects: 12
  hours_per_subject: 2.0
  total_hours: 25.0
  n_stimuli: 32
  n_channels_or_voxels: "8 simultaneous Neuropixels 1.0 probes (~2,200–3,000 sorted units/session across forebrain/thalamus/hippocampus/midbrain) + ~10,000-neuron 11-plane V1 2P cohorts + 500-D Facemap SVDs"
  sampling_rate_or_tr: "Neuropixels 30 kHz spikes + 50 Hz infrared face video; Two-Photon 2.5–3 Hz 11-plane volumetric GCaMP6s imaging"
