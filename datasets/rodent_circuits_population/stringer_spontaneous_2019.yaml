modeling:
  recommended_tasks:
    - spontaneous_behavior_to_neural_reduced_rank_regression
    - peer_prediction_shared_variance_power_law
    - sensory_vs_behavioral_subspace_orthogonality
    - multi_area_eight_probe_communication_subspaces
  standard_splits: "Contiguous temporal block cross-validation (~60–120 s blocks; NEVER random single-frame splits!) across 1–2 hour darkness/gray-screen spontaneous recordings and interleaved 32-image repeated natural stimulus blocks."
  noise_ceiling_or_repeat_structure: "Spatial peer-prediction split (predicting held-out checkerboard planes/probe channels from remaining simultaneous neurons) bounds shared population variance (>100 reliable dimensions, ~1/n^alpha power law) during unrepeatable spontaneous behavior; 32 natural images × ~90–120 repeats benchmark sensory-behavioral orthogonality."
  key_pitfalls:
    - "DO NOT CONFUSE WITH `stringer_mouse_v1` (Nature 2019, `10.25378/janelia.6845348`): `stringer_mouse_v1` studies the 2,800-image × 2-repeat static sensory eigenspectrum in V1; THIS dataset (`stringer_spontaneous_2019`, Science 2019, `10.25378/janelia.6163622`) captures prolonged spontaneous darkness/gray-screen behavior, 500-D `Facemap` motion-energy SVDs, and the unique 8-probe simultaneous Neuropixels forebrain recordings!"
    - "TEMPORAL AUTOCORRELATION LEAKAGE: Spontaneous behavioral states (running bouts, whisking, pupil dilation, GCaMP6s decay) have autocorrelation timescales of 1–20 seconds—random frame/bin train-test splits severely inflate explained variance; always hold out contiguous multi-minute temporal blocks with buffer gaps!"
    - "When analyzing the 8-probe Neuropixels sessions (`krebs`, `waksman`, `robbins`), join spike structures in `6163622` with the histological Allen CCFv3 channel coordinates in companion Figshare `7739750` (`probeLocations.mat`)."
