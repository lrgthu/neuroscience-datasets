summary_en: "Seminal dorsal-cortex widefield calcium, cellular 2-photon, and multi-area Neuropixels dataset (Musall et al., Nature Neuroscience 2019; DOI:10.14224/1.38599) demonstrating that uninstructed movements dominate single-trial cortical dynamics during audiovisual 2AFC decision-making."
summary_zh: "皮层全视野宽场钙成像、双光子与 Neuropixels 决策动作解耦经典数据集（Musall 等 Nature Neuroscience 2019；CSHL DOI:10.14224/1.38599）：证实小鼠在视听延迟决策任务中的单试次全脑神经涨落主要由非指令性精细躯体/面部动作主导。"
scale:
  n_subjects: 22
  hours_per_subject: 3.0
  total_hours: 66.0
  n_stimuli: 8
  n_channels_or_voxels: "Dorsal cortex widefield GCaMP6s/f across 10 transgenic cell-type lines (540 × 640 px reduced to 200 spatiotemporal SVD components) + 2P L2/3 somata + cortical/subcortical Neuropixels + 2-camera video & analog movement sensors"
  sampling_rate_or_tr: "Widefield 30 Hz (15 Hz alternating 473 nm blue GCaMP + 405 nm violet hemodynamic control); 2P ~30 Hz; Neuropixels 30 kHz; 30 Hz dual infrared behavioral cameras"
