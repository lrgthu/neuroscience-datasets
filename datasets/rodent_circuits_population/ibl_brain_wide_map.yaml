  accession_ids:
    - "DANDI:000409"
    - "AWS:s3://ibl-brain-wide-map-public"
  urls:
    homepage: "https://www.internationalbrainlab.com/data"
    dandi: "https://dandiarchive.org/dandiset/000409"
    docs: "https://int-brain-lab.github.io/iblenv/"
  download_cli: "uv run --with ONE-api python -c \"from one.api import ONE; one = ONE(base_url='https://openalyx.internationalbrainlab.org'); print(len(one.search(project='ibl_neuropixel_brainwide_01')))\""
modeling:
  recommended_tasks:
    - brain_wide_distributed_coding_audit
    - bayesian_prior_vs_sensory_decoding
    - movement_confound_orthogonalization
    - multi_region_foundation_pretraining
  standard_splits: "Contiguous block/trial cross-validation respecting the 20:80 / 80:20 block-prior transitions (`50-90` trials/block; NEVER random trial splits when decoding prior belief!) + cross-session / cross-lab holdouts."
  noise_ceiling_or_repeat_structure: "Minimum >=2 independent probe insertions per brain region across independent mice/labs + standardized passive replay control period at the end of every recording session."
  key_pitfalls:
    - "SPURIOUS CORRELATION WITH SLOW BLOCK PRIORS (`Harris 2020 / Elber-Dorozko & Loewenstein`): Block prior (`p_left` switching every ~50-90 trials) is strongly autocorrelated across trials while slow neural drift also fluctuates over minutes! NEVER test block-prior decoding significance via standard i.i.d. trial permutation—you MUST use **pseudosessions** (synthetic Markov block sequences drawn from the exact generative task process)!"
    - "Uninstructed body movements (whisking, paw, licking, wheel micro-motions captured by 3-camera Lightning Pose) permeate almost all 279 brain areas—include pose/wheel kinematics in reduced-rank/GLM models before claiming purely cognitive coding."
    - "Filter units using the official IBL `label == 1.0` (IBL sliding-RP + amplitude + noise cutoff composite QC metric) rather than raw Kilosort `good` labels."
citations:
