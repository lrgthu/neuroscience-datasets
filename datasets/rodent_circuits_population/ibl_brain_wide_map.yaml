summary_en: "Landmark 12-lab brain-wide Neuropixels map (139 mice, 699 probe insertions, >620,000 neurons across 279 Allen CCFv3 brain regions) during a standardized perceptual + prior-probability decision-making task."
summary_zh: "国际脑实验室（IBL）12 家实验室联合采集的全脑神经活动图谱（139 只小鼠、699 次 Neuropixels 探针插入、跨越 279 个脑区的逾 62 万个神经元），同步记录视觉决策、贝叶斯先验切换、转轮动作与高速姿态追踪。"
scale:
  n_subjects: 139
  hours_per_subject: 2.5
  total_hours: 700.0
  n_stimuli: 9
  n_channels_or_voxels: "699 Neuropixels 1.0 probe insertions (>620,000 total sorted units; ~75,000+ QC-passing good units across 279 brain regions)"
  sampling_rate_or_tr: "30 kHz spikes / 2.5 kHz LFP + 60/150 Hz multi-camera Lightning Pose video & wheel rotary encoder"
brain_regions:
  - Whole-Brain_279_CCFv3_Regions
  - Visual_Somatosensory_Motor_Cortex
  - Prefrontal_Orbitofrontal_ACA
  - Striatum_Thalamus_Midbrain_Cerebellum_Hindbrain
