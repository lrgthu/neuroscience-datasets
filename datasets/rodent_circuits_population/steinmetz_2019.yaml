summary_en: "Pioneering brain-wide Neuropixels 1.0 survey (~30,000 neurons across 42 cortical and subcortical brain regions in 39 sessions from 10 mice) during a 2AFC / Go-NoGo visual contrast discrimination wheel-turning task."
summary_zh: "里程碑式全脑多探针 Neuropixels 1.0 视觉决策电生理数据集（10 只小鼠、39 个实验会话、覆盖皮层与皮层下 42 个脑区的约 30,000 个神经元），系统揭示感觉、选择、动作发起与任务投入度的全脑分布编码规律。"
scale:
  n_subjects: 10
  hours_per_subject: 4.0
  total_hours: 40.0
  n_stimuli: 16
  n_channels_or_voxels: "2–3 simultaneous Neuropixels 1.0 probes per session (~30,000 sorted units across 39 sessions spanning 42 Allen CCFv3 brain regions)"
  sampling_rate_or_tr: "30 kHz spikes / 2.5 kHz LFP + 100 Hz infrared eye/face video, wheel rotary encoder, and lick detector"
