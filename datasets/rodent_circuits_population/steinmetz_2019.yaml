modeling:
  recommended_tasks:
    - distributed_sensory_choice_action_decomposition
    - reduced_rank_kernel_regression_deconfounding
    - pre_stimulus_task_engagement_state_decoding
    - multi_region_spike_train_latent_dynamics
  standard_splits: "Stratified or block-contiguous trial cross-validation across the 4 × 4 (left × right ∈ {0, 0.25, 0.5, 1.0}) contrast matrix within each session, plus leave-one-session-out / leave-one-mouse-out generalization across the 39 sessions."
  noise_ceiling_or_repeat_structure: "Repeated presentations of the 16 discrete (contrast_left, contrast_right) conditions (~200–400 active trials/session) paired with a post-task passive sensory replay block (gratings, clicks, valve sounds without wheel/reward) on the exact same neurons."
  key_pitfalls:
    - "GLOBAL NON-SPECIFIC ACTION SIGNAL VS. DIRECTIONAL CHOICE: Nearly all 42 brain regions fire non-specifically around movement initiation (`Go` vs `No-Go`), whereas true contralateral-vs-ipsilateral choice selectivity prior to movement onset is sparse and concentrated in frontal cortex (`MOs`, `PL`), striatum (`CP`), and midbrain (`SCm`, `MRN`)—always fit additive event kernels separating stimulus onset, non-directional movement initiation, and signed choice!"
    - "Equal non-zero contrast (`c_L == c_R > 0`) trials are rewarded randomly (50/50) and provide the cleanest behavioral condition for isolating internal choice signals under identical sensory drive, whereas `(0, 0)` contrast trials require withholding movement (`No-Go`) for 1.5 s."
    - "Exclude `clusters._phy_annotation < 2` (MUA/noise units) before single-neuron selectivity statistics; Neuromatch Academy's popular 3-file `.npz` educational repackaging pre-bins spikes at 10 ms over a truncated 2.5 s window and omits inter-trial / passive-replay timestamps present in the full Figshare `ALF` release."
