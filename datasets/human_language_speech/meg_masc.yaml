modeling:
  recommended_tasks:
    - temporal_response_function_trf
    - phoneme_word_speech_decoding
    - acoustic_phonetic_lexical_hierarchy
    - dynamical_state_space_modeling
  standard_splits: "Story-level or contiguous non-overlapping audio segment splits (never random phoneme/word epoch splits!). Session 1 vs. Session 2 repeats enable clean within-subject reliability checks."
  noise_ceiling_or_repeat_structure: "22 of 27 subjects completed TWO full sessions (`ses-0` and `ses-1`) listening to the exact same 4 stories (~1 hour per session), providing rare single-subject test-retest noise ceilings for continuous MEG!"
  key_pitfalls:
    - "EPOCH OVERLAP LEAKAGE TRAP: Phonemes occur every ~70-90 ms while MEG responses span [-200, +800 ms]. Random train/test splitting of phoneme or word epochs leaks identical continuous sensor windows across train and test (inflating accuracy dramatically)—ALWAYS split by story or contiguous multi-second audio blocks with >=2 s guard bands!"
    - "Baseline correction (`baseline=(-0.2, 0.0)`) on fast phoneme epochs injects pre-onset activity from the preceding phoneme into the entire post-onset window; prefer high-pass filtering (0.5 Hz) on continuous runs before epoching without pre-stimulus baseline subtraction."
    - "Co-registration shifts between `ses-0` and `ses-1`: head position relative to fixed helmet sensors changes across days—align via MNE Maxwell/head-position transformation or source-space projection (`fsaverage`) before averaging sensor channels across sessions."
citations:
