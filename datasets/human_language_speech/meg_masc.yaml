year: 2023
summary_en: "High-SNR 208-channel KIT MEG dataset (N=27, 2 repeated ~1-hour sessions/subject) listening to 4 naturalistic stories with millisecond-aligned phoneme, word, morphological, and syntactic annotations."
summary_zh: "高时间分辨率自然语音 208 通道 MEG 基准（27 名被试，大多完成 2 次完全重复的约 1 小时故事收听 session），提供毫秒级音素、词法与句法对齐，是语音层级动态编码与解码的核心数据集。"
scale:
  n_subjects: 27
  hours_per_subject: 2.0
  total_hours: 50.0
  n_stimuli: 4
  n_channels_or_voxels: "208 axial gradiometer MEG channels + 3 reference channels + T1w MRI surfaces"
  sampling_rate_or_tr: "1,000 Hz (raw BIDS FIF/CON; commonly bandpassed 0.5-30/40 Hz at 100-200 Hz for TRF/decoding)"
