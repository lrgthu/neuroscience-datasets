year: 2022
summary_en: "Unique cross-modal BIDS dataset presenting an identical 6.5-minute audiovisual narrative film to N=51 intracranial ECoG/sEEG patients and N=30 3T/7T fMRI participants (with N=18 within-subject dual iEEG + fMRI overlap)."
summary_zh: "独特的跨模态颅内脑电与超高场功能磁共振数据集（OpenNeuro ds003688）：51 名颅内 ECoG/sEEG 患者与 30 名 3T/7T fMRI 被试观看同一部 6.5 分钟有声叙事短片（其中 18 名被试同时拥有自身配对的 iEEG 与 fMRI 数据）。"
scale:
  n_subjects: 63
  hours_per_subject: 0.11
  total_hours: 9.0
  n_stimuli: 1
  n_channels_or_voxels: "51 iEEG patients (subdural ECoG grids/strips + sEEG depth electrodes) + 30 whole-brain 3T/7T fMRI subjects (18 dual-modality subjects)"
  sampling_rate_or_tr: "iEEG 512–2,048 Hz + fMRI 3D PRESTO / EPI (effective volume TR = 0.608 s – 2.0 s across protocols)"
brain_regions:
  - Left_Perisylvian_STG_IFG
  - Ventral_and_Lateral_Occipitotemporal
  - Sensorimotor_and_Auditory_Cortex
  - Whole-Brain
data_formats:
