id: multimodal_ieeg_fmri_film
name: "Utrecht Open Multimodal iEEG & 7T/3T fMRI Audiovisual Film Dataset"
short_name: "Utrecht-Film-iEEG-fMRI"
category: human_language_speech
species:
  - human
