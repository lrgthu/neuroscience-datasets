  urls:
    homepage: "https://openneuro.org/datasets/ds003688"
    paper: "https://doi.org/10.1038/s41597-022-01173-0"
    code: "https://github.com/UMCU-RIBS/Open-multimodal-iEEG-fMRI-dataset"
  download_cli: "datalad install https://github.com/OpenNeuroDatasets/ds003688.git"
modeling:
  recommended_tasks:
    - within_subject_ieeg_high_gamma_to_bold_coupling
    - multimodal_audiovisual_speech_and_scene_encoding
    - developmental_lifespan_perisylvian_mapping
  standard_splits: "Contiguous block-stratified temporal cross-validation across the 13 alternating 30 s Speech+Video (`7` blocks) and Music+Video (`6` blocks) segments (390 s total), or cross-subject transfer using the N=18 dual-modality anchor cohort."
  noise_ceiling_or_repeat_structure: "Direct within-brain electrophysiological-to-hemodynamic correspondence in N=18 dual iEEG+fMRI patients, plus inter-subject correlation across N=51 iEEG and N=30 fMRI cohorts."
  key_pitfalls:
    - "30-SECOND SPEECH vs. MUSIC BLOCK-DESIGN DOMINANCE: The 6.5 min film alternates `7 × 30 s` Dutch dialogue blocks with `6 × 30 s` background-music-only visual blocks! Any speech/LLM regressor is zero during music blocks and non-zero during speech blocks, creating inflated correlations unless a binary Speech-vs.-Music boxcar + acoustic envelope are explicitly regressed out or evaluation is restricted within speech blocks!"
    - "Heterogeneous clinical hardware & 3D-PRESTO fMRI timing: iEEG sampling spans `512–2,048 Hz` across clinical amplifiers and fMRI spans fast 3T `3D-PRESTO` (`~0.608 s` volume time) and `7T` EPI; always read per-subject BIDS `*_ieeg.json` / `*_bold.json` timing sidecars and exclude `status=bad` seizure-zone electrodes."
    - "Sequential viewing order in the `N=18` overlap subset: Presurgical fMRI preceded clinical iEEG implantation, so dual-modality patients viewed the film for a second time during iEEG."
