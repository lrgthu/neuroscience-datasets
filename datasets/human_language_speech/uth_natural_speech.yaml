  urls:
    homepage: "https://openneuro.org/datasets/ds003020"
    code: "https://github.com/HuthLab/deep-fMRI-dataset"
  download_cli: "datalad install https://github.com/OpenNeuroDatasets/ds003020.git"
modeling:
  recommended_tasks:
    - voxelwise_llm_encoding
    - continuous_brain_to_text_decoding
    - timescale_hierarchy_mapping
    - acoustic_vs_semantic_variance_partitioning
  standard_splits: "Train on 26+ unique stories (up to 80+ in UTS01-UTS03); evaluate on the held-out story 'wheretheressmoke' (~10 min, 291 TRs after trimming 10 TRs onset/offset), which was repeated 5-10 times per subject."
  noise_ceiling_or_repeat_structure: "Test story 'wheretheressmoke' has 5-10 exact repetitions per subject, enabling exact single-subject explainable variance (SPE / Schoppe et al. 2016) ceiling normalization."
  key_pitfalls:
    - "Always trim the first 5-10 TRs (10-20 s) after story onset (and silence padding) before fitting or scoring FIR ridge models to avoid strong onset transient artifacts."
    - "Downsample sub-TR word/LLM embeddings to the 2.0 s TR grid using Lanczos anti-aliasing interpolation (not naive boxcar/mean binning) and stack causal FIR delays [1, 2, 3, 4] TRs (2-8 s)."
    - "Low-level speech rate, word count per TR, and spectral envelope strongly drive STG/STS and bleed into association cortex—include acoustic/phonemic nuisance regressors via banded ridge (`himalaya`) before attributing R^2 to semantics."
citations:
