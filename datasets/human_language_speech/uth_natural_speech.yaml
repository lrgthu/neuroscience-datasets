year: 2023
summary_en: "Deeply sampled within-subject 3T fMRI dataset (N=8; 6-18+ hours/subj across 27-90+ Moth Radio Hour stories) with exact phoneme/word TextGrid alignments and pycortex flatmaps."
summary_zh: "单被试超深采样的自然英语叙事 3T fMRI 基准（8 名被试收听 27–90+ 篇 Moth Radio Hour 故事，每人约 6–18+ 小时），提供音素/词级 TextGrid 时间戳与 pycortex 皮层展开图。"
scale:
  n_subjects: 8
  hours_per_subject: 11.0
  total_hours: 90.0
  n_stimuli: 95
  n_channels_or_voxels: "2.6 mm isotropic whole-brain (~70k-95k cortical voxels/subj; native & pycortex surfaces)"
  sampling_rate_or_tr: "TR = 2.0 s (multiband 2; 10 s silence padding before/after each story)"
brain_regions:
  - Auditory_Cortex_HG_PT
  - STG_STS_Wernicke
  - IFG_Broca
  - Angular_Gyrus_TPJ
  - Precuneus_Prefrontal
  - Whole-Brain
