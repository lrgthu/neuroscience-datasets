  hours_per_subject: 0.21
  total_hours: 15.5
  n_stimuli: 1
  n_channels_or_voxels: "3T GE MR750 whole-brain EPI (N=26 fMRI) + 61-channel active actiCHamp scalp EEG (N=33 clean / 49 raw)"
  sampling_rate_or_tr: "fMRI TR = 2.0 s (372 volumes) + EEG 500 Hz (time-aligned to 2,129 word & phoneme boundaries)"
