modeling:
  recommended_tasks:
    - hierarchical_syntactic_structure_vs_ngram_surprisal
    - cross_modal_fmri_eeg_speech_encoding
    - temporal_response_function_trf
  standard_splits: "Contiguous multi-minute temporal block cross-validation across the ~12.4 min story (84 sentences / 2,129 words) with >=20 s hemodynamic guard bands for fMRI, or leave-one-subject-out mixed-effects / ridge evaluation."
  noise_ceiling_or_repeat_structure: "Inter-subject correlation (ISC) across N=26 fMRI listeners and N=33/49 EEG listeners hearing the identical PSOLA-paced narration."
  key_pitfalls:
    - "TWO EPI SEQUENCE SUBGROUPS IN `ds002322`: Part of the fMRI cohort was acquired with single-echo EPI (`3 × 3 × 3 mm`, `TE = 27 ms`) and part with 3-echo EPI (`3.75 × 3.75 × 3.8 mm`, `TE2 = 27.5 ms`)! Follow `Bhattasali et al. (LREC 2020)` by extracting exclusively `echo-2` (`TE = 27.5 ms`) from the multi-echo subgroup, resampling to a uniform MNI grid, and including an acquisition-group covariate."
    - "SYNTACTIC vs. ACOUSTIC/LEXICAL COLLINEARITY: Hierarchical `CFG` and Minimalist Grammar (`MG`) node counts correlate strongly with word frequency, prosodic `F0`/intensity, and sequential n-gram/RNN surprisal—always test nested partial $\\Delta R^2$ above acoustic envelope + word onset + lexical baseline regressors (`Brennan & Hale 2019`)."
    - "Slowed audio pacing (`-20%` PSOLA): Note when extracting raw speech model (`Wav2Vec2`/`Whisper`) embeddings that the stimulus audio was slowed by 20% without pitch shift to aid comprehension in scanner noise."
