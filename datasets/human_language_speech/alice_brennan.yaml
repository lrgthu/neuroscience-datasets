summary_en: "Paired naturalistic neurolinguistics benchmark of listeners hearing Chapter 1 of Alice in Wonderland (2,129 words, ~12.4 min) across 3T fMRI (OpenNeuro ds002322, N=26) and 61-channel scalp EEG (Deep Blue Data, N=49 raw / N=33 clean) with hierarchical syntactic grammar predictors."
summary_zh: "《爱丽丝梦游仙境》第一章自然听觉理解双模态基准（共 2,129 词，约 12.4 分钟），配对提供全脑 3T fMRI（OpenNeuro ds002322，N=26）与 61 通道头皮 EEG（密歇根大学 Deep Blue，N=49 原始 / N=33 洁净），内置短语结构与最简方案（MG）层级句法标注。"
