year: 2022
summary_en: "Cross-linguistic 3T multi-echo fMRI corpus of 112 native speakers (49 English, 35 Mandarin Chinese, 28 French) listening to the complete ~100-minute Little Prince audiobook with prosodic, syntactic, and LLM annotations."
summary_zh: "跨语言自然叙事 3T 多回波 fMRI 语料库（112 名母语者：英语 49 人、中文 35 人、法语 28 人完整收听约 100 分钟《小王子》有声书），附带韵律、依存/成分句法树及词向量标注。"
scale:
  n_subjects: 112
  hours_per_subject: 1.7
  total_hours: 185.0
  n_stimuli: 9
  n_channels_or_voxels: "3T multi-echo EPI (3.75 × 3.75 × 3.8 mm, ME-ICA denoised in MNI space)"
  sampling_rate_or_tr: "TR = 2.0 s (9 audiobook runs × ~11 min per subject)"
brain_regions:
  - STG_STS
  - IFG_Triangularis_Opercularis
  - Angular_Gyrus_ATL
  - Whole-Brain
data_formats:
