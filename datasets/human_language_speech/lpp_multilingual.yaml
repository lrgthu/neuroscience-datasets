  urls:
    homepage: "https://openneuro.org/datasets/ds003643"
  download_cli: "datalad install https://github.com/OpenNeuroDatasets/ds003643.git"
modeling:
  recommended_tasks:
    - cross_lingual_representation_alignment
    - syntactic_parsing_incremental_complexity
    - multilingual_llm_encoding
  standard_splits: "9-fold leave-one-run-out across the 9 chapter runs (~11 min each), or cross-lingual transfer across EN / ZH / FR aligned at sentence/chapter level."
  noise_ceiling_or_repeat_structure: "Within-language leave-one-subject-out ISC across N=49 (EN), N=35 (ZH), and N=28 (FR) cohorts."
  key_pitfalls:
    - "Translation timelines are NOT TR-synchronous across English, Chinese, and French audio recordings—align cross-lingual representations at matched sentence/clause boundaries rather than raw TR index."
    - "Multi-echo EPI (3 echoes) was denoised with ME-ICA; avoid re-running aggressive global signal regression or duplicate motion scrubbing on already ME-ICA denoised derivatives."
    - "Tokenization granularity differs fundamentally between Mandarin characters/words and English/French whitespace words—control for syllable/phoneme rate and acoustic F0/intensity in all three languages."
