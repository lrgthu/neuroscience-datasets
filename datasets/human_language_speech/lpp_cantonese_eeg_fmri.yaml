summary_zh: "粤语声调语言老龄化自然叙事双模态基准（OpenNeuro ds004718）：52 名香港健康老年粤语母语者（平均年龄 69.1 岁）先后完成《小王子》粤语有声书收听的 3T 任务态/静息态 fMRI、64 通道头皮 EEG 及全面认知语言测验。"
