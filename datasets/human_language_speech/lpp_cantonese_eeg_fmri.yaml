    - healthy_aging_language_comprehension_lifespan_comparison
    - cantonese_six_lexical_tone_pitch_and_prosody_encoding
    - within_subject_eeg_to_fmri_multimodal_fusion
    - cross_sinitic_cantonese_vs_mandarin_lpp_alignment
  standard_splits: "4-fold leave-one-section-out cross-validation across the 4 Cantonese Little Prince narrative runs (~5 min each), or cross-dataset lifespan/typological transfer against `OpenNeuro:ds003643` (young Mandarin/English/French LPP)."
  noise_ceiling_or_repeat_structure: "Within-cohort leave-one-subject-out ISC across N=52 older Cantonese adults in both 3T fMRI and 64-ch EEG, anchored by individual cognitive reserve covariates (digit span, Flanker, verbal fluency)."
  key_pitfalls:
    - "AGING HEMODYNAMIC LAG & VASCULAR VARIABILITY (`Mean Age = 69.1 yr`): Older adults exhibit delayed, dispersed, and higher-variance neurovascular `HRF` shapes compared to young 20-year-old cohorts (`ds003643`)! Never interpret lower raw canonical-HRF correlation in `LPPHK` as neural dedifferentiation without fitting flexible `FIR` lags or canonical `HRF + temporal/dispersion derivatives` (and validating against the paired lag-free 64-ch EEG!)."
    - "SIX-TONE CANTONESE `F0` LEXICAL-PROSODIC ENTANGLEMENT: Hong Kong Cantonese encodes 6 contrastive lexical tones on almost every syllable; `F0` contour simultaneously carries lexical identity and sentence intonation—always include continuous `F0`, `|\\Delta F0|`, intensity, and syllable-onset regressors."
    - "Sequential `fMRI` and `EEG` sessions on the same 4 story sections: Because participants heard the story in both modalities on separate visits, model visit-order / repetition familiarity effects explicitly."
