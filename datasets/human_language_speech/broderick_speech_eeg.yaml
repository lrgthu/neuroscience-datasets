  standard_splits: "Leave-one-trial-out cross-validation across the 20 contiguous ~180 s audiobook trials (`trial01`..`trial20`) per subject."
  noise_ceiling_or_repeat_structure: "Group-level leave-one-subject-out TRF generalization vs. individualized within-subject 20-fold CV across 19 subjects (plus time-reversed unintelligible speech negative control!)."
  key_pitfalls:
    - "WORD ONSET IMPULSE CONFOUND: Any dense embedding vector assigned at word onset carries implicit word-onset timing energy unless a unit impulse regressor (`1` at every word onset) and acoustic envelope + envelope derivative are simultaneously fit!"
    - "Low-frequency scalp EEG filter sensitivity: N400 semantic TRFs peak in the delta/theta band (`0.5–8 Hz`, `250–450 ms` lag); aggressive high-pass filtering (`>2 Hz`) wipes out most semantic variance."
    - "Use the built-in time-reversed speech and unattended cocktail-party stream cohorts in Dryad `10.5061/dryad.070jc` as strong falsification controls ($H_0$): genuine semantic features must drop to zero on unattended/reversed speech while acoustic envelope persists."
