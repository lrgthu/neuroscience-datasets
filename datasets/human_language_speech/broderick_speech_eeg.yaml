summary_zh: "经典的 128 通道头皮脑电（EEG）自然语音与鸡尾酒会注意追踪基准（核心有声书《老人与海》N=19，另含双说话人选择性注意、噪声语音与倒放语音共 5 组对照实验），是 mTRF 声学包络与语义 N400 编码的标准试金石。"
