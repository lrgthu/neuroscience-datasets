year: 2024
summary_en: "Large-scale 85-participant, 168-hour 64-channel BioSemi scalp EEG repository of native Dutch/Flemish listeners hearing 90–150 minutes of natural audiobooks and podcasts, anchoring the ICASSP Auditory EEG Decoding Challenges."
summary_zh: "大规模自然语音 64 通道 BioSemi 头皮脑电（EEG）语料库（85 名母语被试，每人收听 90–150 分钟荷兰语有声书与播客，总计 168 小时），是 ICASSP 听觉脑电解码挑战赛的核心基准。"
scale:
  n_subjects: 85
  hours_per_subject: 2.0
  total_hours: 168.0
  n_stimuli: 60
  n_channels_or_voxels: "64-channel BioSemi ActiveTwo scalp EEG (10-20 montage)"
  sampling_rate_or_tr: "1,024 Hz BIDS BrainVision/BDF release (downsampled from 8,192 Hz hardware acquisition; 48 kHz audio)"
brain_regions:
