modeling:
  recommended_tasks:
    - speech_eeg_match_mismatch_contrastive_retrieval
    - speech_envelope_and_mel_spectrogram_reconstruction
    - cross_subject_zero_shot_auditory_eeg_generalization
    - temporal_response_function_trf
  standard_splits: "Official ICASSP Auditory EEG Challenge dual-test protocol: Task 1 / Split A evaluates unseen speech stimuli on seen training subjects (`sub-001`..`sub-071`), while Split B evaluates strictly unseen held-out subjects (`sub-072`..`sub-085`) on unseen stimuli."
  noise_ceiling_or_repeat_structure: "Multi-subject responses to shared Dutch podcast/audiobook stories across subsets of the 85 normal-hearing listeners enable inter-subject correlation (ISC) and population TRF ceilings."
  key_pitfalls:
    - "BIOSEMI UNREFERENCED RAW COMMON-MODE VOLTAGE: Raw BioSemi ActiveTwo BIDS files record relative to the active `CMS/DRL` loop rather than a physiological reference—ALWAYS re-reference (e.g., common average, `Cz`, or mastoids) and high-pass filter (`>=0.5 Hz`) before epoching or computing spatial covariances!"
    - "MATCH-MISMATCH NEGATIVE SAMPLING LEAKAGE: In `3–5 s` speech-EEG match-mismatch classification, imposter negative audio segments MUST be drawn from the exact same continuous story at a deterministic temporal offset (e.g., `+1 s` after the positive window end) rather than from different stories/speakers, otherwise models cheat via speaker prosody or recording gain!"
    - "Report Seen-Subject and Unseen-Subject generalization separately: Cross-subject zero-shot EEG accuracy drops sharply relative to subject-calibrated adapters; never average the two test subsets into a single headline number."
