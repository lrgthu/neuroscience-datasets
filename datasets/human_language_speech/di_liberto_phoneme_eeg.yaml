    - forward_and_backward_mtrf_speech_tracking
  standard_splits: "20-fold leave-one-trial-out cross-validation across the 20 contiguous ~180 s audiobook segments per subject."
  noise_ceiling_or_repeat_structure: "Within-subject 20-fold CV vs. leave-one-subject-out generic TRF ceiling across N=19 listeners, paired with time-reversed unintelligible speech negative controls."
  key_pitfalls:
    - "JOINT `FS` (`FEATURES + SPECTROGRAM`) vs. `S` (`SPECTROGRAM`) TEST REQUIRED: Categorical phoneme/articulatory impulses correlate strongly (`r > 0.6`) with acoustic spectrogram onsets! Never interpret standalone `Phoneme` (`P`) or `Feature` (`F`) TRF correlations as linguistic—strictly measure unique predictive gain `\\Delta r = r(FS) - r(S)` over a rich multi-band cochlear spectrogram + half-wave envelope derivative, and verify `\\Delta r \\approx 0` on time-reversed speech!"
    - "REGULARIZATION BIAS IN CONCATENATED RIDGE (`FS` vs. `S`): Concatenating `19` sparse binary articulatory features with dense `16–64` band spectrograms under a single scalar ridge penalty `\\lambda` distorts `\\Delta r` (`Daube et al., Current Biology 2019`)—always fit **Banded Ridge Regression** (`himalaya`) with independent `\\lambda_F, \\lambda_S` hyperparameters!"
    - "Preserve `1–8 Hz` delta/theta bands: Phonetic feature tracking in scalp EEG resides almost entirely in `1–8 Hz` (`100–250 ms` lag) and vanishes above `15 Hz`."
