summary_en: "Seminal 128-channel BioSemi scalp EEG natural speech benchmark (Hemingway's The Old Man and the Sea, OpenNeuro ds004408 / Dryad, N=19) demonstrating low-frequency (1–8 Hz) cortical tracking of categorical phonemes and articulatory features beyond spectrograms."
summary_zh: "奠基性的 128 通道头皮脑电（EEG）音素与发音特征自然语音追踪数据集（收听海明威《老人与海》，OpenNeuro ds004408 / Dryad，N=19），首次证明低频脑电（1–8 Hz）在声学语谱图之外编码离散音素与发音器官特征。"
