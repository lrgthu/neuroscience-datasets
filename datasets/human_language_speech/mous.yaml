modeling:
  recommended_tasks:
    - syntactic_semantic_unification
    - sentences_vs_wordlists_compositionality
    - cross_modal_fmri_meg_fusion
    - reading_vs_listening_invariance
  standard_splits: "Stratified sentence-triplet holdout (ensuring matched sentence and word-list counterparts of the same lexical items stay in the same fold!) and subject-level generalization across N=102 visual / N=102 auditory cohorts."
  noise_ceiling_or_repeat_structure: "Large sample size (N=102 per sensory modality) supports high-power group-level and cross-subject generalization ceilings across both fMRI and MEG."
  key_pitfalls:
    - "LEXICAL ITEM PAIRING: Each scrambled word-list condition is constructed by permuting words from a matched intact Dutch sentence—split train/test by underlying item ID so identical content words do not leak across folds!"
    - "Subject prefix `sub-V*` denotes visual reading (N=102) whereas `sub-A*` denotes auditory listening (N=102); sensory modality is between-subjects while neuroimaging modality (fMRI + MEG) is within-subjects."
    - "Stimuli are in Dutch—use Dutch or multilingual language models (e.g. RobBERT, EuroBERT, Llama/Qwen multilingual) matched to exact word presentation timestamps."
