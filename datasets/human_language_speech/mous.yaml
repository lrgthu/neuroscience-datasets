  hours_per_subject: 2.5
  total_hours: 510.0
  n_stimuli: 360
  n_channels_or_voxels: "3T 3.5 mm fMRI + 275-ch CTF MEG + T1w + DWI + resting-state"
  sampling_rate_or_tr: "fMRI TR = 2.0 s; MEG 1,200 Hz"
