summary_en: "Large-cohort paired multimodal dataset of 204 Dutch speakers who each completed BOTH 3T fMRI and 275-channel CTF MEG while comprehending sentences versus scrambled word lists (102 visual reading, 102 auditory listening)."
summary_zh: "大规模同被试双模态语言数据集（204 名荷兰语母语者均同时完成 3T fMRI 与 275 通道 MEG；其中 102 人视觉阅读、102 人听觉理解完整句子与打乱词表对照）。"
scale:
