  license: CC-BY-4.0
  primary_portal: OSF
  accession_ids:
    - "OSF:nrgx6"
  urls:
    homepage: "https://osf.io/nrgx6/"
    paper: "https://doi.org/10.1038/s41597-022-01542-9"
    code: "https://github.com/neuralinterfacinglab/SingleWordProductionDutch"
  download_cli: "uvx osfclient -p nrgx6 clone ./single_word_speech_ieeg"
modeling:
  recommended_tasks:
    - overt_speech_mel_spectrogram_and_waveform_synthesis
    - pre_articulatory_vs_auditory_feedback_seeg_decomposition
    - volumetric_depth_electrode_speech_bci_decoding
  standard_splits: "10-fold word-disjoint cross-validation across the 100 unique spoken Dutch stimuli per patient (zero overlapping word prompts or adjacent-trial baseline windows between train and test)."
  noise_ceiling_or_repeat_structure: "Within-patient cross-validated mel-cepstral distortion (`MCD`) and Pearson spectrogram correlation (`r`) compared against block-permuted / phase-randomized neural baselines across all 10 patients."
  key_pitfalls:
    - "CRITICAL MICROPHONIC ACOUSTIC CONTAMINATION CHECK: During overt speech (`70–500 Hz` fundamental + harmonics), airborne sound waves can mechanically vibrate clinical sEEG headboxes/cables and inject a linear spectrogram copy of the voice directly into high-gamma (`70–170 Hz`) bands (`Roussel et al., J. Neural Eng. 2020`)! ALWAYS audit zero-lag audio-to-sEEG spectral coherence and report causal pre-articulatory (`[-500, 0 ms]`) decoding separately from post-onset auditory/somatosensory feedback!"
    - "BIPOLAR / LAPLACIAN SHAFT RE-REFERENCING REQUIRED: Penetrating sEEG shafts traverse white matter, sulcal banks, and deep nuclei, picking up volume-conducted common-mode and temporalis/jaw `EMG` speech artifacts—apply local bipolar (`contact[i] - contact[i+1]`) or shaft-Laplacian re-referencing rather than monopolar mastoid references."
    - "Heterogeneous per-patient electrode trajectories: Because clinical sEEG placement is patient-individualized (`sub-01`..`sub-10`), train patient-specific spatial projections or coordinate-aware 3D MNI point-cloud encoders (`*_electrodes.tsv`) rather than stacking raw channel indices."
