year: 2022
summary_en: "Open iBIDS stereotactic depth EEG (sEEG) and time-aligned overt speech audio dataset of 10 epilepsy patients (1,103 intracranial contacts) reading aloud 100 Dutch words for speech neuroprosthesis synthesis and decoding."
summary_zh: "开源颅内立体定向脑电（sEEG）与有声词汇朗读同步数据集（OSF nrgx6，遵循 iBIDS 标准）：10 名癫痫患者（共植入 1,103 个深部电极触点）出声朗读 100 个荷兰语词与数字，广泛用于语音脑机接口（Speech BCI）声码器重建基准。"
scale:
  n_subjects: 10
  hours_per_subject: 0.15
  total_hours: 1.5
  n_stimuli: 100
  n_channels_or_voxels: "1,103 penetrating stereotactic EEG (sEEG) depth contacts across 10 patients (~90–130 contacts/patient)"
  sampling_rate_or_tr: "1,024 Hz or 2,048 Hz sEEG synchronized with 48 kHz overt microphone speech audio"
brain_regions:
  - Ventral_Sensorimotor_and_Insular_Cortex
  - Superior_Temporal_Sulcus_and_Heschls_Gyrus
  - Deep_Perisylvian_and_Subcortical_sEEG
data_formats:
