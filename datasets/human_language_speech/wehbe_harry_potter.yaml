summary_en: "Pioneering CMU naturalistic reading benchmark presenting Chapter 9 of Harry Potter word-by-word via RSVP (5,176 words at 0.5 s/word) across both 3T whole-brain fMRI (N=8) and 306-channel Elekta MEG (N=9)."
summary_zh: "卡内基梅隆大学（CMU）经典的《哈利·波特》逐词快速序列视觉呈现（RSVP，共 5,176 词，固定 0.5 秒/词）阅读数据集，同步涵盖全脑 3T fMRI（N=8）与 306 通道全头 MEG（N=9），是早期与现代 LLM 逐层脑编码的经典基准。"
scale:
  n_subjects: 8
  hours_per_subject: 0.75
  total_hours: 12.75
  n_stimuli: 5176
  n_channels_or_voxels: "~25,000–30,000 cortical voxels (3 × 3 × 3 mm 3T Siemens Verio EPI, N=8) + 306-ch Elekta Neuromag MEG (N=9)"
  sampling_rate_or_tr: "fMRI TR = 2.0 s (exactly 4 RSVP words/TR across 1,351 TRs) + MEG 1,000 Hz (0.5 s/word RSVP)"
brain_regions:
  - Ventral_Occipitotemporal_VWFA
  - Bilateral_Temporal_Parietal_Language
  - Inferior_Frontal_Gyrus
  - Whole-Brain
