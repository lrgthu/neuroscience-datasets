    paper_meg: "https://doi.org/10.3115/v1/d14-1030"
  download_cli: "curl -LO http://www.cs.cmu.edu/~fmri/plosone/files/subject_1.mat"
modeling:
  recommended_tasks:
    - voxelwise_llm_context_length_encoding
    - spatiotemporal_meg_word_reading_dynamics
    - multi_level_visual_syntactic_discourse_decomposition
  standard_splits: "4-fold leave-one-run-out cross-validation across the 4 contiguous chapter runs (~11 min / ~330 TRs per run), trimming >=10-15 TRs (20-30 s) at run boundaries to prevent BOLD autocorrelation bleed."
  noise_ceiling_or_repeat_structure: "Single-pass narrative reading; evaluate encoding correlation relative to leave-one-subject-out cross-subject predictability or anatomical/AAL ROI permutation significance (`Wehbe et al. 2014`)."
  key_pitfalls:
    - "4-WORDS-PER-TR AGGREGATION & DELAY LAGS: At 0.5 s/word and TR = 2.0 s, every fMRI volume integrates 4 consecutive words delayed by the 4-8 s BOLD hemodynamic response! Always pool/sum word features within each 2 s bin and stack finite-impulse-response lags (`t-1, t-2, t-3, t-4` TRs = 2-8 s delays)."
    - "VISUAL WORD-LENGTH CONFOUND IN OCCIPITAL CORTEX: Character count and punctuation vary systematically with word frequency and syntactic class, driving massive variance in V1-V4 under fixed-fixation RSVP—always include low-level word-length and formatting nuisance features before interpreting occipital/ventral correlations as semantic."
    - "MEG access & overlapping epochs: While the 8-subject fMRI `.mat` files download openly from CMU, the 9-subject 306-ch MEG dataset (`Figshare:20658428`) uses a lightweight academic request form; in MEG, adjacent 500 ms word epochs overlap into `[0, +800 ms]` post-word windows, requiring run-blocked CV."
