  key_pitfalls:
    - "PRECISION SMALL-N (`N=3`), DEEP-T (`10 h`) INFERENCE REGIME: Never run underpowered `N=3` group-mean t-tests (`df=2`)! Treat each 10-hour participant as a self-contained statistical replication unit via block-permutation / session-level cross-validation across `10` stories, requiring `3/3` individual-subject significance."
    - "Session-level environmental noise & CTF 3rd-order synthetic gradient: Despite physical head-cast immobilization, ambient room drift, SQUID jumps, and bad channels (`sub-001`..`sub-003` channel TSVs) vary slightly per day—always apply CTF 3rd-order gradient compensation, notch filtering (`50 Hz` harmonics), and per-session z-scoring."
    - "Never split random word/phoneme windows within a session: Consecutive words in *The Adventures of Sherlock Holmes* occur every `~250–300 ms`; strictly hold out full `~1-hour` story sessions!"
