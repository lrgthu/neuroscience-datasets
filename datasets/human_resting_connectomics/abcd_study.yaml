  standard_splits: "Leave-one-site-out (`21` sites) or site- & family-stratified `ABCD Reproducible Matched Samples` (`ARMS-1` vs. `ARMS-2`, `N ~ 5,000` each from NDA Collection 3165, keeping twins/siblings together!)."
  noise_ceiling_or_repeat_structure: "Four 5-minute rs-fMRI runs per visit + biennial longitudinal waves (`Baseline`, `Year 2`, `Year 4`, `Year 6+`) across ~11,878 participants."
  key_pitfalls:
    - "SMALL-SAMPLE BWAS REPLICABILITY LESSON (`Marek et al., Nature, 2022`): Cross-sectional brain-behavior correlations in ABCD typically have true effect sizes $|r| \\le 0.06-0.16$, requiring thousands of subjects for stable discovery—never select ROIs or tune models on small sub-samples without out-of-site validation!"
    - "Multi-vendor scanner & pediatric head motion: ABCD spans Siemens Prisma, GE MR750, and Philips Achieva/Ingenia across 21 sites, and 9-10 year-olds exhibit substantially higher head motion + respiratory pseudomotion (`0.2-0.4 Hz` notch filter required on multiband motion parameters!) than young adults—enforce strict `FD < 0.2 mm` censoring (`>= 5-8 min` clean data)!"
    - "Twin/sibling & site clustering: ABCD contains ~2,100 twin/triplet participants plus siblings—always group splits by both `rel_family_id` and `site_id_l`."
