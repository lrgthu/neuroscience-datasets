year: 2018
summary_en: "Largest US pediatric neurodevelopmental longitudinal cohort enrolling 11,878 children aged 9-10 across 21 sites (Siemens, GE, Philips 3T scanners) with biennial 2.4 mm TR=0.8 s rs-fMRI, MID/SST/EN-Back task fMRI, dMRI, genomics, and mental-health assessments."
summary_zh: "全美最大规模青少年纵向神经发育多站点影像队列（21 个站点跨越三大 MRI 厂商，基线入组 11,878 名 9–10 岁儿童并每两年随访），采集 TR=0.8 s 静息态与奖赏/抑制/情绪记忆任务态 fMRI、dMRI 及认知临床表型。"
