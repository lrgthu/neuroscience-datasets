  - WebDataset_Tar
  - NIfTI
  - Parquet_CSV
access:
  tier: open
  license: "Source-inherited OpenNeuro licenses (251 CC0-1.0, 34 PDDL-1.0, 30 unstated/CC0, 3 CC-BY-SA-4.0, 2 CC-BY-4.0, 1 CC-BY-NC-4.0; see LICENSES.tsv)"
  primary_portal: "Hugging Face"
  accession_ids:
    - "HuggingFace:cbarbano/open-fmind"
  urls:
    homepage: "https://huggingface.co/datasets/cbarbano/open-fmind"
    code: "https://github.com/carloalbertobarbano/open-fmind"
    paper: "https://arxiv.org/abs/2611.21215"
  download_cli: "uvx --from huggingface_hub hf download cbarbano/open-fmind index/preproc_timeseries.parquet LICENSES.tsv atlases.tsv --repo-type dataset"
modeling:
  recommended_tasks:
    - self_supervised_fmri_foundation_pretraining
    - multi_atlas_contrastive_representation_learning
    - functional_connectome_fingerprinting
    - parcellation_sensitivity_benchmarking
  standard_splits: "Pretrain self-supervised encoders on Open-fMIND (`quasiraw` or `preproc`, holding out any target OpenNeuro accession IDs!) and evaluate frozen/fine-tuned representations on external cohorts (e.g., HCP-YA family-aware CV, ABIDE, ADHD-200) or held-out OpenNeuro studies."
  noise_ceiling_or_repeat_structure: "1,649 multi-visit subjects (2,192 query visits across 57 datasets) enable longitudinal connectome fingerprinting (`72.0%` corpus-wide top-1 accuracy vs. `0.06%` chance; differential identifiability `I_diff = 25.5`), plus cross-atlas consistency (`median r = 0.939` within-family)."
  key_pitfalls:
    - "DOWNSTREAM BENCHMARK OVERLAP LEAKAGE: Open-fMIND pools 322 OpenNeuro studies—including `ds000113` (StudyForrest), `ds002345` (Narratives), `ds001132` (Sherlock), `ds002322` (Alice), `ds002837` (NNDb), and `ds004718` (LPP-Cantonese)! Always filter out target `dataset` accessions via the Parquet index before pretraining if evaluating on any OpenNeuro benchmark!"
    - "`preproc` SCRUBS FRAMES & BREAKS STIMULUS TIMELINE ALIGNMENT: The `preproc` split censors `FD > 0.5 mm` volumes (`58.4%` of runs drop >=1 frame) and applies a `0.01-0.1 Hz` bandpass filter—never align `preproc` directly to rapid task `events.tsv`/word timestamps; use `quasiraw` + `confounds` for stimulus-locked encoding!"
    - "HETEROGENEOUS TRs & SCANNER SITE EFFECTS: Runs retain native repetition times (`RepetitionTime` in JSON sidecars; resample explicitly before feeding fixed-rate transformers) and exhibit substantial study/scanner fingerprints (`median omega^2 = 0.082`, 268-way site accuracy `60.3%` vs `0.37%` chance) plus modest residual short-range motion (`median QC-FC r = +0.033`)."
    - "MULTI-ATLAS SAMPLING SKEW & EFFECTIVE N: Schaefer (14) and Yan (12) constitute 50% of all 52 atlases, and all 52 views are deterministic projections of the same BOLD run (`N_eff = 11,379` subjects, NOT 2.4M independent samples)—sample atlas family first, then variant, and group splits strictly by `(dataset, subject)`."
    - "NON-UNIFORM SOURCE LICENSES (`LICENSES.tsv`): Although ~97% of studies are CC0/PDDL, 3 studies carry ShareAlike (`CC-BY-SA-4.0`: `ds001439`, `ds001722`, `ds001748`) and 1 carries Non-Commercial (`CC-BY-NC-4.0`: `ds001338`)—filter shards via `LICENSES.tsv` when strict commercial/permissive licensing is required."
