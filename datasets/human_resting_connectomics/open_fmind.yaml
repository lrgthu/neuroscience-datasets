year: 2026
summary_en: "Massive uniformly preprocessed fMRI pretraining corpus pooling 322 OpenNeuro studies (11,379 subjects, 45,731 runs, 6,044 hours; 81% task / 19% rest across 429 task labels) parcellated across 52 brain atlases (~2.4M ROI timeseries) in WebDataset format."
summary_zh: "面向脑基础模型自监督预训练的大规模开放 fMRI 语料库（聚合 322 个 OpenNeuro 数据集、11,379 名被试、45,731 个扫描 run、6,044 小时，含 81% 任务态与 19% 静息态），统一经 fMRIPrep 25.2.3 处理并投影至 14 大家族 52 套脑图谱（约 240 万条 ROI 时间序列）。"
scale:
  n_subjects: 11379
  hours_per_subject: 0.53
  total_hours: 6044.0
  n_stimuli: 429
  n_channels_or_voxels: "52 brain atlases across 14 families (10 to 1,024 cortical & subcortical ROIs from 2 mm MNI152NLin2009cAsym)"
  sampling_rate_or_tr: "Source-native TR recorded in JSON sidecars (commonly resampled to TR = 2.0 s for sequence pretraining)"
brain_regions:
  - Whole-Brain_52_Atlases
  - Cortical_Schaefer_Yan_Glasser_DiFuMo
