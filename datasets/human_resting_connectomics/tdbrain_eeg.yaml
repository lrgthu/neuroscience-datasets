summary_en: "Strictly hardware-standardized 20-year clinical & normative lifespan EEG-BIDS archive (N=1,274 subjects, 1,346 sessions, ages 5–89) pairing 500 Hz 26-channel Ag/AgCl Eyes-Open & Eyes-Closed resting EEG + EOG/ECG/EMG across MDD (N=426), ADHD (N=271), SMC (N=119), OCD (N=75), and healthy controls, with locked-out clinical treatment-response replication splits."
summary_zh: "横跨二十年但硬件协议严格统一（全量 26 导 Ag/AgCl 500 Hz）的临床与全生命周期脑电 BIDS 基准库（N=1,274 名 5–89 岁受试者、1,346 次会话，涵盖抑郁症 MDD 426 例、ADHD 271 例、强迫症 OCD 75 例等及健康对照），内置盲测临床疗效预测复现集。"
scale:
  n_subjects: 1274
  hours_per_subject: 0.08
  total_hours: 112.0
  n_stimuli: 2
  n_channels_or_voxels: "26-channel Compumedics Quickcap Ag/AgCl 10-10 scalp EEG + 4 EOG + ECG + masseter EMG + skin conductance / orbicularis channels (24-bit BDF+ / BrainVision)"
  sampling_rate_or_tr: "500 Hz standardized across all 1,346 sessions (2 min Eyes-Open + 2 min Eyes-Closed resting-state; subset includes auditory oddball / Go-NoGo tasks)"
