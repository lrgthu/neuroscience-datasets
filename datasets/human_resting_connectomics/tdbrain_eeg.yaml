modeling:
  recommended_tasks:
    - clinical_eeg_foundation_model_downstream_benchmarking
    - psychiatric_diagnosis_and_comorbidity_classification
    - antidepressant_rtms_and_neurofeedback_treatment_response_prediction
    - lifespan_5_to_89_eeg_brain_age_regression
  standard_splits: "Use the official `reproducibility / blind validation` protocol (`van Dijk et al. 2022`): `30%` of the `rTMS`/`MDD` and `ADHD` treatment-outcome sub-cohorts have diagnostic/treatment-response labels blinded in `TDBRAIN_participants_V2.tsv` for prospective anti-p-hacking verification; for general diagnostic/sex/brain-age benchmarks (`LaBraM`, `EEGPT`, `CBraMod`), use subject-grouped 5/10-fold CV!"
  noise_ceiling_or_repeat_structure: "Test-retest longitudinal subset (`72` repeat sessions across `N = 1,274` unique individuals -> `1,346` total sessions) plus paired `2 min Eyes-Open` (`EO`) and `2 min Eyes-Closed` (`EC`) recordings on identical `Compumedics Quickcap` + `NuAmps` hardware across 2001–2021 (`alpha peak frequency ICC > 0.90`)."
  key_pitfalls:
    - "FORMAL VS. INFORMAL / UNKNOWN DIAGNOSTIC LABELS (`indication` vs `formal_status`): `participants.tsv` distinguishes `FORMAL` DSM-verified diagnoses (`MDD`, `ADHD`, `OCD`, `SMC`) from `INFORMAL` referral indications and `UNKNOWN` blinded replication rows—never drop `UNKNOWN` rows into the negative/healthy control class!"
    - "MULTI-SESSION LONGITUDINAL LEAKAGE (`1,346` SESSIONS > `1,274` SUBJECTS): `~70` patients have pre-/post-treatment (`ses-1`, `ses-2`, `ses-3`) recordings—always split by `participants_ID` (`sub-*`), never by session file!"
    - "LINKED-MASTOIDS ONLINE REFERENCE & `50 Hz` EUROPEAN MAINS: Raw EEG was recorded relative to `A1/A2` (average mastoids) in Nijmegen, Netherlands (`50 Hz` line noise, NOT `60 Hz`!)—re-reference to common average (`CAR`) or REST and use the official `Brainclinics/TDBRAIN` Python ocular-regression + artifact pipeline before cross-dataset transfer with US `60 Hz` corpora (`TUH-EEG`, `HBN`)."
