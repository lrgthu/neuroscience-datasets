modeling:
  recommended_tasks:
    - pediatric_adhd_diagnostic_and_subtype_classification
    - phenotypic_confound_deconfounding_and_fair_ml_auditing
    - multi_site_connectome_domain_adaptation
    - brain_foundation_model_downstream_probing
  standard_splits: "Official 2011 Global Competition split (`N = 776` training subjects across `PKU`, `KKI`, `NeuroIMAGE`, `NYU`, `OHSU`, `Pittsburgh`, `WashU` vs. `N = 197` official held-out test subjects including an entirely unseen 8th site `Brown University` `N = 26`), OR site-stratified 5/10-fold CV on the QC-passed `Athena` subset (`N ~ 759–922`)."
  noise_ceiling_or_repeat_structure: "Most sites acquire a single `6–8 min` resting-state scan (`OHSU` acquires `3 × 2.5 min` short runs; `NYU` acquires `2 × 6 min` runs), alongside 3 independent preprocessing pipelines (`Athena` AFNI/FSL, `Burner` SPM8 VBM, `NIAK` multi-scale BASC) to quantify pipeline reproducibility."
  key_pitfalls:
    - "FAMOUS BROWN ET AL. (2012) PHENOTYPIC SHORTCUT LESSON: In the official ADHD-200 Global Competition, an SVM using ONLY non-imaging personal characteristics (`site`, `age`, `sex`, `handedness`, `IQ`) achieved higher accuracy (`62.5%`) than EVERY fMRI-based team! Boys and younger/lower-IQ subjects are heavily over-represented among ADHD cases in `NYU`/`PKU` (`Pittsburgh` and `WashU` contributed ONLY controls in the training set!)—always evaluate against a `phenotypic-only` baseline and test on covariate-matched or residualized splits!"
    - "CONTROL-ONLY SITES IN TRAINING SPLIT (`Pittsburgh` & `WashU`): Two of the 8 sites (`Pittsburgh` `N=89`, `WashU` `N=61`) contributed 100% neurotypical controls and 0 ADHD cases in training—any model learning scanner fingerprints automatically predicts `Control` on those sites, inflating pooled accuracy."
    - "PEDIATRIC IN-SCANNER HYPERACTIVITY / HEAD MOTION BIAS: Hyperactive/Combined-type children move substantially more during scanning than controls; motion scrubbing/FD regression is mandatory so classifiers do not merely detect head-motion artifacts as 'ADHD connectivity'."
