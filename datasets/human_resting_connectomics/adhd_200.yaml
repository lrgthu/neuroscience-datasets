summary_en: "Pioneering 8-site pediatric clinical rs-fMRI & anatomical MRI competition benchmark (N=973 ages 7–21: 776 training + 197 held-out test across typically developing controls and ADHD-Combined, ADHD-Inattentive, and ADHD-Hyperactive subtypes), openly distributed with Athena, Burner, and NIAK preprocessed connectomes."
summary_zh: "儿科临床神经影像机器学习竞赛的开创性多中心基准（汇聚全球 8 大中心共 973 名 7–21 岁儿童青少年：776 例训练集 + 197 例官方测试集，涵盖典型发育对照与 ADHD 混合型/注意缺陷型亚型），通过 Neuro Bureau 开放提供 Athena、Burner 与 NIAK 预处理连接组。"
scale:
  n_subjects: 973
  hours_per_subject: 0.12
  total_hours: 115.0
  n_stimuli: 1
  n_channels_or_voxels: "Whole-brain 3T (plus 1.5T subgroup) EPI; Neuro Bureau Athena/NIAK parcellations: CC200, CC400, AAL-116, Eickhoff-Zilles, Talairach-Tournoux, BASC"
  sampling_rate_or_tr: "Site-dependent fMRI TR = 1.5–2.5 s (single or multi-run 5–8.5 min resting-state scan per subject)"
