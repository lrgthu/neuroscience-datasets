summary_en: "15.88 TB CC0 training-ready 4D fMRI foundation-model corpus pooling 817 OpenNeuro studies (~30,160 subjects across 30,222 WebDataset shards, 22,083 BOLD hours, >1,300 tasks; plus a 500 GB / 672-study / 725 h Hugging Face subset) minimally preprocessed in native anatomy via 6-DOF rigid SynthMorph alignment onto a 2 mm grid at 1 Hz."
summary_zh: "面向 4D 体素脑基础模型预训练的超大规模 CC0 开放 fMRI 语料库（全量 Cloudflare R2 桶含 817 个 OpenNeuro 研究、30,222 个被试 WebDataset 分片、22,083 小时 BOLD、15.88 TB，另在 Hugging Face 提供 500 GB / 672 研究 / 725 小时精选子集），跳过非线性配准与皮层重建，保留个体原生解剖形状并刚性对齐至 2 mm 网格与 1 Hz 采样。"
