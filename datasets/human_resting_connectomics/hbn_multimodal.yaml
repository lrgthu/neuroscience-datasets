id: hbn_multimodal
name: "Child Mind Institute Healthy Brain Network (HBN — Open 3T Movie fMRI & 128-Ch EEG)"
short_name: "HBN"
category: human_resting_connectomics
species:
  - human
modalities:
  - EEG
  - fMRI_3T
