modeling:
  recommended_tasks:
    - meg_foundation_model_pretraining_meg_gpt
    - lifespan_brain_age_and_neurovascular_decoupling
    - naturalistic_movie_event_segmentation_across_aging
    - multimodal_fmri_meg_fusion
  standard_splits: "Age-decade-stratified 5- or 10-fold subject cross-validation (`18-27`, `28-37`, ..., `78-88`) so every fold spans the full 70-year adult age distribution."
  noise_ceiling_or_repeat_structure: "Synchronized 8-minute Alfred Hitchcock movie (`Bang! You're Dead`) across ~640 subjects enables age-stratified inter-subject correlation (ISC) and HMM event-boundary reliability."
  key_pitfalls:
    - "NEUROVASCULAR COUPLING CONFOUND IN AGING (`Why Paired MEG + fMRI Matters!`): Vascular reactivity and HRF shape degrade systematically from age 20 to 88! Apparent 'neural decline' in 3T BOLD amplitude or FC often reflects vascular stiffening rather than synaptic loss—always cross-check age effects against the paired 306-ch MEG data (`Tsvetanov et al.`)!"
    - "Movie fMRI uses 5-echo multi-echo EPI (`TR = 2.47 s`), whereas resting-state fMRI uses single-echo EPI (`TR = 1.97 s`)—never assume identical `TR` or thermal noise profiles across Cam-CAN rest and movie runs."
    - "Elekta MEG mixes 102 magnetometers (`Tesla`) and 204 planar gradiometers (`Tesla/m`) with 2-3 orders of magnitude numerical scale difference—whiten via baseline noise covariance (`MNE` / `MaxFilter tSSS`) before feeding neural networks!"
