year: 2015
summary_en: "Uniformly stratified adult lifespan cohort (N=653, ~100 subjects per decade from age 18 to 88) pairing 3T fMRI (rest, Hitchcock naturalistic movie, sensorimotor) AND 306-channel Elekta Neuromag MEG in the same individuals."
summary_zh: "全成人生命周期均衡分层双模态标杆库（653 名 18–88 岁健康受试者，每 10 岁约 100 人），在同一批人身上同步采集 3T fMRI（静息态 + 希区柯克悬疑短片自然观影 + 感觉运动）与 306 通道全头 MEG（支撑 MEG-GPT 等电生理基础模型）。"
scale:
  n_subjects: 653
  hours_per_subject: 1.8
  total_hours: 1150.0
  n_stimuli: 3
  n_channels_or_voxels: "3T 3 mm multi-echo/EPI fMRI + 306-ch Elekta Neuromag VectorView MEG (102 magnetometers + 204 planar gradiometers) + T1w/T2w/DKI/MT"
  sampling_rate_or_tr: "Movie multi-echo fMRI TR = 2.47 s (rest TR = 1.97 s); MEG 1,000 Hz"
brain_regions:
