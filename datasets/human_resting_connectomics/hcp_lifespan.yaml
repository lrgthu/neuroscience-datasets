summary_en: "Harmonized 3T Siemens Prisma lifespan extension of HCP spanning ages 5–100+ across HCP-Development (N=652, ages 5–21) and HCP-Aging (N=725, ages 36–100+), with multiband TR=0.80 s rs-fMRI, task fMRI, multi-shell dMRI, T1w/T2w myelin maps, ASL, and CIFTI grayordinates."
summary_zh: "将 HCP 高清连接组协议扩展至 5–100+ 岁全生命周期的双队列基准（Lifespan 2.0 发布版含 HCP-Development 儿童青少年 N=652 与 HCP-Aging 中老年 N=725，共 1,377 人），统一采用 3T Prisma 多频带 TR=0.80 s 静息态/任务态 fMRI、多壳层 dMRI、动脉自旋标记灌注成像及 CIFTI 灰质坐标处理。"
