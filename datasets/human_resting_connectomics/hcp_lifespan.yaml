modeling:
  recommended_tasks:
    - normative_brain_age_and_lifespan_trajectory_modeling
    - developmental_and_aging_connectome_cognition_prediction
    - cross_cohort_foundation_model_transfer_with_hcp_ya
    - neurovascular_coupling_asl_confound_control
  standard_splits: "Site- and family-stratified 10-fold cross-validation across the 4 acquisition sites (`Harvard`, `MGH`, `UCLA`, `UMinn` / `WashU`), keeping siblings (`HCP-D` family subsets) and longitudinal Visit 1 / Visit 2 sessions of the same participant strictly within the same fold."
  noise_ceiling_or_repeat_structure: "4 resting-state runs (`26 min` total; `2 × AP` + `2 × PA` across two split sessions; `22 min` in ages 5–7) plus longitudinal Visit 2 follow-ups in `HCP-D` (`5–18` year sub-cohort) and `HCP-A` (`~55%` longitudinal subset) for developmental/aging trajectory reliability."
  key_pitfalls:
    - "PROTOCOL SHIFT VS. HCP-YA (`AP/PA` `TR=0.80s` vs. `LR/RL` `TR=0.72s`): Unlike `HCP-YA` (`Custom Skyra`, `LR/RL` phase encoding, `TR=0.72 s`), `HCP-D` and `HCP-A` were acquired on `3T Siemens Prisma` (`80 mT/m`) with `Anterior-Posterior (AP)` and `Posterior-Anterior (PA)` phase encoding (`TR=0.80 s`, `26 min` rest vs `60 min` in `HCP-YA`)—never pool `HCP-YA` (`ages 22–35`) with `HCP-D`/`HCP-A` to fit continuous `5–100` lifespan curves without explicit scanner/PE harmonization (`ComBat` / `CovBat`), or the `22–35` age trough will reflect protocol shift rather than biology!"
    - "AGE-COUPLED HEAD MOTION & NEUROVASCULAR CONFOUNDS: Framewise displacement rises steeply at both tails (`ages 5–9` and `ages 75+`), while cerebral blood flow and vascular reactivity decline across `HCP-A`—always control for `FD`, use `sICA+FIX` / `MSMAll` cleaned grayordinates, and leverage the companion pseudo-continuous `ASL` perfusion maps in `HCP-A` before interpreting BOLD amplitude drops as neural!"
    - "DIFFERENT TASK BATTERIES ACROSS COHORTS (`5–7 yr` vs `8–21 yr` vs `HCP-A`): `HCP-D` includes `CARIT` (inhibitory Go/No-Go), `Emotion` (Hariri faces/shapes), and `Guessing` (reward), whereas `HCP-A` replaces `Guessing` with `VISMOTOR` and `FACENAME` associative memory; children aged `5–7` follow a shortened protocol (`6 × 3.5 min` rest runs)."
