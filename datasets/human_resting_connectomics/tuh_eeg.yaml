year: 2016
summary_en: "Largest clinical scalp EEG pretraining archive (>26,000-69,000 EDF sessions from >14,000 patients, >25,000 hours + neurologist reports & downstream benchmarks TUAB, TUSZ, TUEV, TUAR), serving as the primary self-supervised corpus for EEG foundation models (LaBraM, BIOT, BENDR, CBraMod)."
summary_zh: "全球规模最大的临床头皮脑电（EEG）自监督预训练语料库（逾 1.4 万名患者、2.6 万–6.9 万次临床 EDF 记录、累计超 2.5 万小时，附带神经科诊断报告及 TUAB/TUSZ/TUEV/TUAR 标准评测子集），是 LaBraM、BIOT、CBraMod 等 EEG 基础模型的核心底座。"
scale:
  n_subjects: 14987
  hours_per_subject: 1.8
  total_hours: 27000.0
  n_stimuli: 6
  n_channels_or_voxels: "19 to 36+ clinical 10-20 scalp EEG channels (heterogeneous unipolar Average Reference `AR` & Linked-Ears `LE` montages)"
  sampling_rate_or_tr: "250 Hz / 256 Hz / 400 Hz / 512 Hz heterogeneous clinical EDFs (commonly resampled to 200 Hz)"
brain_regions:
  - Whole-Scalp_Clinical_10_20
data_formats:
  - BrainVision_EDF
access:
