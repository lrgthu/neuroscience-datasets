modeling:
  recommended_tasks:
    - eeg_foundation_model_pretraining_labram_biot_cbramod
    - abnormal_eeg_screening_tuab
    - seizure_and_event_detection_tusz_tuev
  standard_splits: "Pretrain on `TUEG` AFTER removing all patient IDs appearing in downstream evaluation test sets (`TUAB` N=2,329, `TUSZ`, `TUEV`, `TUSL`, `TUAR`)! Always evaluate on official patient-disjoint `eval` splits of `TUAB` / `TUEV` / `TUSZ`."
  noise_ceiling_or_repeat_structure: "Inter-rater neurologist κ reliability on `TUAB` (`~99%+` clinician consensus on clean normal/abnormal benchmark subset) and multi-session longitudinal recordings per patient."
  key_pitfalls:
    - "SEVERE PATIENT-ID OVERLAP BETWEEN `TUEG` AND `TUAB`/`TUSZ`/`TUEV`! `TUAB`, `TUEV`, and `TUSZ` are curated **subsets** of `TUEG`! Pretraining on unfiltered `TUEG` leaks exact test patients (and even exact test EDF recordings!) into self-supervised pretraining—ALWAYS strip every `subject_id` present in `TUAB/TUEV/TUSZ` test/val splits before pretraining!"
    - "Montage & reference heterogeneity (`01_tcp_ar` Average Reference vs. `02_tcp_le` Linked Ears vs. `03_tcp_ar_a` + longitudinal TCP bipolar chains): standardize channel names, convert consistently to standard `19`-channel `10-20` bipolar or common-average montage, notch-filter `60 Hz` US powerline noise, and resample to a single rate (`200 Hz`)."
    - "Clinical pathology & ICU/medication artifacts: `TUEG` reflects hospital epilepsy/neurology referrals rather than healthy cognitive controls—combine with `HBN` / `THINGS-EEG` / `Cam-CAN` when targeting healthy cognitive decoding."
