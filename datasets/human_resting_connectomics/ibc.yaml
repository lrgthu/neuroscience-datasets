modeling:
  recommended_tasks:
    - multi_task_cognitive_ontology_mapping
    - task_general_individual_parcellation
    - controlled_localizers_vs_naturalistic_movies
  standard_splits: "Leave-one-task-battery-out (testing zero-shot cognitive contrast prediction across 400+ GLM contrasts!) or leave-one-run-out (`AP` vs `PA`) within individual subjects."
  noise_ceiling_or_repeat_structure: "Paired `AP` and `PA` runs per task + shared HCP, ARCHI, RSVP-language, retinotopy, and naturalistic movie batteries (`Raiders of the Lost Ark`, `The Good, the Bad and the Ugly`) inside the same 13 brains."
  key_pitfalls:
    - "Not all 13 subjects completed every late-release battery (`sub-01, 04..09, 11..15`; 12 core completers across most batteries)—inspect subject-by-task completion matrices before running balanced tensor factorizations."
    - "Every functional paradigm is acquired with paired `AP` and `PA` phase encoding; combine `Topup` distortion-corrected `AP + PA` pairs rather than analyzing a single phase-encoding direction."
    - "Ideal ground-truth antidote to reverse-inference pitfalls: instead of guessing what an 'language' or 'MDN' voxel computes from one dataset, query all >400 GLM contrasts across 67 tasks in the exact same voxel via NeuroVault/OpenNeuro!"
