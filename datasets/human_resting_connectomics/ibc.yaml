summary_en: "Broadest within-subject multi-task human neuroimaging atlas (N=13 subjects completing ~50+ hours of 1.5 mm 3T fMRI across 67 cognitive, perceptual, linguistic, mathematical, motor, and movie-watching tasks)."
summary_zh: "单被试跨任务广度之最的人脑功能图谱库（13 名被试每人累计扫描逾 50 小时 1.5 mm 高清 3T fMRI，覆盖 67 项视觉、听觉、语言、数学推理、运动控制及完整电影任务）。"
scale:
  n_subjects: 13
  hours_per_subject: 50.0
  total_hours: 600.0
  n_stimuli: 67
  n_channels_or_voxels: "1.5 mm isotropic whole-brain (3T Siemens Prisma; MNI152 + fsaverage7 surface GLM contrast maps & raw time-series)"
  sampling_rate_or_tr: "TR = 2.0 s (multiband 3; AP + PA matched phase-encoding pairs)"
