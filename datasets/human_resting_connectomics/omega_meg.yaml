summary_en: "Continuous open-access MEG-BIDS reference repository from McGill MNI / Université de Montréal (N>300 participants across healthy controls and neurological cohorts) providing 275-channel CTF whole-head resting-state MEG at 2,400 Hz, daily empty-room noise recordings, 3D Polhemus head digitization, EOG/ECG, and defaced T1w MRI."
summary_zh: "麦吉尔大学蒙特利尔神经病学研究所（MNI）与蒙特利尔大学联合建设的开放脑磁图档案库（OMEGA，>300 名健康对照与神经疾病受试者），也是 MEG-BIDS 国际标准的参考基石，提供 275 通道 CTF 全头 2400 Hz 静息态 MEG、同日空房间噪声记录、3D 头型数字化及去面部 T1w 结构核磁。"
scale:
  n_subjects: 300
  hours_per_subject: 0.17
  total_hours: 65.0
  n_stimuli: 1
  n_channels_or_voxels: "275-channel CTF whole-head axial gradiometer MEG (+ 29 reference sensors for 3rd-order synthetic gradiometry + EOG/ECG + optional simultaneous EEG + 1 mm T1w MRI)"
  sampling_rate_or_tr: "2,400 Hz raw MEG sampling rate (600 Hz hardware anti-aliasing low-pass filter; ≥5 min eyes-open resting-state + ≥2 min empty-room noise)"
