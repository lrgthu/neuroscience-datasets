modeling:
  recommended_tasks:
    - resting_meg_source_imaging_and_oscillatory_connectomics
    - electrophysiological_foundation_model_pretraining
    - empty_room_noise_covariance_and_artifact_denoising
    - cross_site_ctf_vs_elekta_meg_harmonization
  standard_splits: "Subject-level 5-fold or 10-fold cross-validation stratified by age, sex, and scanner site (`MNI` vs. `UdeM` CTF systems; keeping multi-session longitudinal visits of the same participant strictly in the same fold)."
  noise_ceiling_or_repeat_structure: "Split-half `5 min` resting-state spectral power/envelope connectivity (`ICC > 0.80` in alpha/beta bands) plus multi-visit longitudinal sub-cohorts and matched `sub-emptyroom` sensor noise baselines for whitening/beamforming."
  key_pitfalls:
    - "AXIAL GRADIOMETERS & 3RD-ORDER SYNTHETIC GRADIENT COMPENSATION: Unlike Elekta/MEGIN `306-ch` planar gradiometer + magnetometer systems (`Cam-CAN`), CTF `275-ch` systems use radial axial gradiometers with `29` reference sensors (`3rd-order gradient` compensation)—always verify identical compensation order (`mne.io.read_raw_ctf(..., clean_names=True)` / `apply_gradient_compensation(3)`) between brain runs, `sub-emptyroom` noise covariance, and the forward leadfield!"
    - "TWO RECORDING SITES (`MNI` vs. `Université de Montréal`) & MISSING/BROKEN SQUID CHANNELS: Individual sessions disable `2–6` noisy SQUID channels (`~270` active channels out of `275`) and span two CTF installations (`60 Hz` North American powerline + harmonics)—interpolate to a canonical sensor template or project to individual `FreeSurfer` cortical surface (`LCMV` / `dSPM`) before cross-subject ML!"
    - "CONTINUOUS HEAD LOCALIZATION (`HLC` COILS): Inspect continuous head-coil trajectories (`HLC0011–HLC0038`) and reject or movement-compensate segments where cumulative head drift exceeds `5 mm`."
