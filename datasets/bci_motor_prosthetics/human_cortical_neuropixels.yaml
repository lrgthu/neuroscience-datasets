summary_en: "High-density laminar Neuropixels recordings from awake and anesthetized human cortex in the operating room (384 channels/probe, up to >200 simultaneous isolated single units across cortical layers on Dryad/DANDI:000397, extending to laminar speech perception and production)."
summary_zh: "人类术中大脑皮层高密度 Neuropixels 硅探针单神经元层状记录基准（单探针 384 通道同步捕获逾 200 个跨皮层细胞类型分选神经元，托管于 Dryad 与 DANDI:000397，涵盖言语感知与发声规划）。"
scale:
  n_subjects: 9
  hours_per_subject: 0.4
  total_hours: 3.6
  n_stimuli: null
  n_channels_or_voxels: "384 active recording channels across a 3.84 mm linear span (20 um vertical pitch; up to >200 spike-sorted pyramidal and fast-spiking interneuron single units per probe insertion)"
  sampling_rate_or_tr: "30 kHz action-potential band (AP, 0.3-10 kHz) + 2,500 Hz local field potential band (LFP, 0.5-500 Hz)"
