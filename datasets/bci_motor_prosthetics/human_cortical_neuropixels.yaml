modeling:
  recommended_tasks:
    - non_rigid_brain_pulsation_motion_registration
    - laminar_current_source_density_and_cell_type_classification
    - single_neuron_speech_phonetic_and_lexical_encoding
    - pairwise_monosynaptic_cross_correlogram_circuit_inference
  standard_splits: "Within-participant contiguous recording segments or sentence/utterance cross-validation (separating awake speech/cognitive blocks from anesthetized baseline insertions across participants)."
  noise_ceiling_or_repeat_structure: "Action-potential waveform spatial footprint stability across >=8-12 adjacent 20 um sites after motion registration + sentence/phoneme repeat reliability in awake intraoperative speech cohorts (`Leonard et al., 2023`; `Khanna et al., 2024`)."
  key_pitfalls:
    - "SEVERE CARDIAC & RESPIRATORY BRAIN PULSATION (`50-300+ um` DRIFT): Open craniotomies in humans exhibit far larger cardiac (~1 Hz) and respiratory (~0.25 Hz) vertical tissue motion than head-fixed rodents—applying standard rodent Kilosort without continuous non-rigid LFP/AP motion registration (`DREDge` / `Kilosort4`) splits single neurons into multiple rhythmic ghost units!"
    - "AWAKE VS. GENERAL ANESTHESIA STATE SEPARATION: In `Paulk et al. (2022)` (`N = 9` total insertions; `3` with high-yield single-unit sorting on Dryad), participants span both awake craniotomies and general anesthesia—never pool firing rates, burstiness, or pairwise noise correlations across anesthetic states."
    - "ACUTE OR TIME BUDGET (~15-25 MIN): Intraoperative research windows are strictly bounded by clinical safety; prefer data-efficient hierarchical or regularized GLMs/state-space models over data-hungry scratch deep networks."
