summary_en: "Multi-session intracortical speech BCI dataset from BrainGate2 participant T12 (256-channel Utah arrays across ventral premotor area 6v and Broca's area 44, 12,100 attempted sentences) enabling 62 wpm open-vocabulary decoding across a 125,000-word lexicon and powering the Brain-to-Text Benchmark."
summary_zh: "斯坦福颅内言语脑机接口里程碑数据集（ALS 受试者 T12 腹侧前运动皮层 6v 区与 Broca 44 区共 256 通道 Utah 微电极阵列，含 12,100 句尝试发音记录），在 12.5 万词表上实现 62 词/分钟解码并构成 Brain-to-Text 评测基准。"
scale:
  n_subjects: 1
  hours_per_subject: 18.0
  total_hours: 18.0
  n_stimuli: 12100
  n_channels_or_voxels: "256 intracortical microelectrodes (four 64-channel Utah arrays across ventral premotor area 6v and IFG area 44)"
  sampling_rate_or_tr: "50 Hz decoder frames (20 ms bins of threshold crossings and spike-band power extracted from 30 kHz raw broadband)"
brain_regions:
  - Ventral_Premotor_Cortex_Area6v
  - IFG_Broca_Area44
data_formats:
