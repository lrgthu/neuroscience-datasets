  download_cli: "curl -L 'https://datadryad.org/api/v2/datasets/doi%3A10.5061%2Fdryad.x69p8czpq/download' -o willett_speech_bci_2023.zip"
modeling:
  recommended_tasks:
    - ctc_phoneme_and_word_sequence_decoding
    - neural_to_llm_rescoring_beam_search
    - cross_day_nonstationarity_input_adaptation
    - articulatory_somatotopy_area6v_vs_area44_analysis
  standard_splits: "Official Brain-to-Text chronological multi-day split across 24 competition sessions (~10,850 train/val/test sentences partitioned into per-session train, held-out validation, and blind competition test blocks; never shuffle trials within the same block across splits)."
  noise_ceiling_or_repeat_structure: "Phoneme Error Rate (PER) before language-model decoding + Word Error Rate (WER) after n-gram + neural LLM rescoring (9.1% WER on 50-word vocabulary; 23.8% baseline WER reduced below 10% on 125,000-word vocabulary by modern architectures), plus cross-validated articulatory tuning across repeated phoneme/orofacial sweeps."
  key_pitfalls:
    - "DAY-SPECIFIC LINEAR INPUT LAYERS ARE CRITICAL: Chronic Utah array recordings exhibit substantial day-to-day baseline firing-rate and SNR drift; omitting per-session affine/day-specific input layers or block-wise z-scoring causes severe cross-day WER degradation."
    - "AREA 44 VS. AREA 6v SIGNAL ASYMMETRY: In participant T12, ventral premotor cortex (area 6v) carries dense articulatory representations whereas area 44 arrays exhibited virtually zero speech-informative tuning—models applying uniform spatial pooling across all 256 channels ingest 128 near-noise channels unless regularized."
    - "SEPARATE ACOUSTIC/NEURAL PER FROM LLM RESCORING GAINS: When claiming improved neural encoders (RNN/Conformer/SSM), always report raw CTC Phoneme Error Rate (PER) alongside post-LM Word Error Rate (WER) so language-model size differences (3-gram vs. 5-gram vs. OPT/Llama rescoring) do not confound neural feature extraction."
