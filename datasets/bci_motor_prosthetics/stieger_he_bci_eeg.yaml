summary_en: "Massive 600+ hour longitudinal scalp EEG dataset of 62 healthy adults across 598 closed-loop BCI training sessions (7-11 sessions/subject, >250,000 trials at 1,000 Hz) performing continuous 1D and 2D sensorimotor-rhythm cursor control."
summary_zh: "Stieger 与贺斌团队大规模纵向闭环运动想象脑机接口脑电数据集（62 名受试者各完成 7–11 次纵向训练共 598 场、逾 600 小时与 25 万试次 1,000 Hz 头皮 EEG），支持一维/二维连续光标控制与跨天共同适应研究。"
scale:
  n_subjects: 62
  hours_per_subject: 9.7
  total_hours: 600.0
  n_stimuli: 4
  n_channels_or_voxels: "62 scalp EEG channels (64-channel Neuroscan SynAmps RT 10-10 cap plus EOG/mastoid references)"
  sampling_rate_or_tr: "1,000 Hz continuous scalp EEG + real-time 2D visual cursor trajectories"
brain_regions:
  - Whole_Scalp_Sensorimotor_Rhythm_C3_C4_Cz
