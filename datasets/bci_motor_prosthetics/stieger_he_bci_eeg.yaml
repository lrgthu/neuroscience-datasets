    code: "https://github.com/bfinl/BCI_Data_Paper"
  download_cli: "python -c 'from moabb.datasets import Stieger2021; Stieger2021().download()'"
modeling:
  recommended_tasks:
    - longitudinal_human_bci_skill_learning_and_coadaptation
    - continuous_2d_cursor_velocity_eeg_decoding
    - multi_session_cross_day_eeg_domain_adaptation
    - large_scale_scalp_eeg_foundation_pretraining
  standard_splits: "Chronological multi-session transfer (train on Sessions `1..K-1`, evaluate zero-shot and few-shot on Session `K` up to Session 11) and leave-k-subjects-out cross-subject transfer across the 62 participants (`moabb.datasets.Stieger2021`)."
  noise_ceiling_or_repeat_structure: "Percent Valid Correct (`PVC`) online target-hit rate + 4-class discrete decoding accuracy (left hand, right hand, both hands, rest) + continuous 2D cursor trajectory correlation across 450 trials/session (`7-11` sessions/subject)."
  key_pitfalls:
    - "CLOSED-LOOP VISUAL CURSOR FEEDBACK CONFOUND: Unlike open-loop cue-only motor imagery, participants continuously watched a moving 2D cursor driven by `C3/C4` mu-rhythm power—occipital visual motion/error-related potentials (`ErrP`) co-vary with cursor direction, so whole-scalp decoders can shortcut via visual gaze/pursuit unless EOG/occipital controls are verified!"
    - "VARIABLE VARIABLE-LENGTH TRIAL DURATIONS (UP TO `6 s` TIMEOUT): Closed-loop trials terminate immediately upon target hit (`~1.5-6.0 s`) or timeout at `6.0 s`; crop fixed post-cue windows (`e.g., [0.5, 2.5] s`) or mask post-hit reward artifacts so trial length itself does not leak target class."
    - "MINDFULNESS INTERVENTION COHORT STRUCTURE: Half of the 62 participants underwent an 8-week mindfulness-based stress reduction (`MBSR`) course between initial assessment and longitudinal BCI training—check subject metadata (`MBSR` vs. control group) before modeling population learning slopes."
