summary_en: "Foundational 47-session chronic macaque M1/S1 Utah-array corpus (monkeys Indy and Loco, ~28 hours of continuous self-paced random-grid reaching without trial resets) serving as a primary multi-session pretraining benchmark for POYO and NDT2."
summary_zh: "Sabes 实验室猕猴初级运动/躯体感觉皮层（M1/S1）长期慢性微电极记录基准（Indy 37 场与 Loco 10 场共 47 场无试次切分的连续随机网格伸手任务），构成 POYO 与 NDT2 等神经基础模型核心预训练语料。"
scale:
  n_subjects: 2
  hours_per_subject: 14.0
  total_hours: 28.0
  n_stimuli: null
  n_channels_or_voxels: "96-channel (M1) or 192-channel (M1 + S1) chronic Utah arrays per session (unsorted threshold crossings + up to 4 sorted single units/channel)"
  sampling_rate_or_tr: "24.4 kHz spike timestamps + 250 Hz continuous 2D/3D fingertip and target coordinates (4 ms frame resolution)"
brain_regions:
  - Macaque_M1_Primary_Motor
  - Macaque_S1_Primary_Somatosensory
