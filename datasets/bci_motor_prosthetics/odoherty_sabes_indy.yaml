modeling:
  recommended_tasks:
    - continuous_unsegmented_kinematic_decoding
    - multi_session_spike_foundation_model_pretraining
    - longitudinal_neural_drift_and_unsupervised_recalibration
    - m1_vs_s1_proprioceptive_lag_modeling
  standard_splits: "Within-session chronological blocks (e.g., 70% train / 10% val / 20% contiguous test per session) AND cross-session longitudinal transfer (pretraining across 30+ sessions of Indy/Loco and fine-tuning unit embeddings on held-out recording days)."
  noise_ceiling_or_repeat_structure: "Continuous hand-position and hand-velocity coefficient of determination (R^2 ~ 0.80-0.90 for state-of-the-art rEFH, Kalman/UKF, NDT2, and POYO decoders); zero stereotyped condition repeats by design (targets appear on a random 8x8 / continuous workspace)."
  key_pitfalls:
    - "CONTINUOUS UNSEGMENTED STREAM (NO INTER-TRIAL RESETS): Unlike center-out tasks, a new random target appears immediately upon target acquisition—never slice random 1-second windows and shuffle them i.i.d. across train/test, as inertial arm momentum and overlapping context windows leak across adjacent slices!"
    - "UNSORTED THRESHOLD CROSSINGS (`u=0`) VS. SORTED UNITS (`u>=1`): In each HDF5/MAT `spikes` cell array `(channels x units)`, row/column index 1 stores unsorted multi-unit threshold crossings while higher indices store manually/semi-automatically sorted units that turn over across the ~10-month span—decide explicitly whether to include `hash` (`u=0`) spikes."
    - "ARRAY CONFIGURATION DIFFERENCES ACROSS SESSIONS: Early `Indy` sessions record 96 M1 channels only, whereas later `Indy` and all `Loco` sessions include a second 96-channel S1 array (192 total channels); multi-session models must handle variable channel/unit cardinality gracefully."
