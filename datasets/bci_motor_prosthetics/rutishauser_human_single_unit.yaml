summary_en: "Flagship open NWB suite of >4,800 spike-sorted human single neurons across 135 neurosurgical sessions (DANDI:000004 declarative recognition memory, DANDI:000469 Sternberg working memory, and DANDI:000623 multimodal movie watching with simultaneous iEEG, eye tracking, and fMRI)."
summary_zh: "Rutishauser 实验室人类内侧颞叶与额叶单神经元标准 NWB 数据集集群（覆盖 DANDI:000004 陈述性记忆、DANDI:000469 Sternberg 工作记忆及 DANDI:000623 自然电影多模态同步 iEEG/眼动/fMRI，累计逾 4,800 个分选单神经元）。"
