  n_channels_or_voxels: "4,835+ isolated human single neurons across 135 NWB sessions (1,576 in DANDI:000004 across 42 patients; 1,809 in DANDI:000469 across 21 patients; 1,450 in DANDI:000623 across 16 patients) via Behnke-Fried hybrid depth electrodes"
  sampling_rate_or_tr: "32 kHz broadband microwire spike sorting (OSort) + 500-2,000 Hz macro/micro LFP + 500 Hz eye tracking"
