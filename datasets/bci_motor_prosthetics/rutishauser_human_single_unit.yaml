modeling:
  recommended_tasks:
    - human_concept_and_persistent_working_memory_decoding
    - mtl_vs_frontal_theta_gamma_spike_field_coupling
    - pseudopopulation_novelty_familiarity_confidence_classification
    - single_neuron_to_ieeg_and_fmri_multimodal_alignment
  standard_splits: "Stratified trial-level cross-validation (old vs. new recognition confidence or Sternberg load 1-3 maintenance) for pseudopopulation decoding on DANDI:000004/000469; contiguous movie-segment folds + leave-one-patient-out cross-modal prediction on DANDI:000623."
  noise_ceiling_or_repeat_structure: "Repeated visual category/concept presentations during screening + learning/recognition pairs (`DANDI:000004`, `000469`), and shared 8-minute *Bang! You're Dead* naturalistic movie timeline synchronized across all 16 single-unit patients and healthy 3T fMRI cohort (`DANDI:000623`)."
  key_pitfalls:
    - "PSEUDOPOPULATION CONSTRUCTION ACROSS ASYNCHRONOUS SESSIONS: Because each patient yields ~15-50 simultaneously recorded MTL/frontal units, population decoders pooling hundreds of neurons across sessions (`pseudopopulations`) destroy trial-by-trial noise correlations—only match trials by shared stimulus/condition labels and test patient-level generalization via hierarchical bootstrap."
    - "SCREENING-TO-TASK SELECTION BIAS (`DANDI:000469`): Sternberg working-memory images are customized per session from a prior screening block to elicit concept-cell responses; never leak screening-block firing-rate rankings into zero-shot category selectivity claims without accounting for stimulus selection."
    - "EPILEPTOGENIC ZONE EXCLUSION: Clinical depth electrodes Occasionally border seizure-onset zones (SOZ); inspect NWB electrode table `location` / pathology annotations and interictal epileptiform discharge flags before interpreting burst firing or high-frequency oscillations."
