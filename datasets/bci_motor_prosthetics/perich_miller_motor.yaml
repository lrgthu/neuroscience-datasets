modeling:
  recommended_tasks:
    - multi_year_neural_manifold_alignment_cca_procrustes
    - within_session_motor_adaptation_curl_field_visuomotor
    - cross_subject_multi_session_foundation_pretraining
    - pmd_preparatory_to_m1_execution_subspace_communication
  standard_splits: "POYO / DANDI:000688 canonical multi-session splits: trial-stratified 80/10/10 within baseline reaching sessions, baseline -> washout/adaptation chronological epoch splits on learning sessions, and zero/few-shot held-out monkey/session transfer across Chewie, Mihili, Jaco, and MrT."
  noise_ceiling_or_repeat_structure: "High repeat reliability across 8 radial center-out directions (PSTH R^2 > 0.90) + conserved low-dimensional canonical correlations (CCA > 0.80) across up to 2 years of chronic recording despite complete single-unit turnover."
  key_pitfalls:
    - "SEPARATE BASELINE EPOCHS FROM CURL-FIELD / VISUOMOTOR ADAPTATION EPOCHS: Many sessions in `Perich et al. (2018)` contain `Baseline -> Adaptation (Force Field or Visuomotor Rotation) -> Washout` epochs—pooling all trials blindly trains decoders across non-stationary sensorimotor mappings!"
    - "PMd PREPARATORY VS. M1 EXECUTION DYNAMICS: `PMd` exhibits strong target-tuned preparatory activity during the instructed delay before the Go cue while arm velocity is zero; naive frame-wise linear regression without state dynamics will hallucinate pre-movement cursor drift unless delay periods are included."
    - "MULTI-YEAR SINGLE-UNIT TURNOVER (`Gallego et al., 2020`): Across weeks to years on `Chewie`, `Jaco`, and `Mihili`, individual sorted neurons disappear and appear, yet a ~10-12D latent cortical manifold remains stable—align latent subspaces (`CCA`, `Procrustes`, or learned unit tokens) rather than matching channel IDs directly."
