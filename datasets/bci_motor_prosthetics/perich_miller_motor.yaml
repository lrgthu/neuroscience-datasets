summary_en: "Large-scale 100+ session NWB archive on DANDI:000688 of chronic macaque M1, PMd, and somatosensory Area 2 Utah-array recordings (monkeys Chewie, Mihili, Jaco, MrT) across center-out reaching, random pursuit, force-field/rotation learning, and mechanical perturbations."
summary_zh: "西北大学 Miller 实验室猕猴运动/前运动/躯体感觉皮层（M1/PMd/Area 2）超百场多会话 NWB 权威档案（DANDI:000688，含 Chewie、Mihili 等 4 只猕猴），覆盖中心外周伸手、力场/视觉旋转快速学习及数年群体流形稳定性。"
scale:
  n_subjects: 4
  hours_per_subject: 15.0
  total_hours: 60.0
  n_stimuli: 8
  n_channels_or_voxels: "96- to 192-channel chronic Utah arrays per monkey (~60 to 250 spike-sorted single units per session across M1, PMd, and Area 2)"
  sampling_rate_or_tr: "30 kHz spike timestamps + 100 Hz / 1,000 Hz planar manipulandum kinematics, handle forces, and EMG in NWB"
