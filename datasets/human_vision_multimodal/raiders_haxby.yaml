year: 2011
summary_en: "Foundational functional-alignment 3T fMRI dataset (N=11, TR=2.5 s) pairing full-length viewing of Raiders of the Lost Ark (~115 min across 8 runs) with controlled 7-category object/face/animal perception to benchmark Procrustes hyperalignment and Shared Response Models."
summary_zh: "奠定功能超对齐（Hyperalignment）与共享响应模型（SRM）方法学基石的经典 3T fMRI 数据集（11 名被试，TR=2.5 s），在同一批被试中配对采集《夺宝奇兵》全片观影（8 个 run 约 115 分钟）与 7 类静态面孔/动物/物体视觉分类实验。"
scale:
  n_subjects: 11
  hours_per_subject: 3.2
  total_hours: 35.0
  n_stimuli: 8
  n_channels_or_voxels: "3.0 mm isotropic whole-brain 3T EPI + FreeSurfer fsaverage cortical surfaces & ventral temporal (VT) masks"
  sampling_rate_or_tr: "TR = 2.5 s (~2,740 movie TRs across 8 ~14.5-min runs + 10 controlled object-category runs)"
