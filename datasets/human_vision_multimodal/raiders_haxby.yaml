modeling:
  recommended_tasks:
    - hyperalignment_srm
    - movie_to_controlled_task_zero_shot_transfer
    - between_subject_multivariate_decoding
  standard_splits: "Standard cross-paradigm benchmark: learn orthogonal Procrustes / ridge / SRM functional alignment matrices purely on the 8 naturalistic movie runs (`Raiders`), then evaluate between-subject classification on the strictly disjoint 7-category static image runs (female/male faces, monkeys, dogs, houses, chairs, shoes)—or leave-one-movie-run-out for time-segment identification."
  noise_ceiling_or_repeat_structure: "Compare between-subject MVPA accuracy after functional hyperalignment against within-subject cross-validated MVPA upper bounds (hyperalignment matches or exceeds within-subject accuracy in ventral temporal cortex)."
  key_pitfalls:
    - "Cross-session registration drift: Movie runs 1–4 (Session 1), Movie runs 5–8 (Session 2), and the 7-category static object runs (separate session) were acquired on different days—project onto individual `fsaverage` cortical surfaces or rigidly co-register all runs to a shared T1w template before fitting voxel/vertex alignment transforms."
    - "Adjacent movie run overlap: Movie segments include short transition overlaps (~20 s / 8 TRs) across run boundaries; strip overlapping boundary TRs before evaluating leave-one-run-out movie time-segment classification."
    - "Searchlight radius sensitivity: Whole-cortex hyperalignment requires local surface searchlights (`~15–20 mm` radius) rather than unconstrained whole-brain orthogonal matrices (`V × V`) to preserve coarse retinotopic/anatomical topology and avoid overfitting `2,740` TRs."
