modeling:
  recommended_tasks:
    - cross_subject_eeg_decoding
    - time_resolved_rsa_object_dynamics
    - breadth_vs_depth_scaling_comparison_with_things_eeg2
  standard_splits: "Train on 22,248 single-trial images (1,854 concepts × 12 images, 1 repeat/subject) and evaluate on 200 separate validation images (12 repeats/subject = 2,400 test trials/subject), or leave-N-subjects-out across the 50-subject cohort."
  noise_ceiling_or_repeat_structure: "12 repetitions per validation image within each of the 50 subjects + 50-subject group-level RSA upper/lower noise ceilings across all 1,854 concepts."
  key_pitfalls:
    - "THINGS-EEG1 vs. THINGS-EEG2 distinction: THINGS-EEG1 (`ds003825`, Grootswagers et al. 2022) prioritizes **subject breadth (`N = 50`, 1 session/subj, 50 ms ON / 50 ms OFF, 1 repeat/train image)**, whereas THINGS-EEG2 (`OSF:3jk45`, Gifford et al. 2022) prioritizes **within-subject depth (`N = 10`, 4 sessions/subj, 100 ms ON / 100 ms OFF, 4 repeats/train image & 80 repeats/test image)**—never conflate accuracy numbers across the two!"
    - "Ultra-brief 50 ms exposure + 100 ms SOA causes forward/backward visual masking and overlapping late ERPs (`>150 ms`) from subsequent RSVP frames."
    - "Orthogonal target detection task: subjects monitored streams for upside-down/rotated catch images—exclude catch trials and post-button-press motor-contaminated epochs (`events.tsv`)."
