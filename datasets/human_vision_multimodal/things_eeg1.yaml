year: 2022
summary_en: "Broad-cohort 64-channel RSVP EEG dataset (N=50 subjects, 1,000 Hz) recording neural responses to 22,248 THINGS images across all 1,854 object concepts (50 ms ON / 50 ms OFF) plus 200 multi-repeat validation images."
summary_zh: "大样本群体级 THINGS 快速序列视觉呈现（RSVP）64 通道脑电基准（50 名被试，50 ms 呈现 / 50 ms 间隔，完整覆盖全部 1,854 个物体概念共 22,248 张自然图像 + 200 张 12 次重复测试图），与深度单被试版 THINGS-EEG2 形成广度—深度互补。"
scale:
  n_subjects: 50
  hours_per_subject: 1.0
  total_hours: 50.0
  n_stimuli: 22448
  n_channels_or_voxels: "64-channel BrainVision actiCHamp scalp EEG (10-10 layout)"
  sampling_rate_or_tr: "1,000 Hz raw BrainVision BIDS (10 Hz RSVP: 50 ms image ON + 50 ms blank ISI)"
