  - NIfTI
  - CIFTI_GIfTI
  - HDF5_MAT
  - Parquet_CSV
access:
  tier: open
  license: CC0-1.0
  primary_portal: OpenNeuro
  accession_ids:
    - "OpenNeuro:ds005165"
  urls:
    homepage: "https://openneuro.org/datasets/ds005165"
    github: "https://github.com/blahner/BOLDMomentsDataset"
    paper: "https://doi.org/10.1038/s41467-024-50310-3"
  download_cli: "datalad install https://github.com/OpenNeuroDatasets/ds005165.git"
modeling:
  recommended_tasks:
    - spatiotemporal_video_encoding
    - video_reconstruction_and_retrieval
    - semantic_variance_partitioning
    - event_dynamics_and_memorability_modeling
  standard_splits: "Official split locks 1,000 training videos (3 repeats = 3,000 trials/subject) and 102 test videos (10 repeats = 1,020 trials/subject), fully unblinded in ds005165 with matched GLMsingle beta estimates."
  noise_ceiling_or_repeat_structure: "3 repeats on the 1,000 training clips and 10 repeats on the 102 test clips yield official per-voxel `ncsnr` maps (`NC = ncsnr^2 / (ncsnr^2 + 1/n)`) directly analogous to NSD."
  key_pitfalls:
    - "Always prefer `GLMsingle` Type-D betas (`TYPED_FITHRF_GLMDENOISE_RR`) and z-score voxel responses **within each scanning session/run** before concatenating the 1,000-train and 102-test pools (train and test clips were acquired in separate functional runs within sessions 2–5)."
    - "Because train (`3` repeats) and test (`10` repeats) were collected in distinct run blocks (`task-train` vs. `task-test`), session/run mean-centering separately on train and test runs is essential to prevent baseline offset artifacts."
    - "Videos are silent `3.0 s` clips (`45–90` frames) paired with crowdsourced human sentence descriptions, object/scene/action labels, and behavioural memorability scores—verify whether VLM captions leak ground-truth human annotations when testing purely visual encoders."
citations:
