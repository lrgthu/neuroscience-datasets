id: bmd_moments
name: "BOLD Moments Dataset (BMD — 1,102 Short Visual Events 3T Video fMRI & Metadata)"
short_name: "BMD"
category: human_vision_multimodal
species:
  - human
modalities:
  - fMRI_3T
