year: 2024
summary_en: "Comprehensive open-access 3T video fMRI resource (N=10, OpenNeuro ds005165) releasing raw BIDS, fMRIPrep surfaces, single-trial GLMsingle betas, and rich human-annotated action/object/scene/caption metadata across 1,102 3-second Moments-in-Time clips (4,020 trials/subject)."
summary_zh: "全开放短事件自然视频 3T fMRI 旗舰数据集（10 名被试，OpenNeuro ds005165，覆盖 1,102 段 3 秒 Moments-in-Time 视频共 4,020 试次/人），完整释出原始 BIDS、fMRIPrep 皮层表面、GLMsingle 单试次 beta 与动作/物体/场景/自然语言标注。"
scale:
  n_subjects: 10
  hours_per_subject: 5.5
  total_hours: 55.0
  n_stimuli: 1102
  n_channels_or_voxels: "2.5 mm isotropic whole-brain 3T EPI + fsLR 32k / fsaverage CIFTI surfaces + 11 functional/retinotopic visual ROIs"
  sampling_rate_or_tr: "TR = 1.75 s (GLMsingle Type-B/C/D single-trial betas + FIR time-courses spanning TRs 1–9 post-onset)"
brain_regions:
  - V1
  - V2
  - V3
  - hV4
  - LOC
  - OFA_FFA
  - EBA
  - PPA_RSC_TOS
  - STS
  - Whole-Brain
data_formats:
