summary_en: "Bridge dataset uniting Courtois NeuroMod and THINGS: 4 deeply phenotyped CNeuroMod subjects (who also watched ~80h of Friends/Movie10) completed 33-36 sessions (~16.4 h/subj) of continuous recognition across 4,320 THINGS images (720 concepts × 6 × 3 repeats) with eye-tracking and autonomic physiology."
summary_zh: "打通 CNeuroMod 与 THINGS 两大生态的桥梁级数据集：4 名拥有上百小时《老友记》/电影数据的 CNeuroMod 核心被试，另行完成 33–36 个 session（每人约 16.4 小时）的连续识别任务，观看 720 个物体概念共 4,320 张 THINGS 图像（× 3 次重复），同步采集眼动与心电/呼吸/皮电生理信号。"
scale:
  n_subjects: 4
  hours_per_subject: 16.4
  total_hours: 65.6
  n_stimuli: 4320
  n_channels_or_voxels: "2.0 mm isotropic whole-brain (co-registered to CNeuroMod Friends/Movie10/HCP native & CIFTI 91k spaces; GLMsingle betas)"
  sampling_rate_or_tr: "TR = 1.49 s (multiband 4); in-scanner eye-tracking + ECG/respiration/PPG/EDA"
