modeling:
  recommended_tasks:
    - static_image_to_dynamic_movie_transfer
    - within_subject_cross_paradigm_identifiability
    - visual_recognition_memory_and_pupil_dynamics
    - cross_dataset_alignment_with_things_fmri_and_tvsd
  standard_splits: "Hold out disjoint THINGS object concepts (among the 720 sampled concepts, which match THINGS-fMRI's 720-concept subset!) for static visual evaluation, OR train on CNeuroMod Friends/Movie10 dynamic video and evaluate zero-shot on CNeuroMod-THINGS static object betas in the EXACT SAME 4 BRAINS!"
  noise_ceiling_or_repeat_structure: "Every one of the 4,320 unique images is presented 3 times across sessions (18 trials per concept; 12,960 trials/subject), providing per-voxel `ncsnr` maps identical in spirit to NSD."
  key_pitfalls:
    - "UNIQUE SCIENTIFIC LEVER & LEAKAGE GUARD: Subjects `sub-01, sub-02, sub-03, sub-06` are the SAME individuals as CNeuroMod `friends`/`movie10`/`hcptrt`—ideal for testing static-image vs. naturalistic-video encoding divergence within identical voxels, provided sessions are z-scored separately!"
    - "Continuous recognition memory + confidence grading (`sure/unsure old/new`) induces systematic repetition-suppression and confidence-related parietal/MTL responses between Repeat 1 and Repeats 2-3."
    - "Physiological arousal (`PPG`, `respiration`, `EDA`, `pupil`) covaries with recognition memory hits/misses—use the synchronized physio/eye-tracking streams to separate autonomic BOLD fluctuations from object tuning."
