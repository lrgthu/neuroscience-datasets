summary_en: "Multimodal human neuroimaging suite built on the 1,854-concept THINGS object database, pairing 3T fMRI (N=3), 275-ch CTF MEG (N=4), 64-ch RSVP EEG2 (N=10), and 4.7M behavioral odd-one-out judgments."
summary_zh: "基于 1,854 个物体概念 THINGS 图库的跨模态人类视觉数据集家族，统一覆盖 3T fMRI（N=3）、275 通道 MEG（N=4）、64 通道高速 EEG2（N=10）及大规模行为相似度，并与猕猴 TVSD 直接对齐。"
