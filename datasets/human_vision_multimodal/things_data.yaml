modeling:
  recommended_tasks:
    - voxelwise_encoding
    - spatiotemporal_fusion_rsa
    - zero_shot_concept_decoding
    - cross_species_alignment_with_tvsd
  standard_splits: "THINGS-fMRI: 8,640 single-trial train images (720 concepts × 12 exemplars) + 100 separate test images (12 repeats each). THINGS-MEG: 22,248 single-trial train images (1,854 concepts × 12) + 200 test images (12 repeats). THINGS-EEG2: 16,540 train images (4 repeats) + 200 zero-shot test images (80 repeats)."
  noise_ceiling_or_repeat_structure: "Dedicated multi-repeat test sets (12 repeats in fMRI/MEG; 80 repeats in EEG2) enable unbiased upper/lower RSA and encoding noise ceilings on held-out object categories."
  key_pitfalls:
    - "Ensure zero concept-level leakage: test images come from held-out THINGS object concepts—do not mix exemplars of the same concept across train and validation folds when claiming zero-shot category decoding."
    - "THINGS-EEG2 uses 100 ms SOA (10 Hz RSVP); late ERPs (>150 ms) overlap temporally with subsequent image onsets and require linear deconvolution or trial-averaged test conditions."
    - "Cross-species alignment with Macaque TVSD shares the exact 1,854-concept image pool—verify exact image filenames when pairing human MEG/fMRI with macaque V1/V4/IT."
