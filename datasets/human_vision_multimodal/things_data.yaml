  hours_per_subject: 12.0
  total_hours: 120.0
  n_stimuli: 26107
  n_channels_or_voxels: "3T 2 mm iso fMRI; 275-ch CTF MEG; 64-ch BrainVision EEG"
  sampling_rate_or_tr: "fMRI TR = 1.5 s; MEG 1,200 Hz; EEG2 1,000 Hz (10 Hz RSVP)"
