  - object_recognition
  - retinotopy
year: 2023
summary_en: "Hybrid depth-and-breadth 3T fMRI dataset (N=30 subjects, 57,120 natural images across ImageNet & MS-COCO) combining a 9-subject deep cohort (>4,000 images/subj + pRF + fLoc) and a 21-subject broad cohort (1,000 shared ImageNet images/subj)."
summary_zh: "兼顾个体深度与群体广度的自然图像 3T fMRI 大规模基准（30 名被试观看 57,120 张 ImageNet 与 MS-COCO 自然图像：9 名深度采样被试各完成 >4,000 张 + 视网膜拓扑/功能定位，21 名广度采样被试各完成 1,000 张共享图）。"
scale:
  n_subjects: 30
  hours_per_subject: 4.5
  total_hours: 105.0
  n_stimuli: 57120
  n_channels_or_voxels: "2.0 mm isotropic whole-brain (CIFTI 59k/91k fsLR grayordinates via fMRIPrep + ciftify)"
  sampling_rate_or_tr: "TR = 2.0 s (multiband 3; fast ImageNet runs + slow MS-COCO multi-repeat runs)"
brain_regions:
  - V1
  - V2
  - V3
  - hV4
  - Ventral_Temporal_Cortex
  - Whole-Brain
