    paper: "https://doi.org/10.1038/s41597-023-02471-x"
  download_cli: "datalad install https://github.com/OpenNeuroDatasets/ds004496.git"
modeling:
  recommended_tasks:
    - individual_vs_population_visual_encoding
    - cross_subject_hyperalignment_on_1000_shared_imagenet
    - imagenet_vs_coco_domain_generalization
  standard_splits: "Within-subject (`sub-01..sub-09`): Train on 4,000 single-trial ImageNet images (`1,000` categories × 4) and evaluate on the 120 MS-COCO multi-repeat images (`10` repeats each). Population-wide (`sub-01..sub-30`): 1,000 shared ImageNet categories across `sub-10..sub-30` for inter-subject alignment."
  noise_ceiling_or_repeat_structure: "In `sub-01..sub-09`, 120 MS-COCO images are repeated 10 times each (`1,200` trials/subj) for single-subject `ncsnr`; across `sub-10..sub-30`, shared ImageNet stimuli enable leave-one-subject-out ISC ceilings."
  key_pitfalls:
    - "TWO DISTINCT COHORT DESIGNS INSIDE `ds004496`: `sub-01..09` have 4 sessions of ImageNet (`4,000` unique images, `4 s` SOA) + 1 session of MS-COCO (`120` images × `10` repeats) + `pRF` + `fLoc`; `sub-10..30` ONLY have 1 session of `1,000` ImageNet images—do not blindly loop identical session scripts over all 30 subjects!"
    - "Stimulus timing differs between ImageNet runs (`1.0 s` ON + `3.0 s` ISI = `4.0 s` rapid event-related) and COCO runs (`2.0 s` ON + `6.0 s` ISI)—fit separate GLM / HRF design matrices per paradigm."
    - "Preprocessed `ciftify` GLM betas are included directly under `derivatives/ciftify` on OpenNeuro (`59k`/`91k` CIFTI `.dscalar.nii`)."
