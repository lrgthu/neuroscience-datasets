year: 2023
summary_en: "Semantic-perceptual backbone of the THINGS ecosystem: 26,107 curated object images across 1,854 concepts paired with 4.70 million human triplet odd-one-out similarity judgments (N=12,340 participants, 49/66-D interpretable SPoSE embeddings), THINGSplus norms, and image-level memorability scores."
summary_zh: "整个 THINGS 跨物种神经生态的刺激与人类认知表征基石：覆盖 1,854 个具体概念的 26,107 张自然图像、12,340 名受试者完成的 470 万次三元组异类判别（产出可解释的 49/66 维 SPoSE 人类心理维度）、THINGSplus 语义属性常模与全图记忆度（Memorability）实测分。"
scale:
  n_subjects: 12340
  hours_per_subject: null
  total_hours: null
  n_stimuli: 26107
  n_channels_or_voxels: "49-D / 66-D sparse non-negative human similarity dimensions (SPoSE) + 1,854 × 1,854 full behavioral RDM + 53+ THINGSplus norms"
  sampling_rate_or_tr: "4,701,960 behavioral triplet odd-one-out trials + continuous recognition memorability hit/FA rates"
brain_regions:
  - Human_Behavioral_Conceptual_Space
