  download_cli: "uvx osfclient -p jum2f list"
modeling:
  recommended_tasks:
    - human_aligned_vision_model_tuning_dreamsim_gLocal
    - interpretable_sparse_voxel_encoding_spose
    - memorability_vs_ventral_it_magnitude_modeling
    - semantic_vs_visual_variance_partitioning
  standard_splits: "4.53M training triplets + independent 10% fully-sampled validation sub-RDM (48 concepts, all 17,296 triplets repeated >=20 times for exact human behavioral noise ceiling!)."
  noise_ceiling_or_repeat_structure: "Repeated odd-one-out triplets on the 48-concept dense validation set establish a human behavioral choice accuracy ceiling of ~67.2% (matching SPoSE ~64.6%)."
  key_pitfalls:
    - "Concept-level vs. image-level granularity: the 4.70M odd-one-out SPoSE embeddings are defined at the **1,854 concept level** (1 representative image or pooled exemplars per concept), whereas **THINGS-Memorability (`Kramer et al. 2023`)** provides **image-level** memorability scores across all `26,107` individual exemplars!"
    - "Raw image copyright redistribution: THINGS image arrays may be downloaded for academic research via OSF (`jum2f`), while public web demos must use the dedicated CC0 subset (`THINGSplus` includes 1,854 CC0 public-domain replacement images!)."
    - "When using SPoSE dimensions as an encoding feature space on `THINGS-fMRI` / `THINGS-MEG` / `TVSD`, hold out test concepts BEFORE fitting SPoSE if testing strict zero-shot concept generalization, so behavioral triplets on test concepts do not leak human category labels."
