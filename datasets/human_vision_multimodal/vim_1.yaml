id: vim_1
name: "Gallant Lab Natural Images 4T fMRI Dataset (CRCNS vim-1)"
short_name: "vim-1"
category: human_vision_multimodal
species:
  - human
modalities:
  - fMRI_4T
  - Structural_MRI
domains:
  - natural_images
  - retinotopy
year: 2008
summary_en: "Foundational 4T occipital visual cortex fMRI dataset (N=2) recording BOLD responses to 1,750 grayscale natural images (2 repeats) and 120 novel validation images (13 repeats) that launched modern Gabor-wavelet voxelwise encoding and Bayesian image reconstruction."
summary_zh: "开创现代体素级视觉编码模型与贝叶斯图像重建先河的经典 4T 枕叶视觉皮层 fMRI 基准（2 名被试，1,750 张灰度自然训练图像 × 2 次重复 + 120 张独立测试图像 × 13 次高重复）。"
scale:
  n_subjects: 2
  hours_per_subject: 6.5
  total_hours: 13.0
  n_stimuli: 1870
  n_channels_or_voxels: "4T 2.0 × 2.0 × 2.5 mm coronal occipital slab (~5,000–6,000 retinotopic voxels/subj across V1, V2, V3, V3A, V3B, V4, LO)"
  sampling_rate_or_tr: "TR = 1.0 s (18 coronal slices; 1 s flashing at 200 ms ON/OFF + 3 s gray ISI)"
brain_regions:
  - V1
  - V2
  - V3
  - V3A_V3B
  - hV4
  - LO
data_formats:
  - HDF5_MAT
  - NIfTI
access:
  tier: registered
  license: "CRCNS Data Sharing Terms / CC0-1.0 (Dryad processed release)"
  primary_portal: "CRCNS.org"
  accession_ids:
    - "CRCNS:vim-1"
  urls:
    homepage: "https://crcns.org/data-sets/vc/vim-1"
    gallantlab: "https://gallantlab.org/"
    paper: "https://doi.org/10.1038/nature06713"
  download_cli: "curl -O -J --user <crcns_username> https://portal.nersc.gov/project/crcns/download/vim-1/EstimatedResponses.mat.tar"
modeling:
  recommended_tasks:
    - voxelwise_encoding
    - zero_shot_image_identification
    - bayesian_image_reconstruction
    - receptive_field_mapping
  standard_splits: "Train voxelwise encoding weights exclusively on the 1,750 estimation natural images (2 repeats = 3,500 trials across 5 scan sessions); evaluate identification and reconstruction on the strictly disjoint 120 validation images (13 repeats = 1,560 trials)."
  noise_ceiling_or_repeat_structure: "13 independent repetitions of each of the 120 validation images allow tight estimation of single-trial vs. 13-trial-averaged explainable variance and SNR ceilings in V1–V4."
  key_pitfalls:
    - "Stimuli are 128 × 128 luminance-calibrated grayscale photographs masked within a circular 20° aperture with a central fixation square—apply the exact circular aperture and luminance linearization (gamma) before feeding RGB-pretrained vision backbones."
    - "EstimatedResponses.mat already stores deconvolved single-image BOLD response amplitudes per voxel alongside separate V1/V2/V3/V3A/V4/LO ROI index labels (`roi` vector)—do not re-convolve canonical HRFs on top of pre-estimated trial responses."
    - "Partial coronal slab covers occipital and posterior temporal areas (V1–LO) only; anterior ventral temporal, parietal, and prefrontal cortices are outside the imaging FOV."
citations:
  primary_bib_keys:
    - kay2008vim1
  related_bib_keys:
    - naselaris2009bayesian
  primary_doi_or_arxiv: "10.1038/nature06713"
