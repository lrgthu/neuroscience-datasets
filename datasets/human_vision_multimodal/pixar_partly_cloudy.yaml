modeling:
  recommended_tasks:
    - developmental_network_segregation_and_isc
    - reverse_correlation_social_event_encoding
    - age_prediction_and_pediatric_motion_benchmarking
  standard_splits: "Stratified 5-fold cross-validation across the 155 subjects balanced by age bracket (3–4 yo, 5 yr, 7 yr, 8–12 yr, and Adults) and framewise displacement (`FD`), or adult-reference (`N = 33`) -> pediatric developmental projection (`N = 122`)."
  noise_ceiling_or_repeat_structure: "Adult group (`N = 33`) inter-subject time-course correlation provides a high-SNR normative ceiling for evaluating developmental convergence across ages 3–12."
  key_pitfalls:
    - "Age-correlated head motion confound: Young children (`ages 3–5`) exhibit substantially higher framewise displacement (`FD`) and artifactual volumes than older children and adults—ALWAYS include mean `FD` and number of scrubbed artifact timepoints as explicit covariates + perform `CompCor` + spike regression before claiming developmental functional connectivity or ISC changes!"
    - "Exact 168-TR timeline offset: TRs `1–5` (`10 s`) are pre-movie black fixation screen and TRs `6–10` (`10 s`) are Disney/Pixar opening logos—align `mental`, `pain`, `social`, and `control` event regressors accurately to the movie start (`t = 10 s` after scan trigger) using the official BIDS/Nilearn event annotations."
    - "Pediatric brain template normalization: Normalizing 3-year-old brains directly to adult MNI152 requires careful inspection of `derivatives/preprocessed` registration quality and cortical thickness differences."
