summary_en: "Landmark pediatric-to-adult developmental movie fMRI dataset (N=155: 122 children ages 3–12 and 33 adults, OpenNeuro ds000228) watching the silent 5.6-minute Pixar short Partly Cloudy to map functional dissociation of the Theory-of-Mind and Pain networks."
summary_zh: "经典的儿童至成人社会脑发育自然动画电影 3T fMRI 基准（共 155 名被试：122 名 3–12 岁儿童与 33 名成人，OpenNeuro ds000228），通过观看 5.6 分钟无对白皮克斯短片《晴时多云》刻画心理理论（ToM）与疼痛共情网络的发育分化。"
scale:
  n_subjects: 155
  hours_per_subject: 0.1
  total_hours: 15.0
  n_stimuli: 1
  n_channels_or_voxels: "3.0 mm isotropic whole-brain 3T EPI (PACE prospective motion-corrected; MNI152 + group/individual ToM & Pain functional ROIs)"
  sampling_rate_or_tr: "TR = 2.0 s (168 TRs = 5.6 min continuous single-run scan)"
