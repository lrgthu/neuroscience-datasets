modeling:
  recommended_tasks:
    - image_reconstruction
    - ood_natural_to_synthetic_transfer
    - perception_to_imagery_reconstruction
  standard_splits: "Train decoders strictly on the 1,200 natural ImageNet images (5 repeats = 6,000 trials/subject); evaluate zero-shot pixel/structural/semantic reconstruction on 4 strictly disjoint test regimes: (1) 50 natural ImageNet images (24 repeats), (2) 40 colored geometric shapes (20 repeats), (3) 10 alphabetical letters (12 repeats), and (4) 25 mental imagery shapes/objects (20 repeats)."
  noise_ceiling_or_repeat_structure: "24 repeats on natural test images, 20 repeats on artificial shapes, and 12 repeats on letters enable both single-trial and multi-trial-averaged SNR scaling curves."
  key_pitfalls:
    - "Hallucination vs. faithful low-level geometry trap: Diffusion/GAN priors conditioned only on high-level CLIP semantics often hallucinate photorealistic textures on the **40 artificial geometric shapes** and **10 letters**—always benchmark on `ds001506`'s artificial shapes and letters to test true retinotopic fidelity versus natural-image prior memorization!"
    - "Distinct from `kamitani_god` (`ds001246`, 3.0 mm, TR=3.0 s, 9 s blocks): `deep_image_recon` (`ds001506`) upgrades spatial/temporal acquisition to `2.0 mm` isotropic multiband-4 (`TR = 2.0 s`, `8 s` blocks) and adds explicit OOD geometric shape + letter + shape-imagery sessions."
    - "Stimulus images are restricted by ImageNet/copyright distribution terms on OpenNeuro; request/rebuild exact stimulus tensors via KamitaniLab's `StimulusPresentation` / `Figshare` scripts using WordNet synset + frame IDs."
