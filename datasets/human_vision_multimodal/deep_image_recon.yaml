year: 2019
summary_en: "High-resolution 3T whole-brain fMRI benchmark (N=3, 2.0 mm isotropic, OpenNeuro ds001506) pairing 1,200 ImageNet training images (5 repeats) with 50 natural test images (24 repeats), 40 artificial colored shapes (20 repeats), 10 letters (12 repeats), and cued mental imagery for OOD pixel/latent reconstruction."
summary_zh: "京都大学神谷之康团队高分辨率深度图像重建 3T fMRI 基准（3 名被试，2.0 mm 各向同性，OpenNeuro ds001506），配对 1,200 张自然训练图（5 次重复）以及跨分布的 50 张自然测试图（24 次重复）、40 张人工彩色几何图形、10 个字母与心理想象任务。"
scale:
  n_subjects: 3
  hours_per_subject: 22.0
  total_hours: 66.0
  n_stimuli: 1300
  n_channels_or_voxels: "2.0 mm isotropic whole-brain 3T multiband-4 EPI (~6,000–8,500 visual cortex voxels/subj across V1, V2, V3, hV4, LOC, FFA, PPA)"
  sampling_rate_or_tr: "TR = 2.0 s (multiband 4; 8.0 s stimulus flashing at 2 Hz in perception / 8.0 s cued imagery = 4 TRs averaged per trial)"
