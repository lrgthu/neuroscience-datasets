summary_en: "Large-scale visual EEG suite bridging both NSD and THINGS: Alljoined1 (N=8, 64-ch research EEG on ~10k NSD/MS-COCO scenes, >46k epochs) and Alljoined-1.6M (N=20, 32-ch consumer wet-EEG spanning >1.67 million THINGS RSVP trials)."
summary_zh: "同时衔接 NSD 与 THINGS 生态的超大规模视觉脑电套件：包含 Alljoined1（8 名被试、64 通道科研级 EEG 观看 NSD/COCO 自然场景，>4.6 万试次）与 Alljoined-1.6M（20 名被试、32 通道低成本湿电极 EEG 采集逾 167 万次 THINGS 图像试次）。"
