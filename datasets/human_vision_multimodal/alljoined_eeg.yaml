modeling:
  recommended_tasks:
    - eeg_to_image_retrieval_and_reconstruction
    - cross_modal_eeg_nsd_fmri_alignment
    - consumer_vs_research_bci_scaling_laws
  standard_splits: "Alljoined1: NSD `shared1000` overlap subset for cross-modal fMRI-EEG alignment vs. subject-unique MS-COCO train trials. Alljoined-1.6M: Train on 16,540 THINGS images (1,654 concepts) and evaluate zero-shot retrieval on the 200 disjoint THINGS test concepts (high-repeat test partition, matching THINGS-EEG2!)."
  noise_ceiling_or_repeat_structure: "Massive per-subject trial counts (~83k trials/subject in Alljoined-1.6M) with high-repeat held-out 200-image test blocks enable empirical scaling-law curves across trials, subjects, and hardware SNR."
  key_pitfalls:
    - "Hardware SNR trade-off (`Alljoined-1.6M` 32-ch Emotiv FLEX vs. `THINGS-EEG2` 64-ch BrainVision actiCHamp): single-trial SNR is lower on consumer wet hardware—do not compare unnormalized retrieval accuracy across hardware tiers without accounting for channel count, sampling rate (`256 Hz`), and trial averaging!"
    - "Block/session temporal autocorrelation Trap (`Li et al. TPAMI 2021` classic EEG pitfall): ensure images from the same concept or contiguous RSVP block never straddle train and test splits; strictly use the official 200 disjoint test concepts!"
    - "Cross-modal NSD + Alljoined1 alignment: match exact `nsdId` / `cocoId` crop coordinates—cropped NSD square scenes (`8.4°`) differ from uncropped full-aspect COCO frames."
