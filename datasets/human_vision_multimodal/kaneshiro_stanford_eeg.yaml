year: 2015
summary_en: "Clean, fully randomized 128-channel visual ERP EEG benchmark (N=10 subjects, 5,184 trials/subject across 72 object exemplars in 6 categories, Stanford SDR bq914sc3730) serving as the canonical confound-free single-trial object-decoding reference."
summary_zh: "斯坦福大学完全随机化呈现的 128 通道高密度视觉物体识别 ERP 脑电基准（10 名被试，6 大类 72 张图像 × 72 次随机重复 = 5,184 试次/人，SDR bq914sc3730），是规避区组设计（Block-Design）时间漂移伪迹的标准洁净基准。"
scale:
  n_subjects: 10
  hours_per_subject: 1.5
  total_hours: 15.0
  n_stimuli: 72
  n_channels_or_voxels: "128-channel EGI HydroCel Geodesic Sensor Net (124 clean scalp electrodes retained in released MAT tensors)"
  sampling_rate_or_tr: "1,000 Hz raw acquisition; 62.5 Hz preprocessed single-trial epochs (-112 ms to +512 ms; 32 time samples/trial)"
brain_regions:
  - Occipitotemporal_Visual_Scalp
  - Whole-Scalp_128Ch_EGI
data_formats:
