id: algonauts_2019
name: "Algonauts Project 2019 Paired 3T fMRI & 306-Ch MEG Object Recognition Benchmark"
short_name: "Algonauts-2019"
category: human_vision_multimodal
species:
  - human
modalities:
  - fMRI_3T
