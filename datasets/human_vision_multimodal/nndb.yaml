year: 2020
summary_en: "Large-scale ecological movie-watching database (N=86 subjects, TR=1.0 s multiband-4, OpenNeuro ds002837) capturing uninterrupted full-length viewing of 10 diverse feature films (91–148 min each, ~165 total hours) paired with NIH Toolbox cognitive, emotional, and sensory phenotyping."
summary_zh: "大规模生态化完整长片观影神经影像数据库（86 名被试，TR=1.0 s 多频带采集，OpenNeuro ds002837），覆盖 10 部不同类型完整商业院线电影（每部 91–148 分钟，累计超 165 小时）及全套 NIH Toolbox 认知/情绪/感官行为测评。"
scale:
  n_subjects: 86
  hours_per_subject: 1.9
  total_hours: 165.0
  n_stimuli: 10
  n_channels_or_voxels: "1.5T Siemens Avanto 32-ch multiband-4 whole-brain EPI (3.2 mm isotropic; MNI152 ICA-denoised AFNI derivatives; bucketed under fMRI modality)"
  sampling_rate_or_tr: "TR = 1.0 s (multiband 4; 5,470–8,882 TRs per full-length film)"
brain_regions:
  - Early_Visual_and_Auditory_Cortex
  - Language_and_Social_STS_TPJ
