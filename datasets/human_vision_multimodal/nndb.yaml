modeling:
  recommended_tasks:
    - cross_movie_multimodal_encoding
    - individual_difference_brain_behavior_prediction
    - long_horizon_narrative_context_modeling
    - inter_subject_correlation_and_isfc
  standard_splits: "Between-movie generalization (train multimodal encoders on 7–8 films and evaluate zero-shot on 2–3 held-out genres, e.g. '500 Days of Summer' [N=20] or 'Citizenfour' [N=18]) AND within-movie subject splits for NIH Toolbox individual-difference prediction."
  noise_ceiling_or_repeat_structure: "Each participant watched 1 of 10 full-length films (`N = 20` for *500 Days of Summer*, `N = 18` for *Citizenfour*, `N = 6` each across the remaining 8 films), enabling per-movie group ISC ceilings."
  key_pitfalls:
    - "1.5T field strength & spatial resolution: Core `ds002837` v1.0 was acquired on a **1.5T Siemens MAGNETOM Avanto** (`3.2 mm` isotropic, multiband 4, `TR = 1.0 s`) to minimize acoustic scanner noise and susceptibility dropout in anterior temporal/orbitofrontal cortex during 2-hour films—account for lower spatial resolution and 1.5T BOLD contrast when pooling with 3T/7T movie datasets (note: catalog `modalities` uses `fMRI_3T` as the closest schema BOLD token)."
    - "Mid-movie rest/comfort breaks: Because full films run `91–148 minutes`, recordings were split into ~40–50 minute runs whenever participants requested breaks; use the preprocessed concatenated/aligned `derivatives/` time-series and exact word/face BIDS `events.tsv` timestamps rather than raw run indices!"
    - "Between-subject movie assignment (`1` film per subject): Subject cohorts across the 10 movies are **mutually disjoint**—cross-movie comparisons must control for between-cohort demographic/behavioral differences or align through shared anatomical/functional parcellations."
