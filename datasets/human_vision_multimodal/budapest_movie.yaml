modeling:
  recommended_tasks:
    - hyperalignment_and_connectivity_hyperalignment
    - social_face_identity_and_expression_encoding
    - multimodal_audiovisual_llm_alignment
  standard_splits: "Leave-one-run-out cross-validation across the 5 movie runs (~8.4 to ~13.3 min each), carefully trimming the 10-second (10 TRs) audiovisual overlap prepended to runs 2–5!"
  noise_ceiling_or_repeat_structure: "Synchronized 1.0 s sampling across N=25 subjects provides tight inter-subject correlation (ISC) and surface searchlight hyperalignment ceilings across occipital, temporal, and default-mode cortices."
  key_pitfalls:
    - "10-second run-transition overlap: Runs 2, 3, 4, and 5 each replay the final `10 seconds` (`10 TRs`) of the preceding run to maintain narrative continuity—you MUST discard overlapping boundary TRs (+ ~6–10 s hemodynamic washout) before leave-one-run-out evaluation or hyperalignment!"
    - "Out-of-scanner first half: Participants watched the first ~46 minutes of the movie **outside** the MRI scanner immediately prior to scanning so narrative context was established; `ds003017` covers only the second half (~50.5 minutes) of the film—align stimulus timestamps to the exact second-half cut specification in `mvdoc/budapest-fmri-data`."
    - "Auxiliary `hyperface` / dynamic localizer scans exist for the same Dartmouth cohort in companion repositories—match BIDS `sub-sidXXXXXX` subject hashes when combining localizer ROIs."
