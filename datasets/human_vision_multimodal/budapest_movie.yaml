year: 2020
summary_en: "High-temporal-resolution 3T multiband fMRI dataset (N=25, TR=1.0 s, 2.5 mm isotropic, OpenNeuro ds003017) recorded during the socially rich second half (~50.5 min across 5 runs) of Wes Anderson's The Grand Budapest Hotel, paired with dynamic face/object localizers."
summary_zh: "高时间分辨率社交叙事电影 3T 多频带 fMRI 数据集（25 名被试，TR=1.0 s，2.5 mm 各向同性，OpenNeuro ds003017），采集韦斯·安德森电影《布达佩斯大饭店》后半部（5 个 run 共约 50.5 分钟）观影响应及动态面孔/物体功能定位。"
scale:
  n_subjects: 25
  hours_per_subject: 1.5
  total_hours: 37.5
  n_stimuli: 5
  n_channels_or_voxels: "2.5 mm isotropic whole-brain 3T EPI + fMRIPrep fsaverage (icoorder 5/6) & MNI152 derivatives"
  sampling_rate_or_tr: "TR = 1.0 s (multiband 4; ~3,030 movie TRs across 5 contiguous runs)"
brain_regions:
  - Core_and_Extended_Face_Network_FFA_OFA_pSTS
