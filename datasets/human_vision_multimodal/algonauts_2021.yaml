year: 2021
summary_en: "Voxelwise 3T video-encoding benchmark (N=10 subjects, 2.5 mm isotropic) featuring 1,000 training videos (3 repeats) and 102 test videos (10 repeats) of 3-second naturalistic human/object/scene events across 9 visual ROIs (Mini Track) and whole-brain reliable voxels (Full Track)."
summary_zh: "Algonauts 2021 动态日常事件视频 3T fMRI 体素编码基准（10 名被试，1,000 段 3 秒训练视频 × 3 次重复 + 102 段测试视频 × 10 次重复），覆盖 9 个经典视觉功能区（Mini Track）与全脑高信噪比体素（Full Track）。"
scale:
  n_subjects: 10
  hours_per_subject: 5.0
  total_hours: 50.0
  n_stimuli: 1102
  n_channels_or_voxels: "2.5 mm isotropic 3T EPI (9 visual ROIs: V1–V4, LOC, EBA, FFA, STS, PPA in Mini Track; ~15k–25k reliable whole-brain voxels/subj in Full Track)"
  sampling_rate_or_tr: "TR = 1.75 s (multiband 2; single-video beta scalars per voxel & repeat)"
brain_regions:
  - V1
  - V2
  - V3
  - hV4
  - LOC
  - EBA
  - FFA
  - STS
  - PPA
  - Whole-Brain
data_formats:
