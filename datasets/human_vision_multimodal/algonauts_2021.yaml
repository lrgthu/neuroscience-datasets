  download_cli: "git clone https://github.com/Neural-Dynamics-of-Visual-Cognition-FUB/Algonauts2021_devkit.git"
modeling:
  recommended_tasks:
    - spatiotemporal_video_encoding
    - dorsal_lateral_ventral_stream_dissociation
    - video_foundation_model_benchmarking
  standard_splits: "Train voxelwise encoding models on 1,000 3-second videos (3 repeats/video, provided both trial-wise and repeat-averaged); evaluate noise-ceiling-normalized Pearson correlation on the 102 held-out test videos (10 repeats/video)."
  noise_ceiling_or_repeat_structure: "3 repeats per training video and 10 repeats per test video provide per-voxel split-half / Spearman-Brown reliability masks (voxels filtered by split-half reliability threshold p < 0.05 in Full Track)."
  key_pitfalls:
    - "Relationship to BOLD Moments Dataset (`bmd_moments` / `ds005165`): Algonauts 2021 (`Mini-Moments`) released pre-packaged `.pkl`/`.npz` ROI & reliable-voxel betas with withheld test ground truth during the challenge, whereas `Lahner et al. (2024)` (`ds005165`) subsequently released the complete raw BIDS time-series, all 102 test-set `GLMsingle` betas, and semantic annotations—use `ds005165` when full test ground truth or temporal TR dynamics are needed!"
    - "All 1,102 3-second clips were presented **without audio** during free viewing—do not feed audio tracks from original Moments-in-Time source videos into multimodal encoders, as auditory cortex responses reflect visual/multisensory inference only."
    - "Lateral stream ROIs (`EBA`, `STS`) strongly weight dynamic biological motion and social interaction cues that static single-frame `ImageNet`/`CLIP` backbones miss unless temporal frame dynamics or optical-flow/3D-video tokens are extracted."
