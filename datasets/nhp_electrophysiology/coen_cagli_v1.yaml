summary_en: "Utah array population recordings across 10 sessions in 3 anesthetized macaques (`CRCNS:pvc-8`) probing V1 classical-RF vs. surround contextual gating across 270 natural images at multiple aperture sizes plus gratings."
summary_zh: "麻醉猕猴初级视觉皮层 V1 多电极阵列群体记录（CRCNS `pvc-8`，3 只猕猴 10 个实验场次），通过对比经典感受野窗口（1°）与大视野（3°–6.7°）自然图像及光栅刺激，揭示自然视觉中周边抑制的灵活门控机制。"
scale:
  n_subjects: 3
  hours_per_subject: 6.0
  total_hours: 18.0
  n_stimuli: 540
  n_channels_or_voxels: "96-channel Utah microelectrode arrays across 10 sessions (~20–45 well-tuned V1 neurons per session; ~300+ total units)"
  sampling_rate_or_tr: "1,000 Hz spike-train bins (1 ms resolution over 100 ms ON + 200 ms OFF flashed presentation)"
brain_regions:
