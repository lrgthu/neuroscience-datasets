modeling:
  recommended_tasks:
    - surround_suppression_divisive_normalization
    - contextual_probabilistic_gating_models
    - v1_noise_correlation_and_population_coding
  standard_splits: "Session-stratified cross-validation holding out disjoint natural scene base images (grouping small `1°` RF-masked and large `3°–6.7°` full-context versions of the same scene into the same fold)."
  noise_ceiling_or_repeat_structure: "20 trial repetitions per unique image/aperture condition (`270` base natural scenes × `2` aperture sizes = `540` natural conditions + orientation/size-tuning gratings), enabling exact Fano factor, noise-correlation, and Spearman-Brown split-half reliability estimation."
  key_pitfalls:
    - "PAIRED APERTURE LEAKAGE (`1°` vs. `3°–6.7°`): Each natural scene appears both cropped to the classical receptive field (`1°` diameter) and uncropped with natural surround (`3°–6.7°`)—always split train/test by base scene ID so center pixel patches never leak across splits!"
    - "Anesthetized preparation (`sufentanil` paralysis/anesthesia): Eliminates microsaccadic eye drift (ideal for exact pixel-to-RF alignment), but alters cortical state, low-frequency shared fluctuations, and top-down attentional feedback compared with awake V1 (`Cadena-V1`, `TVSD`)."
    - "Center-alignment heterogeneity across array electrodes: The stimulus aperture was centered on the aggregate array receptive field; include only units whose mapped minimum response field lies strictly inside the `1°` small-aperture window when quantifying pure surround modulation!"
