modeling:
  recommended_tasks:
    - multi_region_recurrent_neural_networks_mrnn
    - inter_areal_communication_subspaces
    - flexible_rule_guided_sensorimotor_gating
    - oscillatory_lfp_spike_phase_routing
  standard_splits: "Session-wise trial splits stratified jointly by task rule (`Motion` vs. `Color` cue, `2` visual cue shapes per rule to dissociate rule identity from cue visual shape!), `4` motion directions, and `4` colors (`2 × 4 × 4 = 32` core conditions)."
  noise_ceiling_or_repeat_structure: "Percent explained variance (`ω^2` / bias-corrected `PEV`) across hundreds of trials per session, separating pure task-rule, sensory-color, sensory-motion, and saccadic-choice subspaces across all 6 simultaneously recorded regions."
  key_pitfalls:
    - "RULE CUE VISUAL IDENTITY CONFOUND: Each behavioral rule (`Categorize Motion` vs. `Categorize Color`) was signaled by **two sensory-distinct visual cue shapes**—always cross-generalize rule decoders *across* the two cue shapes (`Cue A -> Cue B`) so visual cue responses in V4/IT are never mistaken for abstract executive rule coding in PFC/LIP!"
    - "Unbalanced Regional Sampling Density: Because `dlPFC` (`1,020` sites), `LIP` (`807`), and `FEF` (`532`) have far more recorded channels than `IT` (`57`), `MT` (`123`), and `V4` (`155`), subsample equal neuron counts per area (`e.g., n = 50` bootstrap draws) before comparing regional dimensionality or decoding accuracy!"
    - "Stimulus-Irrelevant Sensory Leakage vs. Choice Axis: Contrary to early feedforward gating theories, irrelevant sensory features (`color` during `motion` rule and vice versa) remain strongly represented in `MT/V4` and even `PFC/FEF`—test communication subspace alignment (`Semedo/Kaufman` reduced-rank regression) rather than assuming early sensory suppression."
