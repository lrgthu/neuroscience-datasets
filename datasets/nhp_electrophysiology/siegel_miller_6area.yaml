summary_en: "Simultaneous acute multi-electrode recordings across 6 cortical regions (`MT`, `V4`, `IT`, `LIP`, `PFC`, `FEF`; 2,694 multi-unit sites in 2 macaques) during flexible rule-cued motion vs. color categorization."
summary_zh: "猕猴 6 大皮层脑区（MT、V4、IT、LIP、PFC、FEF；2 只恒河猴共 2,694 个记录位点）同步多电极电生理数据集，完整刻画规则线索驱动的运动方向对比颜色分类决策跨脑区信息流。"
scale:
  n_subjects: 2
  hours_per_subject: 35.0
  total_hours: 70.0
  n_stimuli: 32
  n_channels_or_voxels: "2,694 multi-unit & LFP recording sites simultaneously sampled across 6 areas (1,020 dlPFC, 807 LIP, 532 FEF, 155 V4, 123 MT, 57 IT)"
  sampling_rate_or_tr: "1,000 Hz spike trains & local field potentials (`LFP`) across cue, delay, stimulus, and saccadic choice epochs"
