modeling:
  recommended_tasks:
    - topographic_vision_models_tdann_som
    - low_dimensional_object_space_axis_coding
    - hierarchical_3stage_view_invariance_progression
  standard_splits: "Object-identity holdout across the `51` 3D/isolated objects (`51` objects × `24` views = `1,224` main multi-view stimuli, plus independent `1,593` broad natural object validation set) so all `24` in-depth rotation views of a held-out object stay in the same fold."
  noise_ceiling_or_repeat_structure: "Split-half trial consistency across `~8–15` repetitions per image; single neurons project linearly onto the top 2–25 principal components of deep network (`AlexNet fc6`) object space with high explainable variance."
  key_pitfalls:
    - "MULTI-VIEW OBJECT LEAKAGE (`51` Objects × `24` Angles = `1,224` Images): Random image splits across the `1,224`-stimulus set leak exact object identity across neighboring `15°` rotation views—always group CV folds by the `51` object IDs when testing view invariance across posterior, middle, and anterior IT stages!"
    - "MION Contrast-Agent Sign Inversion in Macaque fMRI: Macaque `3T` fMRI localizers use monocrystalline iron oxide nanoparticles (`MION`, blood-volume CBV contrast), whose hemodynamic deflection is **negative** for increased neural activity (`-ΔS/S`) and exhibits a distinct impulse response from human BOLD!"
    - "Isolated Foreground Objects on White/Blank Backgrounds: The core `1,224` and `1,593` stimulus sets present background-segmented objects (`aspect-ratio / stubby-vs-spiky` PC1-PC2 geometry); account for silhouette/aspect-ratio energy in V1/V4 controls before attributing PC1/PC2 tuning purely to high-level semantics."
