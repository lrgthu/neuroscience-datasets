summary_en: "Combined contrast-enhanced macaque fMRI, microstimulation, and targeted single-unit recordings across 4 repeating triple-stage IT networks (`Face`, `Body`, `Stubby`, `Spiky` — including newly discovered 'No-Man's-Land' zones) viewing 1,224 multi-view object images."
summary_zh: "结合对比剂增强猕猴全脑 fMRI、微电流刺激与靶向单细胞电生理（覆盖面孔、身体、短粗物体 Stubby 与尖细物体 Spiky 四大三级重复网络，观看 51 个物体的 1,224 张多视角图像），揭示下颞叶皮层低维连续物体空间拓扑图谱。"
scale:
  n_subjects: 4
  hours_per_subject: 20.0
  total_hours: 80.0
  n_stimuli: 1224
  n_channels_or_voxels: "Whole-IT MION-enhanced 3T fMRI maps (Monkeys M1–M4) + ~600+ fMRI-targeted single units across 12 hierarchical IT patches (4 networks × 3 posterior-to-anterior stages)"
  sampling_rate_or_tr: "fMRI MION block localizers (TR ~ 2.0 s) + extracellular spike trains during 150 ms ON / 150 ms OFF passive fixation"
