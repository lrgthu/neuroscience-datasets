    - ventral_stream_single_unit_encoding
  standard_splits: "10-fold cross-validation across the `300` natural photographs (and paired `50` intact vs. `50` Portilla-Simoncelli texture-scrambled scenes grouped by source image ID)."
  noise_ceiling_or_repeat_structure: "`~10–20` pseudorandom presentations per image (`5` images per `~1.5 s` RSVP fixation trial, `100 ms` ON / `100 ms` OFF), with split-half Spearman-Brown correction applied to single-unit PLS/Ridge correlations and Vinje-Gallant lifetime sparseness."
  key_pitfalls:
    - "CORRECT J. NEUROSCI. DOI (`10.1523/jneurosci.6125-11.2012`): Many downstream benchmark tables mis-cite a broken/unrelated J. Neurosci. correction string—always bind provenance to `10.1523/jneurosci.6125-11.2012` (Rust & DiCarlo, *J. Neurosci.* 32(30):10170-10182, 2012)!"
    - "Trial-to-Trial Poisson Variance Inflates Raw Sparseness: Computing Vinje-Gallant lifetime/population sparseness directly on finite-repeat (`~10` trial) mean firing rates systematically overestimates sparseness on lower-SNR units—subtract trial-variance bias or match SNR across V4 and IT!"
    - "Intact vs. Scrambled Pair Leakage: In the `100`-image (`50` intact + `50` scrambled) conjunction-selectivity sub-experiment, scrambled images share exact local V1/V2 multiscale wavelet marginals with their intact parent scenes—keep intact/scrambled pairs in the same CV fold!"
