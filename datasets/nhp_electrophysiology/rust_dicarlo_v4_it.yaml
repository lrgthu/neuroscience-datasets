summary_en: "Single-unit recordings of 143 V4 and 142 IT neurons in awake fixating macaques viewing 300 natural scenes and Portilla-Simoncelli scrambled counterparts (`BrainScore:Rust2012`), demonstrating balanced increases in conjunction selectivity and tolerance."
summary_zh: "清醒注视猕猴 V4（143 个单神经元）与 IT（142 个单神经元）观看 300 张自然场景及局部相位打乱对照图像的电生理基准（Brain-Score `Rust2012`），证明腹侧通路特征选择性与变换容忍度同步平衡增长并保持恒定群体稀疏度。"
scale:
  n_subjects: 2
  hours_per_subject: 15.0
  total_hours: 30.0
  n_stimuli: 300
  n_channels_or_voxels: "285 isolated single units (143 V4 + 142 IT neurons across 2 awake rhesus macaques; additional 50 natural + 50 scrambled paired subset)"
  sampling_rate_or_tr: "1 ms spike timestamps; canonical firing-rate integration in [70, 170] ms window (100 ms RSVP presentation)"
