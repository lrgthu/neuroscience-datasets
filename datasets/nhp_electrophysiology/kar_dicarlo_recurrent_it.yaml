modeling:
  recommended_tasks:
    - recurrent_vs_feedforward_object_recognition
    - image_level_object_solution_time_prediction
    - dynamic_it_population_decoding
  standard_splits: "Stratified cross-validation across the `1,320` (`1,318` valid OST-defined) binary/10-way core object recognition images (`10` object categories: bear, elephant, person, car, dog, apple, chair, plane, bird, zebra), pairing `Control` (feedforward-easy) and `Challenge` (primates succeed, shallow/deep feedforward CNNs fail) subsets."
  noise_ceiling_or_repeat_structure: "High trial repeat density (`~30–50` presentations per image) yields reliable per-image **Object Solution Time (`OST`)**—the exact millisecond (`10 ms` step) at which linear IT population decodability crosses the behavioral `I1` accuracy threshold (`split-half OST Spearman r ~ 0.85+`)."
  key_pitfalls:
    - "TIME-AVERAGED RATES HIDE RECURRENT SOLUTION LATENCY: Integrating IT spikes over a wide `[70, 170] ms` window masks the core phenomenon—`Control` images linearly resolve at `~100–115 ms`, whereas accuracy-matched `Challenge` images require `~135–155 ms` (`~30 ms` extra recurrent processing, suppressed by V4/IT pharmacological silencing)!"
    - "Undefined `OST` on Unsolved Images: For a small fraction of extreme occlusion/clutter stimuli where biological IT never reaches the behavioral `I1` threshold within `250 ms`, `OST` is `NaN` (`1,318` / `1,320` defined)—handle censored/undefined latencies explicitly without zero-imputation!"
    - "Matching Feedforward Depth vs. Recurrent Unrolling: Ultra-deep `150+` layer ResNets partially mimic challenge-image accuracy via depth, whereas biological time-step alignment (`Kar2019-ost`) specifically requires dynamic recurrent trajectories (`CORnet-S`, `ConvRNN`, continuous-time ODEs) mapped onto physical milliseconds."
