summary_en: "Millisecond-resolved chronic Utah array recordings across 424 macaque IT sites on 1,320 natural and synthetic object images (`BrainScore:Kar2019-ost`), isolating late (`+30 ms` delayed) recurrent object solution times on feedforward-challenging images."
summary_zh: "猕猴下颞叶皮层（IT，424 个慢性阵列位点）观看 1,320 张自然与合成物体识别图像的毫秒级神经潜伏期基准（Brain-Score `Kar2019-ost`），定量揭示前馈困难图像依赖额外 ~30 ms 循环反馈回路完成线性可分。"
scale:
  n_subjects: 2
  hours_per_subject: 25.0
  total_hours: 50.0
  n_stimuli: 1320
  n_channels_or_voxels: "424 chronic multi-unit IT sites (plus V4 sites) across 2 awake macaques + pooled primate/human behavioral accuracy"
  sampling_rate_or_tr: "10 ms sliding linear-decoder bins across [70, 250] ms post-stimulus onset (100 ms image flash)"
