modeling:
  recommended_tasks:
    - v1_vs_v2_functional_dissociation
    - higher_order_texture_modulation_index
    - early_ventral_stream_brainscore_alignment
  standard_splits: "Stratified 10-fold cross-validation grouped by the `15` Portilla-Simoncelli texture families (`15` families × `2` types [naturalistic vs. spectrally matched noise] × `10` stochastic samples = `300` images; public subset `135` / full `300`)."
  noise_ceiling_or_repeat_structure: "20 pseudorandom trial repetitions per unique texture/noise sample, yielding high single-unit internal consistency (~0.85–0.92 Spearman-Brown ceiling)."
  key_pitfalls:
    - "TEXTURE-FAMILY LEAKAGE ACROSS STOCHASTIC SAMPLES: Each of the 15 base texture families contributes 10 independent Portilla-Simoncelli synthesis samples and 10 spectrally matched noise samples—random image splits leak exact power spectra and Gram statistics across folds; always group splits by `texture_family`!"
    - "Aggregate PLS/Ridge `R` vs. Texture Modulation Index (`TMI`): A linear V1-like filter bank can achieve moderate raw `R` on both V1 and V2 via shared spectral energy while completely failing to reproduce the sharp V1 (`TMI ~ 0.0`) vs. V2 (`TMI > 0.2`) dissociation—evaluate both raw encoding `R` and the naturalistic-minus-noise modulation contrast!"
    - "Aperture & eccentricity matching (`4°` circular raised-cosine window centered on each single unit's mapped RF in anesthetized macaques): Match model field-of-view (`4°`) to the stimulus subtense before pooling spatial activations."
