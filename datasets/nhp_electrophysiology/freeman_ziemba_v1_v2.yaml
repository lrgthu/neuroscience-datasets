summary_en: "Single-unit recordings of 102 V1 and 103 V2 neurons across 13 macaques viewing Portilla-Simoncelli naturalistic textures vs. spectrally matched phase-scrambled noise (`BrainScore:FreemanZiemba2013`), isolating higher-order V2 correlation sensitivity."
summary_zh: "猕猴 V1（102 个单神经元）与 V2（103 个单神经元）自然纹理对比频谱匹配噪声基准（Brain-Score `FreemanZiemba2013`），定量分离出次级视觉皮层 V2 对高阶局部相位/尺度统计量的特异敏感性。"
