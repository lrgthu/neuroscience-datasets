summary_en: "Awake fixating macaque V1 laminar silicon-probe recordings (166 well-isolated neurons across 2 monkeys) viewing 7,250 grayscale ImageNet photographs and ConvNet texture/feature metamers, establishing deep features over classical Gabor banks."
summary_zh: "清醒注视猕猴初级视觉皮层 V1 线性硅探针数据集（2 只恒河猴共 166 个高信噪比神经元，观看 7,250 张 ImageNet 自然图像与深度卷积纹理合成图像），奠定了深度网络特征超越经典 Gabor 能量模型的定量基准。"
scale:
