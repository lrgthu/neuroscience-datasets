  hours_per_subject: 8.0
  total_hours: 16.0
  n_stimuli: 7250
  n_channels_or_voxels: "166 well-isolated V1 single/multi-units recorded via 32-channel linear silicon probes across 17 sessions"
  sampling_rate_or_tr: "30 kHz broadband electrophysiology; spike counts integrated in [40, 100] ms post-onset window (60 ms presentation)"
