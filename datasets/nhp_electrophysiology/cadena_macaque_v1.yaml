    - v1_system_identification_encoding
    - gabor_wavelet_vs_deep_convnet_comparison
    - texture_metamer_invariance_probing
    - spatial_feature_factorized_readout
  standard_splits: "80% training /validation split on single-/few-repeat images (`5,800` images) + fixed held-out `20%` test split (`1,450` images = 290 seed ImageNet frames × 5 conditions) with high-repeat reliability."
  noise_ceiling_or_repeat_structure: "Fraction of explainable variance explained (`FEV`), computed by subtracting trial-to-trial Poisson/neural observation noise estimated across 20–40 test-set repetitions and filtering units with `FEV >= 0.15`."
  key_pitfalls:
    - "IMAGE-FAMILY LEAKAGE ACROSS SYNTHETIC METAMERS: The 7,250 stimuli consist of 1,450 source ImageNet patches plus 4 Gatys-style ConvNet synthetic variants (`conv1_1`, `conv2_1`, `conv3_1`, `conv4_1` Gram-matrix reconstructions) derived from those exact 1,450 seeds—always group train/val/test splits by source seed ID so original and synthesized twins never straddle train and test!"
    - "Short `60 ms` flash without inter-stimulus blank (`~16.7 Hz` continuous RSVP stream during `2.1 s` fixation trials): late sustained or surround-feedback components beyond `+100 ms` overlap with the next flashed frame—align strictly to the canonical `[40, 100] ms` transient V1 integration window or fit temporal deconvolution kernels!"
    - "Microsaccade & small fixation eye drifts (`<0.5°` radius window) shift small parafoveal V1 receptive fields (`~0.3°–0.8°` diameter at `1°–3°` eccentricity); enforce spatial L1-sparse / Gaussian readout masks centered on each unit's receptive field."
