    - preparatory_nullspace_to_movement_potent_transition
    - autonomous_motor_cortex_lfads_rnn_generation
    - multi_session_neural_stitching
  standard_splits: "Trial-stratified splits across `27` to `108` straight and curved-barrier delayed-reach conditions (`DANDI:000070` spans 10 multi-session center-out/maze recordings across Monkeys Jenkins & Nitschke; `MC_Maze` in `DANDI:000128` provides the standardized co-smoothing subset)."
  noise_ceiling_or_repeat_structure: "Condition-averaged peri-movement (`[-50, +250] ms` around movement onset) trajectory `R^2`, skew-symmetric `jPCA` fit ratio (`R^2_skew / R^2_unconstrained`), and shuffle/surrogate covariance-matched null controls (`Elsayed & Cunningham 2017` TMA)."
  key_pitfalls:
    - "CROSS-CONDITION MEAN (`CIS`) SUBTRACTION & TEMPORAL SMOOTHING ARTIFACTS: Standard `jPCA` subtracts the cross-condition mean (Condition-Invariant Signal `CIS`) and applies Gaussian smoothing (`σ ~ 20–30 ms`); note that temporally smooth tuning-curve shifts can produce illusory rotations unless tested against **Tensor Maximum Entropy (`TME`)** surrogates preserving exact marginal neuron/time/condition covariances!"
    - "Movement-Onset vs. Go-Cue Alignment: Preparatory activity aligns tightly to target/go cues, whereas rotational execution dynamics (`~1.5–2.5 Hz`) lock strictly to physical **movement onset** (`hand speed > threshold`)—misaligning trials by reaction-time jitter smears rotational phase!"
    - "Cross-Session Unit Non-Overlap in `DANDI:000070`: When training multi-session foundation models (`POYO`, `NDT2`) across the 10 NWB sessions in `DANDI:000070`, treat unit identities as session-specific (or apply manifold stitching) because chronic array micro-motion shifts recorded neurons across days."
