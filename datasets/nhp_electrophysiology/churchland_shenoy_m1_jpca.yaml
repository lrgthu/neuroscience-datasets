summary_en: "Landmark macaque M1 and PMd reaching recordings (`DANDI:000070` NWB + jPCA suite across Monkeys J, N, A, B; ~1,900+ units across center-out and curved-maze tasks) revealing quasi-oscillatory rotational population dynamics during non-periodic arm reaches."
summary_zh: "猕猴初级运动皮层（M1）与背侧前运动皮层（PMd）经典伸臂运动群体电生理数据集（`DANDI:000070` NWB 格式与 jPCA 套件），首次揭示非周期单次伸臂运动中由预备态初始条件驱动的低维旋转动力学轨迹。"
