modeling:
  recommended_tasks:
    - ventral_stream_pls_ridge_alignment
    - transformation_tolerance_analysis
    - cka_rsa_identifiability_benchmarking
  standard_splits: "10-fold cross-validation stratified by object identity (holding out whole 3D objects, not random pose renders of the same object!) across the 3,200 public (or 5,760 full) High-Variation (HV) images."
  noise_ceiling_or_repeat_structure: "High repeat count (~28–50 presentations per image) yields very tight split-half Spearman-Brown internal consistency (~0.80–0.90 median r in IT)."
  key_pitfalls:
    - "OBJECT-IDENTITY vs. IMAGE-RANDOM SPLITS: Each of the 64 3D objects appears ~50-90 times across different positions/rotations/backgrounds—random image splits leak exact 3D mesh identity and inflate IT encoding scores relative to true object-holdout generalization!"
    - "Synthetic composite renders (3D Grayscale meshes pasted onto random natural sunrise/landscape backgrounds without cast shadows) lack natural scene context and ecological color cues—pair with natural-image datasets (TVSD / NSD) before generalizing claims!"
    - "Standard Brain-Score PLS (`n_components=25`) vs. Ridge CV vs. linear CKA rank models differently under high-dimensional feature spaces—always lock and report the exact regression/similarity estimator."
