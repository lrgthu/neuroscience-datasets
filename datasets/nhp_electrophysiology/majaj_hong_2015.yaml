summary_en: "Foundational Brain-Score ventral-stream benchmark recording 256 public multi-unit sites (88 V4, 168 IT) in 2 macaques viewing 5,760 rendered 3D object images under controlled pose, scale, and background variation."
summary_zh: "Brain-Score 最核心的猕猴腹侧通路物体识别基准（2 只猕猴 V4 区 88 通道、IT 区 168 通道共 256 个神经位点，观看 64 个三维物体在复杂背景下的姿态/尺度/位置变化图像，共 5,760 张 × ~28-50 次重复）。"
