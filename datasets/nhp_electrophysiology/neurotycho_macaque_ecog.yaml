  standard_splits: "Contiguous chronological block splits within/across chronic months (`e.g., first 10–15 min train, final 5 min test`, plus longitudinal multi-month out-of-session drift evaluation across Monkeys Chibi, George, Su, Kin2, Kuma)."
  noise_ceiling_or_repeat_structure: "Continuous 3D wrist/shoulder/elbow trajectory Pearson `r` (`~0.75–0.88` asynchronous decoding across months without daily recalibration) and paired awake → loss-of-consciousness → recovery state transitions."
  key_pitfalls:
    - "COMMON-REFERENCE LEAKAGE IN WHOLE-HEMISPHERE GRANGER / CONNECTIVITY: Raw 128-channel ECoG shares a single subdural/cranial reference electrode, inducing spurious zero-lag coherence and false long-range Granger causality—always apply **bipolar local re-referencing** (subtracting adjacent grid neighbors, yielding `~64` local dipoles) or Laplacian spatial filtering before directed connectivity analysis!"
    - "Line Noise (`50 Hz` Eastern Japan AC Mains!): Recordings were acquired at RIKEN Wako (Saitama, Eastern Japan), where power-line interference is **`50 Hz` (`100 Hz`, `150 Hz` harmonics)**—do NOT blindly apply a `60 Hz` US notch filter while leaving `50 Hz` untouched!"
    - "Autocorrelated Continuous Time-Series Splits: Never randomly shuffle `100 ms` spectrogram windows on continuous food-tracking or anesthesia recordings—use strictly contiguous temporal blocks with `>=10 s` guard gaps!"
