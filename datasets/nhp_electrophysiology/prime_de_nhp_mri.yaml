modeling:
  recommended_tasks:
    - cross_species_macaque_human_connectome_alignment
    - nhp_cortical_gradient_and_parcellation_discovery
    - multi_site_scanner_anesthesia_harmonization
    - awake_naturalistic_movie_intersubject_correlation
  standard_splits: "Leave-one-site-out (`LOSO`) or site-stratified subject splits across the >25 participating sites (strictly separating **awake fixating/movie** cohorts such as NIMH, Oxford-awake, Rockefeller, NKI from **isoflurane/ketamine anesthetized** cohorts!)."
  noise_ceiling_or_repeat_structure: "Multi-run within-subject scan-rescan functional connectivity fingerprinting (`I2C2` / geodesic connectome similarity), `PCP-QAP` automated quality metrics, and inter-subject correlation (`ISC`) on awake movie-viewing cohorts."
  key_pitfalls:
    - "AWAKE vs. ANESTHETIZED & MION vs. BOLD SITE HETEROGENEITY: `PRIME-DE` intentionally aggregates diverse protocols—some sites scanned **awake** macaques with **MION** contrast (`negative` CBV deflection, high SNR), whereas others scanned **isoflurane/propofol-anesthetized** macaques with native **BOLD** (`positive` deflection, dose-dependent thalamocortical suppression); NEVER pool raw time series across sites without harmonizing contrast polarity (`-1 × MION`), anesthesia state, and ComBat/site covariates!"
    - "Human MRI Skull-Stripping & Template Tools Fail Catastrophically on Macaques: Thick temporalis muscles, smaller brain volume (`~90 cm^3` vs. `1,300 cm^3`), and sphinx/supine B0 susceptibility distortions break standard `FSL BET` / `fMRIPrep` defaults—use dedicated NHP pipelines (`PREEMACS`, `nhp-abcd-bids-pipeline`, `AFNI @animal_warper`, `U-Net Brain Extraction` on `NMT v2` / `Yerkes19`)!"
    - "Species Sub-Composition (*Macaca mulatta* vs. *Macaca fascicularis*): Check `participants.tsv` per site—while predominantly rhesus macaque (*M. mulatta*), several cohorts include cynomolgus (*M. fascicularis*) differing in body/brain scaling."
