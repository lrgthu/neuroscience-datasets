summary_en: "Global open-science consortium (`AWS:s3://fcp-indi/data/Projects/PRIME-DE`) aggregating >25 international collections and >250 macaques (`217` in initial 22-site release) with BIDS structural T1w/T2w, diffusion dMRI, awake naturalistic movie, and resting-state 3T/7T/9.4T fMRI."
summary_zh: "全球非人灵长类磁共振开放联盟（`PRIME-DE`，托管于 AWS S3 `fcp-indi`），汇集全球 >25 个研究中心、>250 只恒河猴与食蟹猴（首期 22 站点 217 只）的 BIDS 格式结构像、扩散张量成像及清醒电影观看/麻醉静息态 3T/7T/9.4T fMRI。"
