  hours_per_subject: 1.5
  total_hours: 375.0
  n_stimuli: null
  n_channels_or_voxels: "Whole-brain macaque isotropic/sub-millimeter structural (0.3–0.8 mm), dMRI, and functional EPI (0.75–2.0 mm across 3T, 7T, and 9.4T scanners; NMT v2 / Yerkes19 surface templates)"
  sampling_rate_or_tr: "fMRI TR ~ 0.75–2.6 s across multi-site 3T, 7T, and ultra-high-field 9.4T protocols"
